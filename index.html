<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dobe一日渐进规划｜A/B方案对比</title>
  <style>
    :root {
      color-scheme: light dark;
      --page-bg: light-dark(#f4f6f9, #141619);
      --bar-bg: light-dark(rgba(255,255,255,.96), rgba(29,31,35,.96));
      --text: light-dark(#24272d, #f2f3f5);
      --muted: light-dark(#626973, #aeb4bd);
      --border: light-dark(#d9dde4, #3d424a);
      --active: light-dark(#365fd9, #86a2ff);
      --active-bg: light-dark(#edf2ff, #28355c);
      --shadow: light-dark(0 8px 24px rgba(35,43,58,.12), 0 8px 24px rgba(0,0,0,.3));
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--page-bg);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    .plan-switcher {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr);
      align-items: center;
      gap: 18px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bar-bg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }
    .plan-title strong { display: block; font-size: 16px; font-weight: 700; }
    .plan-title span, .plan-state span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .plan-tabs {
      display: flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--page-bg);
    }
    .plan-tab {
      min-width: 180px;
      padding: 9px 14px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      text-align: left;
    }
    .plan-tab strong { display: block; color: inherit; font-size: 14px; }
    .plan-tab span { display: block; margin-top: 2px; font-size: 11px; }
    .plan-tab[aria-pressed="true"] {
      background: var(--active-bg);
      color: var(--active);
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }
    .plan-state { justify-self: end; text-align: right; }
    .plan-state b { color: var(--active); font-size: 13px; }
    .plan-views { position: relative; min-height: 0; }
    .plan-view { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--page-bg); }
    .plan-view[hidden] { display: none; }
    @media (max-width: 900px) {
      .plan-switcher { grid-template-columns: 1fr; gap: 9px; padding: 10px 12px; }
      .plan-title, .plan-state { text-align: left; justify-self: stretch; }
      .plan-state span { display: none; }
      .plan-tabs { width: 100%; }
      .plan-tab { min-width: 0; flex: 1; }
    }
  </style>
</head>
<body>
  <header class="plan-switcher" aria-label="剧情方案切换">
    <div class="plan-title">
      <strong>Dobe一日渐进规划｜A/B方案对比</strong>
      <span>两种开局身份与剧情路径对比</span>
    </div>
    <nav class="plan-tabs" aria-label="选择方案">
      <button class="plan-tab" type="button" data-plan="a" aria-pressed="true">
        <strong>方案 A</strong>
        <span>外乡人转化</span>
      </button>
      <button class="plan-tab" type="button" data-plan="b" aria-pressed="false">
        <strong>方案 B</strong>
        <span>本地见习生</span>
      </button>
    </nav>
    <div class="plan-state" aria-live="polite">
      <b id="active-plan-name">正在查看：方案 A · 外乡人转化</b>
      <span id="active-plan-note">切换方案查看完整规划</span>
    </div>
  </header>

  <main class="plan-views">
    <iframe class="plan-view" id="plan-a" src="dobe-plan-a-outsider.html" title="方案 A：外乡人转化"></iframe>
    <iframe class="plan-view" id="plan-b" src="dobe-plan-b-local-prospect.html" title="方案 B：本地见习生" hidden></iframe>
  </main>

  <script>
    (() => {
      const plans = {
        a: {
          name: '正在查看：方案 A · 外乡人转化',
          note: '切换方案查看完整规划'
        },
        b: {
          name: '正在查看：方案 B · 本地见习生',
          note: '切换方案查看完整规划'
        }
      };
      const buttons = [...document.querySelectorAll('[data-plan]')];
      const frames = {
        a: document.getElementById('plan-a'),
        b: document.getElementById('plan-b')
      };
      const name = document.getElementById('active-plan-name');
      const note = document.getElementById('active-plan-note');
      let activePlan = null;

      function getReadingWindow(plan) {
        const outerWindow = frames[plan]?.contentWindow;
        const innerFrame = outerWindow?.document.querySelector('iframe');
        return innerFrame?.contentWindow || outerWindow;
      }

      function readProgress(plan) {
        try {
          const readingWindow = getReadingWindow(plan);
          const root = readingWindow.document.documentElement;
          const body = readingWindow.document.body;
          const height = Math.max(root.scrollHeight, body?.scrollHeight || 0);
          const top = readingWindow.scrollY || root.scrollTop || body?.scrollTop || 0;
          const maxScroll = Math.max(height - readingWindow.innerHeight, 1);
          return Math.min(Math.max(top / maxScroll, 0), 1);
        } catch {
          return null;
        }
      }

      function applyProgress(plan, progress, attempt = 0) {
        if (progress == null) return;
        try {
          const readingWindow = getReadingWindow(plan);
          const root = readingWindow.document.documentElement;
          const body = readingWindow.document.body;
          const height = Math.max(root.scrollHeight, body?.scrollHeight || 0);
          const maxScroll = Math.max(height - readingWindow.innerHeight, 0);
          if ((!readingWindow.innerHeight || !height) && attempt < 12) {
            requestAnimationFrame(() => applyProgress(plan, progress, attempt + 1));
            return;
          }
          readingWindow.scrollTo(0, Math.round(maxScroll * progress));
        } catch {
          if (attempt < 12) requestAnimationFrame(() => applyProgress(plan, progress, attempt + 1));
        }
      }

      function selectPlan(plan, updateUrl = true) {
        const next = plans[plan] ? plan : 'a';
        const progress = activePlan && activePlan !== next ? readProgress(activePlan) : null;
        buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.plan === next)));
        Object.entries(frames).forEach(([key, frame]) => { frame.hidden = key !== next; });
        name.textContent = plans[next].name;
        note.textContent = plans[next].note;
        activePlan = next;
        if (progress != null) requestAnimationFrame(() => applyProgress(next, progress));
        if (updateUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set('plan', next.toUpperCase());
          history.replaceState({ plan: next }, '', url);
        }
      }

      buttons.forEach(button => button.addEventListener('click', () => selectPlan(button.dataset.plan)));
      const initial = new URLSearchParams(window.location.search).get('plan');
      selectPlan(initial?.toLowerCase() === 'b' ? 'b' : 'a', false);
    })();
  </script>
</body>
</html>
