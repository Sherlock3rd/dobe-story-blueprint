:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {

* {

.btn {

}

.btn:not(:disabled):hover {

  background: var(--foreground);

.btn-primary .text-muted {

.form-label {

  margin-bottom: 6px;

  min-height: 28px;
  padding: 0 8px;
  outline: none;

  border-radius: var(--radius-lg);

  background: var(--secondary);

.form-control:focus-visible {

  box-shadow: inset 0 0 0 1px var(--ring);

.form-control:disabled,
.form-select:disabled {

  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:

.form-select:focus-visible {

.form-check-input {

  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:

    border-color 150ms,

  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;

  &lt;div class=&quot;dc-wrap&quot; id=&quot;dc-overview&quot;&gt;
    &lt;div class=&quot;dc-kicker&quot;&gt;一日版本 · 90 分钟渐进体验&lt;/div&gt;
    &lt;h1&gt;Dobe一日渐进规划&lt;/h1&gt;

    &lt;section class=&quot;dc-section dc-part&quot; id=&quot;dc-part-1&quot; aria-labelledby=&quot;dc-part-1-title&quot;&gt;
      &lt;h2 id=&quot;dc-part-1-title&quot;&gt;Part 1 · 目前已确定的信息&lt;/h2&gt;
      &lt;p class=&quot;dc-note&quot;&gt;以下内容整理自《一日渐进线汇总一图流》的有效“基础信息”框；帮派树结构统一放到 Part 4。&lt;/p&gt;

      &lt;h3 id=&quot;dc-confirmed-docs&quot;&gt;关联文档&lt;/h3&gt;
      &lt;div class=&quot;dc-link-list&quot;&gt;
        &lt;a href=&quot;https://t6bdpf8yjg.feishu.cn/wiki/ZjSowGJvPiXaA5k3nokcHjHEnhe&quot;&gt;&lt;strong&gt;Dobe 记忆点梳理&lt;/strong&gt;&lt;span&gt;叙事与记忆点来源&lt;/span&gt;&lt;/a&gt;
        &lt;a href=&quot;https://t6bdpf8yjg.feishu.cn/wiki/OMqDwrtSaizj4lkssBHcH4R2nxd?sheet=JmzW2M&quot;&gt;&lt;strong&gt;DOBE世界观方案 - 摩托帮&lt;/strong&gt;&lt;span&gt;帮派世界观与职级命名来源&lt;/span&gt;&lt;/a&gt;
        &lt;a href=&quot;https://t6bdpf8yjg.feishu.cn/sheets/XDBMs2LLnhcjB1tTWZ5c570fnbd?sheet=d4nknv&quot;&gt;&lt;strong&gt;帮派树与章节体与会议&lt;/strong&gt;&lt;span&gt;章节节点与会议结构来源&lt;/span&gt;&lt;/a&gt;
        &lt;a href=&quot;https://t6bdpf8yjg.feishu.cn/wiki/Url8w5jzIi7egukzDsHcR4y1nRi?sheet=5b3ec5&amp;amp;table=tblXtHbB5XD5buPw&amp;amp;view=vewnVSvZqi&quot;&gt;&lt;strong&gt;七月 Demo 台本&lt;/strong&gt;&lt;span&gt;商业街开始后的剧情顺序与场景元素来源&lt;/span&gt;&lt;/a&gt;
      &lt;/div&gt;

      &lt;h3 id=&quot;dc-confirmed-framework&quot;&gt;内容与成长框架&lt;/h3&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-confirmed-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;范围&lt;/th&gt;&lt;th&gt;已确定内容&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;叙事&lt;/td&gt;&lt;td&gt;以“记忆点”组织叙事推进&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;车配件养成&lt;/td&gt;&lt;td&gt;等级、品质&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;枪械养成&lt;/td&gt;&lt;td&gt;等级；星级仍待确认&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;英雄养成&lt;/td&gt;&lt;td&gt;等级、技能；星级仍待确认&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;SUP&lt;/td&gt;&lt;td&gt;竞速、枪战关、碰撞型枪战异化关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;推关&lt;/td&gt;&lt;td&gt;独立战斗循环&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;城建&lt;/td&gt;&lt;td&gt;接管、碎片化升级、升级&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;待确认项&lt;/td&gt;&lt;td&gt;模拟经营、小游戏&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

      &lt;h3 id=&quot;dc-confirmed-buildings&quot;&gt;确定建筑与功能&lt;/h3&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-building-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;建筑名&lt;/th&gt;&lt;th&gt;确定功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Clubhouse&lt;/td&gt;&lt;td&gt;帮派议会演出 / 帮派管理（之后模拟经营小人）/ 推关挂机产出&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;修车厂&lt;/td&gt;&lt;td&gt;载具改装；第一个解锁建筑&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;废车回收场&lt;/td&gt;&lt;td&gt;高级资源：零件；产载具部件&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;商业街&lt;/td&gt;&lt;td&gt;基础资源：钱&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;物资中转站 / 运输公司&lt;/td&gt;&lt;td&gt;基础资源：物资&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;加油站&lt;/td&gt;&lt;td&gt;基础资源：汽油（统一资源口径：油）&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

      &lt;h3 id=&quot;dc-confirmed-anchors&quot;&gt;版本锚点&lt;/h3&gt;
      &lt;div class=&quot;dc-rules&quot;&gt;
        &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;一日版本终点：&lt;/strong&gt;玩家成为 President（会长）&lt;/span&gt;
        &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;正式版预期：&lt;/strong&gt;取得 Clubhouse 后解锁第二段帮派树，节点可能对应联盟玩法解锁&lt;/span&gt;
        &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;一日版调整：&lt;/strong&gt;Clubhouse 的取得位置允许灵活调整&lt;/span&gt;
        &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;前 10 分钟：&lt;/strong&gt;允许先使用功能，但不代表真正取得对应建筑&lt;/span&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-section dc-part&quot; id=&quot;dc-part-2&quot; aria-labelledby=&quot;dc-part-2-title&quot;&gt;
      &lt;h2 id=&quot;dc-part-2-title&quot;&gt;Part 2 · 渐进规划&lt;/h2&gt;
      &lt;p class=&quot;dc-note&quot;&gt;先看整体因果与六幕承接关系，再逐幕查看分钟级循环。&lt;/p&gt;
      &lt;h3 id=&quot;dc-story-causal-title&quot;&gt;整体剧情因果&lt;/h3&gt;
      &lt;div class=&quot;dc-causal&quot;&gt;
        &lt;div&gt;&lt;b&gt;送货竞速&lt;/b&gt;&lt;br&gt;&lt;span&gt;速度被看见&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;死亡名单&lt;/b&gt;&lt;br&gt;&lt;span&gt;个人无法自保&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;加入与转正&lt;/b&gt;&lt;br&gt;&lt;span&gt;保护变成责任&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;承接产业&lt;/b&gt;&lt;br&gt;&lt;span&gt;共同资产转交玩家管理&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;佣金与地下赛事&lt;/b&gt;&lt;br&gt;&lt;span&gt;产业产出变成组织行动&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;庆功与叛徒&lt;/b&gt;&lt;br&gt;&lt;span&gt;追击比利、救回梅丽尔&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;复玩与晋升&lt;/b&gt;&lt;br&gt;&lt;span&gt;证明能领导全帮&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;h3 id=&quot;dc-act-relations-title&quot;&gt;六幕关系&lt;/h3&gt;
      &lt;div class=&quot;dc-overview&quot; aria-label=&quot;六幕时间分配与承接关系&quot;&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;0–7&lt;/span&gt;&lt;b&gt;序幕&lt;/b&gt;&lt;span&gt;被卷入&lt;br&gt;4 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;7–16&lt;/span&gt;&lt;b&gt;第一幕&lt;/b&gt;&lt;span&gt;见习打工 / 押送 / 转正&lt;br&gt;6 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;16–30&lt;/span&gt;&lt;b&gt;第二幕&lt;/b&gt;&lt;span&gt;接管改装厂 / 商业街&lt;br&gt;6 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;30–45&lt;/span&gt;&lt;b&gt;第三幕&lt;/b&gt;&lt;span&gt;地下赛事 / 庆功 / 比利叛变&lt;br&gt;6 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;45–60&lt;/span&gt;&lt;b&gt;第四幕&lt;/b&gt;&lt;span&gt;加油站 / 梅丽尔救援 / 物流中心&lt;br&gt;6 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;60–90&lt;/span&gt;&lt;b&gt;第五幕&lt;/b&gt;&lt;span&gt;叛徒残党 / 汉克回归 / 晋升会长&lt;br&gt;6 循环&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;1&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;0:00–7:00&lt;/span&gt;&lt;b&gt;序幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;被卷入&lt;/b&gt;&lt;span&gt;交货、认识车队、试用改装厂、遭到死亡威胁。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP ×2、骑行 ×1、改装小游戏 ×1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;演出约 80s&lt;/b&gt;&lt;span&gt;占本幕 19%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;无&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-sup-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;0:00–1:40&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L01 送货竞速&lt;/div&gt;&lt;span class=&quot;dc-first-badge dc-first-sup-badge&quot;&gt;新玩法解锁 · SUP 首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;竞速 SUP ×1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;通话中遇到临检，科尔用速度甩开警车。&lt;/td&gt;&lt;td&gt;按时交货&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;目标+追车建立&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;0:20–1:20&lt;/time&gt; 竞速 SUP ×1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;1:20–1:40&lt;/time&gt; 结算/转场操作&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;SUP 正式解锁：单局约 60 秒，后续复用于竞速、护送、追击与枪战&lt;/span&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：钱·首次获得&lt;/span&gt;车辆被记录，留下风险。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;1:40–3:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L02 车队接应&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新玩法 · 帮派骑行首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;骑行 ×1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;博展示背章并带科尔回小镇。&lt;/td&gt;&lt;td&gt;完成交接&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;身份确认&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;2:00–3:00&lt;/time&gt; 帮派骑行 ×1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;认识博；抵达改装厂。&lt;/td&gt;&lt;/tr&gt;

      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;7:00–16:00&lt;/span&gt;&lt;b&gt;第一幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;见习打工与和平转正&lt;/b&gt;&lt;span&gt;Prospect 只获得改装厂使用权；打工挣钱、改车并完成押送后，在首次议会中和平直接提升为正式成员。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP ×1、改装/维修小游戏 ×2、议会 ×1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;演出约 90s&lt;/b&gt;&lt;span&gt;见习→打工→押送→议会转正&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Prospect&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Full Patch&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平直接提升&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

        &lt;tr class=&quot;dc-first-gang-tree-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;7:00–8:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L05 入会见习&lt;/div&gt;&lt;span class=&quot;dc-system-first-gang-tree&quot;&gt;新系统解锁 · 帮派树首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;帮派树教学 ×1 / 剧情确认 ×1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;杰森确认黑名单并重申帮规；玩家作为见习加入。本节点首次打开帮派树，但不是议会系统。&lt;/td&gt;&lt;td&gt;获得庇护&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;30s&lt;/strong&gt;&lt;br&gt;邀请与身份确认&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;7:30–8:00&lt;/time&gt; 帮派树教学 / 身份与晋升路径确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-gang-tree-callout&quot;&gt;帮派树首次显示：瓦尔特所在 T2 管理雨果、玩家和一个未命名 T1 席&lt;/span&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;职位：Prospect&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;建筑：改装厂·仅使用权&lt;/span&gt;无管理、城建和稳定产出权限。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;8:00–10:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L06 打工挣钱&lt;/div&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-A 改装 / 维修&lt;/span&gt;&lt;/td&gt;&lt;td&gt;见习需要先打工挣钱，使用改装厂完成委托。&lt;/td&gt;&lt;td&gt;筹措成本&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;委托提示&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;8:10–9:10&lt;/time&gt; MG-A ×1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;9:10–10:00&lt;/time&gt; 交付/结算&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;小游戏产出：钱；用于改车&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;3&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;16:00–30:00&lt;/span&gt;&lt;b&gt;第二幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;正式接管改装厂与商业街&lt;/b&gt;&lt;span&gt;Full Patch 先接管并建设改装厂，再取代 Enforcer，随后解锁商业街循环。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP ×2、推关 ×2、城建 ×2、会议 ×1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;演出约 100s&lt;/b&gt;&lt;span&gt;接管→建设→晋升→接管&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Enforcer&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;16:00–18:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building dc-loop-sup&quot;&gt;L11 接管改装厂&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 · 建筑接管首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;竞速 SUP ×1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;承接 L10：博带玩家从议会直接返回改装厂。现负责人认可玩家已取得 Full Patch 资格，但要求先在竞速中证明管理能力；胜利后交出建筑管理权。&lt;/td&gt;&lt;td&gt;把新身份转化为首座产业管理权&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;25s&lt;/strong&gt;&lt;br&gt;条件与建筑交接&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;16:00–16:20&lt;/time&gt; 从议会返厂 / 接管条件确认&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;16:20–17:20&lt;/time&gt; 竞速 SUP ×1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;17:20–18:00&lt;/time&gt; 回厂 / 钥匙与账册交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;建筑：改装厂·内部接管&lt;/span&gt;这里只交接建筑管理权，不发生职位交接；L12 建设任务立即开启。&lt;/td&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;23:00–25:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L14 接管商业街&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;内部交接 ×1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;本帮前任负责人交出账册和钥匙；商业街开放，梅丽尔在蓝盘子餐厅首次出场并介绍钱产出。&lt;/td&gt;&lt;td&gt;建立钱产出&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;交接与角色首次出场&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;23:20–24:00&lt;/time&gt; 账册/钥匙交接&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;24:00–25:00&lt;/time&gt; 建筑功能教学 / 梅丽尔介绍&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;建筑：商业街·内部接管&lt;/span&gt;进入建设与收钱循环。&lt;/td&gt;&lt;/tr&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;4&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;30:00–45:00&lt;/span&gt;&lt;b&gt;第三幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;地下赛事、庆功与比利叛变&lt;/b&gt;&lt;span&gt;按七月 Demo 台本顺序：议会派赛 → 赢得冠军 → 接管废车场 → 庆功反转 → 追击比利。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP ×2、车辆改装 ×2、城建 ×2、议会 ×2。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;晋升 ×2&lt;/b&gt;&lt;span&gt;建筑循环 ×2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Roadman&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Road Captain&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;30:00–32:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L17 地下赛事议会&lt;/div&gt;&lt;/td&gt;&lt;td&gt;警长问题解决 → 议会讨论被操控的地下赛事 → 原定车手受伤 → 玩家领取替补任务。&lt;/td&gt;&lt;td&gt;替帮派出赛&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;任务任命&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家仍是 Enforcer。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;地下赛事任务开启；直接接续竞速&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;32:00–35:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L18 地下赛事&lt;/div&gt;&lt;/td&gt;&lt;td&gt;改装车辆 ×1 → 竞速 SUP ×1 → 赢得冠军。&lt;/td&gt;&lt;td&gt;赢得路线席位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;竞速取代&lt;/span&gt;&lt;/td&gt;&lt;td&gt;原席位者转任；玩家取代三席中的一席。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Roadman·三席之一&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁废车场&lt;/span&gt;斯宾塞、卡莱布仍为同级。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;35:00–37:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L19 接管废车场&lt;/div&gt;&lt;/td&gt;&lt;td&gt;晋升 Roadman 后，卡莱布交出管理钥匙并完成建筑功能教学。&lt;/td&gt;&lt;td&gt;取得零件产业&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;已先取得 Roadman 职位权限。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;废车场·内部接管&lt;/span&gt;进入建设循环。&lt;/td&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;40:00–42:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L21 庆功与叛徒议会&lt;/div&gt;&lt;/td&gt;&lt;td&gt;车队迎接冠军 → 蓝盘子餐厅庆功 → 议会公布比利泄密并投票处决 → 比利逃离。&lt;/td&gt;&lt;td&gt;制裁叛徒&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-lethal&quot;&gt;剥夺职位/制裁&lt;/span&gt;&lt;/td&gt;&lt;td&gt;比利失去 Road Captain 席位，玩家尚未晋升。&lt;/td&gt;&lt;td&gt;追击任务开启；庆功情绪反转。&lt;/td&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;45:00–47:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L23 接管加油站&lt;/div&gt;&lt;/td&gt;&lt;td&gt;晋升后前往加油站，本帮前任负责人交出路线图与管理钥匙。&lt;/td&gt;&lt;td&gt;取得油产业&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Road Captain 已先解锁加油站。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;加油站·内部接管&lt;/span&gt;进入建设循环。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;47:30–49:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L24 建设加油站&lt;/div&gt;&lt;/td&gt;&lt;td&gt;修复泵机、安排补给路线并收取首批油。&lt;/td&gt;&lt;td&gt;恢复油产出&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;建设/收取&lt;/span&gt;&lt;/td&gt;&lt;td&gt;前任经营者继续负责现场。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;加油站 Lv.1&lt;/span&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：油·首次获得&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;油稳定产出开启&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;58:00–60:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L28 建设物流中心&lt;/div&gt;&lt;/td&gt;&lt;td&gt;修复仓位、安排首条运输并收取第一批物资。&lt;/td&gt;&lt;td&gt;建立物资产出&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;建设/运输&lt;/span&gt;&lt;/td&gt;&lt;td&gt;原负责人转为现场协作。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：物资·首次获得&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;物流中心 Lv.1&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;物资稳定产出开启&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;6&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;60:00–90:00&lt;/span&gt;&lt;b&gt;第五幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;叛徒残党、汉克回归与连续晋升&lt;/b&gt;&lt;span&gt;只用 SUP、推关、议会、城建处理本帮内部事件，不引入额外玩法系统。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP ×4、推关 ×6、议会 ×4、城建恢复 ×2。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;晋升 ×4&lt;/b&gt;&lt;span&gt;既有玩法复用&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Sergeant&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Senior&lt;/span&gt;&lt;span class=&quot;rc-tag rc-push&quot;&gt;推关战斗&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Vice President&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;President&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;60:00–64:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L29 武装队长切磋&lt;/div&gt;&lt;/td&gt;&lt;td&gt;议会复盘救援与产业恢复 → 使用钱、油、物资补给 → 友好枪战 SUP ×1。&lt;/td&gt;&lt;td&gt;证明战斗指挥能力&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;帮内切磋&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;职位交棒&lt;/span&gt;&lt;/td&gt;&lt;td&gt;现任者转任教官；玩家原 Treasurer 席位由 NPC 补位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Sergeant-at-arms&lt;/span&gt;开始管辖三名 Treasurer；沿用英雄养成。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;64:00–70:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L30 追回本帮物资&lt;/div&gt;&lt;/td&gt;&lt;td&gt;比利残党盗走物流中心物资 → 推关 ×3清理内部藏点 → SUP ×1护送物资返城 → 修复仓位。&lt;/td&gt;&lt;td&gt;守住本帮资产&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;复合行动&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;议会交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;完成行动后取代一名转任/退休的 Senior Members 席位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Senior Members·三席之一&lt;/span&gt;物资回库；不新增系统。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;70:00–76:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L31 汉克回归&lt;/div&gt;&lt;/td&gt;&lt;td&gt;博邀请玩家迎接汉克出狱 → 车队护送 SUP ×1 → 议会确认汉克接受新的职责分工。&lt;/td&gt;&lt;td&gt;调和旧成员关系&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;元老履职&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与另外两名 Senior Members 同级。&lt;/td&gt;&lt;td&gt;获得副会长挑战提名；复用 SUP 与议会。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;76:00–82:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L32 副会长传统挑战&lt;/div&gt;&lt;/td&gt;&lt;td&gt;汉克与元老见证 → 改装/路线选择 → 竞速 SUP ×1 → 带队返程。&lt;/td&gt;&lt;td&gt;赢得副会长席位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;传统竞速&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;主动交棒&lt;/span&gt;&lt;/td&gt;&lt;td&gt;韦恩交棒；玩家原 Senior Members 席位由 NPC 补位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Vice President&lt;/span&gt;开始管辖三名 Senior Members；获得 Clubhouse 帮派管理权限。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;82:00–89:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L33 副会长履职&lt;/div&gt;&lt;/td&gt;&lt;td&gt;在 Clubhouse 召开议会 → 钱/油/物资补给 → 推关 ×3清理叛徒残余 → SUP ×1护送成员返城 → 修复建筑。&lt;/td&gt;&lt;td&gt;完成会长前履职&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;岗位代理&lt;/span&gt;&lt;/td&gt;&lt;td&gt;杰森仍任 President，玩家代理本次内部行动。&lt;/td&gt;&lt;td&gt;触发会长提名；不新增系统。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;89:30–90:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L34 会长和平交接&lt;/div&gt;&lt;/td&gt;&lt;td&gt;杰森提名科尔；全体议会表决。&lt;/td&gt;&lt;td&gt;玩家取代杰森；原 Vice President 席位由 NPC 补位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;退位/提名/选举&lt;/span&gt;&lt;/td&gt;&lt;td&gt;副会长履职证明完整领袖能力。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;President&lt;/span&gt;统辖副会长线；获得 Clubhouse 帮派管理权限；一日版结束。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-section&quot;&gt;
      &lt;h2&gt;Part 3 · 一日版本与正式版本分流&lt;/h2&gt;
      &lt;div class=&quot;dc-branch&quot;&gt;
        &lt;div&gt;&lt;h3&gt;正式版：官职链衔接大地图&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;60–64：枪战 SUP 切磋 → Sergeant-at-Arms。&lt;/li&gt;&lt;li&gt;64–70：追回本帮物资后进入大地图任务 → Senior Members。&lt;/li&gt;&lt;li&gt;70–76：迎接汉克回归并由议会选定地图目标。&lt;/li&gt;&lt;li&gt;76–82：竞速 SUP → Vice President，获得 Clubhouse 帮派管理权限。&lt;/li&gt;&lt;li&gt;82–89:30：以副会长身份完成一次大地图任务。&lt;/li&gt;&lt;li&gt;89:30–90：通过议会完成 President 交接。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h3&gt;一日版：同一官职链，重复既有玩法&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;60–64：枪战 SUP 完成武装队长切磋。&lt;/li&gt;&lt;li&gt;64–70：推关清理叛徒藏点，SUP 护送本帮物资返城。&lt;/li&gt;&lt;li&gt;70–76：迎接汉克回归，完成一次车队护送 SUP。&lt;/li&gt;&lt;li&gt;76–82：竞速 SUP 完成副会长挑战。&lt;/li&gt;&lt;li&gt;82–89:30：推关清理叛徒残余、SUP 护送返城并恢复建筑。&lt;/li&gt;&lt;li&gt;89:30–90：通过议会完成 President 交接。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;dc-warning&quot;&gt;&lt;strong&gt;改编边界：&lt;/strong&gt;七月 Demo 台本后段未确认的玩法不进入本方案；对应剧情功能统一改为“叛徒残党盗运本帮物资 → 推关清理内部藏点 → SUP 护送返城 → 城建修复”。所有城市建筑始终属于我方帮派。&lt;/div&gt;
    &lt;/section&gt;

      &lt;div class=&quot;org-rule-grid&quot;&gt;
        &lt;div&gt;&lt;b&gt;开局 T1&lt;/b&gt;&lt;span&gt;玩家、雨果与一个未命名见习席，均直属瓦尔特所在的 T2。&lt;/span&gt;&lt;/div&gt;

      &lt;h3&gt;职级对应功能&lt;/h3&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm rank-unlock-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;层级&lt;/th&gt;&lt;th&gt;职级&lt;/th&gt;&lt;th&gt;席位结构&lt;/th&gt;&lt;th&gt;建筑 / 系统解锁&lt;/th&gt;&lt;th&gt;功能解锁&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;T1&lt;/td&gt;&lt;td&gt;Prospect / 见习&lt;/td&gt;&lt;td&gt;每个 T2 下属 3 席；开局为雨果、玩家、1 个空席&lt;/td&gt;&lt;td&gt;改装厂·仅使用权&lt;/td&gt;&lt;td&gt;打工、改车、MG-A；无管理/城建权限&lt;/td&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td&gt;T4&lt;/td&gt;&lt;td&gt;Roadman / 路线成员&lt;/td&gt;&lt;td&gt;三席同级层&lt;/td&gt;&lt;td&gt;废车场、零件&lt;/td&gt;&lt;td&gt;资源建筑内部交接任务&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T5&lt;/td&gt;&lt;td&gt;Road Captain / 路线队长&lt;/td&gt;&lt;td&gt;管理 3 名 T4&lt;/td&gt;&lt;td&gt;加油站、油&lt;/td&gt;&lt;td&gt;路线调度、远程补给、下级英雄&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T6&lt;/td&gt;&lt;td&gt;Treasurer / 财务官&lt;/td&gt;&lt;td&gt;三席同级层&lt;/td&gt;&lt;td&gt;物流中心、物资&lt;/td&gt;&lt;td&gt;管理钱、油、物资的消耗与运输；不新增系统&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T7&lt;/td&gt;&lt;td&gt;Sergeant-at-arms / 武装队长&lt;/td&gt;&lt;td&gt;管理 3 名 T6&lt;/td&gt;&lt;td&gt;获得下级英雄&lt;/td&gt;&lt;td&gt;沿用英雄养成，继续游玩 SUP/推关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T8&lt;/td&gt;&lt;td&gt;Senior Members / 元老成员&lt;/td&gt;&lt;td&gt;三席同级层&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;议会选择任务，继续游玩 SUP/推关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T9&lt;/td&gt;&lt;td&gt;Vice President / 副会长&lt;/td&gt;&lt;td&gt;管理 3 名 T8&lt;/td&gt;&lt;td&gt;枪械/载具投放节点&lt;/td&gt;&lt;td&gt;Clubhouse 帮派管理，继续游玩 SUP/推关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T10&lt;/td&gt;&lt;td&gt;President / 会长&lt;/td&gt;&lt;td&gt;顶层单席&lt;/td&gt;&lt;td&gt;Clubhouse、建筑升级解除限制&lt;/td&gt;&lt;td&gt;统辖副会长线；一日版终点&lt;/td&gt;&lt;/tr&gt;

    &lt;section class=&quot;dc-section succession-part&quot; id=&quot;dc-promotion-scenes&quot; aria-labelledby=&quot;succession-title&quot;&gt;
      &lt;h3 id=&quot;succession-title&quot;&gt;全职位晋升的游戏内表现&lt;/h3&gt;
      &lt;p class=&quot;dc-note&quot;&gt;本 Part 描述玩家在游戏中实际看到和操作的完整场景：任务进入、玩法证明、角色反应、职位交接、界面反馈与新权限首次使用。职位交接只是场景中的一个环节，建筑接管仍放在后续独立循环。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;晋升目标&lt;/th&gt;&lt;th&gt;玩法 TAG&lt;/th&gt;&lt;th&gt;席位与原职位关系&lt;/th&gt;&lt;th&gt;玩法证明&lt;/th&gt;&lt;th&gt;游戏内表现&lt;/th&gt;&lt;th&gt;取代结果与立即解锁&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;T1 Prospect&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;原 Prospect 晋升或转任，入门席位空出&lt;/td&gt;&lt;td&gt;帮规确认与入会任务&lt;/td&gt;&lt;td&gt;杰森确认玩家可以留下，博为玩家戴上见习背章；帮派树弹出并聚焦 T1 与改装厂使用权。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;背章交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代入门席；获得改装厂使用权，无管理/城建权限&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T2 Full Patch&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平直接提升&lt;/span&gt;&lt;/td&gt;&lt;td&gt;特殊例外：玩家从瓦尔特所辖 T1 离开并填入 T2 空席，不要求原 Full Patch 离职&lt;/td&gt;&lt;td&gt;枪战 SUP 完成本帮押送，作为转正前置条件&lt;/td&gt;&lt;td&gt;玩家首次进入议会，成员直接授予身份；帮派树显示玩家进入 T2 空席，并显示该席下属的 3 名 T1。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;无职位交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;进入正式成员层；每个 T2 管理 3 名 T1；解锁改装厂正式接管与城建&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T3 Enforcer&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T2；原 Enforcer 交棒&lt;/td&gt;&lt;td&gt;查出内鬼并带回证据&lt;/td&gt;&lt;td&gt;玩家追捕内鬼信使并把证据放上会议桌；原 Enforcer 交出执法名单，帮派树更新管辖线。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;权限交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代管理席；原 T2 席位补位；管辖三名 T2；解锁商业街&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T4 Roadman&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;三席之一；原席位者转任&lt;/td&gt;&lt;td&gt;地下竞速 SUP&lt;/td&gt;&lt;td&gt;玩家完成赛前改装并赢得地下竞速；庆祝镜头中原席位者退出队列，Roadman 三席之一点亮。&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;竞速取代&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代一席；斯宾塞、卡莱布仍是同级；解锁废车场&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T5 Road Captain&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T4；比利叛变失去席位&lt;/td&gt;&lt;td&gt;议会制裁 + SUP 追击&lt;/td&gt;&lt;td&gt;庆功后的议会公布比利罪证；玩家追上逃亡的比利，完成处决/掩护并取回背章，返程后被正式任命。&lt;span class=&quot;dc-transfer dc-transfer-lethal&quot;&gt;叛徒制裁&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;议会任命&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代比利；原 T4 席位补位；管辖三名 T4；解锁加油站&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T6 Treasurer&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;三席之一；戴尔持有其中一席&lt;/td&gt;&lt;td&gt;梅丽尔救援 + 追回物流账本&lt;/td&gt;&lt;td&gt;玩家交出救援中追回的账本；戴尔因失察辞任并递交财务账册，物流中心权限点亮。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;失察辞任/账册交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代戴尔的一席；另外两席仍是同级；解锁物流中心&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T7 Sergeant-at-arms&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T6；现任者转任教官&lt;/td&gt;&lt;td&gt;钱/油/物资补给 + 友好枪战 SUP&lt;/td&gt;&lt;td&gt;玩家完成补给和友好枪战；议会复盘时现任者转任教官并交出指挥权。&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;帮内切磋&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;指挥权交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代管理席；原 T6 席位补位；管辖三名 T6；获得下级英雄并沿用英雄养成&lt;/td&gt;&lt;/tr&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);

    }
    pendingTrigger = null;
  };

    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }

    tooltip?.remove();

    const request = ++positionRequest;

      middleware: [

        flip({ padding: tooltipGap }),

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }

        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {

  };

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

    }

    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil

    if (delay === 0) {
      openTooltip(trigger);

  document.addEventListener(&quot;pointerout&quot;, handleLeave);
