.form-check-input[type=&quot;radio&quot;] {

  height: 14px;

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

  opacity: 0.6;

.form-check-label {

.form-switch .form-check-input {

  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);

.form-switch .form-check-input:focus-visible {

}

.form-range {

  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

      color-mix(in srgb, var(--foreground) 7%, transparent),

  height: 28px;

  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:focus-visible {

}

svg {

    &lt;aside class=&quot;dc-toc&quot; aria-label=&quot;页面目录&quot;&gt;

  &lt;div class=&quot;dc-wrap&quot; id=&quot;dc-overview&quot;&gt;
    &lt;div class=&quot;dc-kicker&quot;&gt;压缩版 · 一日线 90 分钟排布&lt;/div&gt;
    &lt;p class=&quot;dc-lead&quot;&gt;纯演出全部控制在 10–30 秒；SUP 保持约 1 分钟。每次晋升都通过已有玩法取代一个既有席位；三席同级层只协作不互相管辖，升入上一级管理岗后才统辖完整三席。第三幕后继续复用 SUP、推关、城建、议会、小游戏与既有养成，不新增系统。&lt;/p&gt;
    &lt;div class=&quot;dc-rules&quot;&gt;
      &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;纯演出：&lt;/strong&gt;单次 10–30s&lt;/span&gt;
      &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;SUP：&lt;/strong&gt;单次约 60s&lt;/span&gt;
      &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;推关：&lt;/strong&gt;26:00 首组，30:00 常驻&lt;/span&gt;
      &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;建筑：&lt;/strong&gt;45–60 min 前全部推出&lt;/span&gt;
      &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;归属：&lt;/strong&gt;全城建筑始终属于我方帮派；接管只做内部交接&lt;/span&gt;
      &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;职位：&lt;/strong&gt;所有晋升都取代既有席位，并有交接玩法&lt;/span&gt;
      &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;管辖：&lt;/strong&gt;同级三席互不管辖；升任管理岗后统辖三席&lt;/span&gt;
      &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;T2 下属：&lt;/strong&gt;每名 Full Patch 管理 3 名 T1；开局瓦尔特所辖包含雨果、玩家与 1 个空席&lt;/span&gt;
      &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;分流：&lt;/strong&gt;60:00 正式版大地图 / 一日版复玩&lt;/span&gt;
      &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;小游戏：&lt;/strong&gt;3:15 起常驻；0–26 min 集中教学，单次 45–90s&lt;/span&gt;
      &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;系统范围：&lt;/strong&gt;SUP / 推关 / 模拟经营与城建 / 小游戏 / 车辆、枪械、英雄养成 / 帮派与议会&lt;/span&gt;
      &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;资源说明：&lt;/strong&gt;“三资”不是系统，只指钱、油、物资；页面直接写资源名称&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;dc-overview&quot; aria-label=&quot;压缩后的六幕时间分配&quot;&gt;
      &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;0–7&lt;/span&gt;&lt;b&gt;序幕&lt;/b&gt;&lt;span&gt;被卷入&lt;br&gt;4循环&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;7–16&lt;/span&gt;&lt;b&gt;第一幕&lt;/b&gt;&lt;span&gt;见习打工/押送/转正&lt;br&gt;6循环&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;16–30&lt;/span&gt;&lt;b&gt;第二幕&lt;/b&gt;&lt;span&gt;正式接管改装厂/商业街&lt;br&gt;6循环&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;30–45&lt;/span&gt;&lt;b&gt;第三幕&lt;/b&gt;&lt;span&gt;赛事/叛徒/救援&lt;br&gt;Roadman→Road Captain&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;45–60&lt;/span&gt;&lt;b&gt;第四幕&lt;/b&gt;&lt;span&gt;加油站/物流中心&lt;br&gt;Treasurer&lt;/span&gt;&lt;/div&gt;

    &lt;section class=&quot;dc-section&quot;&gt;
      &lt;h2&gt;整体剧情因果&lt;/h2&gt;

        &lt;div&gt;&lt;b&gt;加入与转正&lt;/b&gt;&lt;br&gt;&lt;span&gt;保护变成责任&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;承接产业&lt;/b&gt;&lt;br&gt;&lt;span&gt;共同资产转交玩家管理&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;赛事与内乱&lt;/b&gt;&lt;br&gt;&lt;span&gt;守住组织边界&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;补齐产业产出&lt;/b&gt;&lt;br&gt;&lt;span&gt;钱、油、物资进入循环&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;复玩与晋升&lt;/b&gt;&lt;br&gt;&lt;span&gt;证明能领导全帮&lt;/span&gt;&lt;/div&gt;

      &lt;h2 id=&quot;minigame-title&quot;&gt;小游戏出现与复用关系&lt;/h2&gt;
      &lt;p class=&quot;dc-note&quot;&gt;本阶段只标记小游戏出现在哪，以及哪些循环复用同一个小游戏。具体规则、操作步骤和关卡目标留到小游戏专项设计。&lt;/p&gt;

        &lt;tr class=&quot;dc-first-sup-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;0:00–1:40&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L01 送货竞速&lt;/div&gt;&lt;span class=&quot;dc-first-badge dc-first-sup-badge&quot;&gt;新玩法解锁 · SUP 首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;竞速 SUP ×1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;通话中遇到临检，科尔用速度甩开警车。&lt;/td&gt;&lt;td&gt;按时交货&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;目标+追车建立&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;0:20–1:20&lt;/time&gt; 竞速 SUP ×1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;1:20–1:40&lt;/time&gt; 结算/转场操作&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;SUP 正式解锁：单局约 60 秒，后续复用于竞速、护送、追击与枪战&lt;/span&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：钱·首次获得&lt;/span&gt;车辆被记录，留下风险。&lt;/td&gt;&lt;/tr&gt;

    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;2&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;7:00–16:00&lt;/span&gt;&lt;b&gt;第一幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;见习打工与和平转正&lt;/b&gt;&lt;span&gt;Prospect 只获得改装厂使用权；打工挣钱、改车并完成押送后，在首次议会中和平直接提升为正式成员。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP ×1、改装/维修小游戏 ×2、议会 ×1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;演出约 90s&lt;/b&gt;&lt;span&gt;见习→打工→押送→议会转正&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Prospect&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Full Patch&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平直接提升&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-gang-tree-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;7:00–8:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L05 入会见习&lt;/div&gt;&lt;span class=&quot;dc-system-first-gang-tree&quot;&gt;新系统解锁 · 帮派树首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;帮派树教学 ×1 / 剧情确认 ×1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;杰森确认黑名单并重申帮规；玩家作为见习加入。本节点首次打开帮派树，但不是议会系统。&lt;/td&gt;&lt;td&gt;获得庇护&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;30s&lt;/strong&gt;&lt;br&gt;邀请与身份确认&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;7:30–8:00&lt;/time&gt; 帮派树教学 / 身份与晋升路径确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-gang-tree-callout&quot;&gt;帮派树首次显示：瓦尔特所在 T2 管理雨果、玩家和一个未命名 T1 席&lt;/span&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;职位：Prospect&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;建筑：改装厂·仅使用权&lt;/span&gt;无管理、城建和稳定产出权限。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;8:00–10:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L06 打工挣钱&lt;/div&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-A 改装 / 维修&lt;/span&gt;&lt;/td&gt;&lt;td&gt;见习需要先打工挣钱，使用改装厂完成委托。&lt;/td&gt;&lt;td&gt;筹措成本&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;委托提示&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;8:10–9:10&lt;/time&gt; MG-A ×1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;9:10–10:00&lt;/time&gt; 交付/结算&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;小游戏产出：钱；用于改车&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;10:00–11:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L07 改车准备&lt;/div&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-A 改装 / 维修&lt;/span&gt;&lt;/td&gt;&lt;td&gt;用挣到的钱和赠送零件升级押送车辆。&lt;/td&gt;&lt;td&gt;准备考核&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;目标提示&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;10:10–11:10&lt;/time&gt; MG-A ×1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;11:10–11:30&lt;/time&gt; 试车&lt;/span&gt;&lt;/td&gt;&lt;td&gt;车辆能力提升；开启押送。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;11:30–13:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L08 转正押送&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;枪战 SUP ×1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;完成本帮押送，在伏击中保护货物并抵达目的地。&lt;/td&gt;&lt;td&gt;取得资格&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;任务与伏击&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;11:50–12:50&lt;/time&gt; 枪战 SUP ×1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;12:50–13:30&lt;/time&gt; 抵达/交付&lt;/span&gt;&lt;/td&gt;&lt;td&gt;获得转正资格与声望。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;13:30–15:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L09 转正通知&lt;/div&gt;&lt;/td&gt;&lt;td&gt;博告知玩家已争取到转正机会，并说明会通过议会直接填入一个 T2 空席。&lt;/td&gt;&lt;td&gt;完成入会&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;通知与引导&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;13:50–15:00&lt;/time&gt; 返程/议会入口确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;议会目标开启。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-meeting-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;15:00–16:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L10 首次议会·和平转正&lt;/div&gt;&lt;span class=&quot;dc-system-first-meeting&quot;&gt;新系统解锁 · 议会首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;议会 ×1 / 特殊晋升 ×1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家首次进入议会；帮派确认其完成押送考核，直接授予 Full Patch 身份。玩家从瓦尔特所辖 T1 离开并填入一个 T2 空席，不安排原 Full Patch 离开，也不演出职位或背章交接。&lt;/td&gt;&lt;td&gt;以新身份承接首座产业&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;议会与权限确认&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;15:20–15:45&lt;/time&gt; 议会教学 / T2 空席填入 / 直属 T1 管辖线更新&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;15:45–16:00&lt;/time&gt; 接管考核开启 / 博带玩家返厂&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-meeting-callout&quot;&gt;议会系统正式解锁；帮派树显示每个 T2 管理 3 名 T1&lt;/span&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;职位：Full Patch·和平直接提升&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;改装厂管理考核开启&lt;/span&gt;直接接续 L11。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;3&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;16:00–30:00&lt;/span&gt;&lt;b&gt;第二幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;正式接管改装厂与商业街&lt;/b&gt;&lt;span&gt;Full Patch 先接管并建设改装厂，再取代 Enforcer，随后解锁商业街循环。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP ×2、推关 ×2、城建 ×2、会议 ×1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;演出约 100s&lt;/b&gt;&lt;span&gt;接管→建设→晋升→接管&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Enforcer&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;16:00–18:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building dc-loop-sup&quot;&gt;L11 接管改装厂&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 · 建筑接管首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;竞速 SUP ×1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;承接 L10：博带玩家从议会直接返回改装厂。现负责人认可玩家已取得 Full Patch 资格，但要求先在竞速中证明管理能力；胜利后交出建筑管理权。&lt;/td&gt;&lt;td&gt;把新身份转化为首座产业管理权&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;25s&lt;/strong&gt;&lt;br&gt;条件与建筑交接&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;16:00–16:20&lt;/time&gt; 从议会返厂 / 接管条件确认&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;16:20–17:20&lt;/time&gt; 竞速 SUP ×1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;17:20–18:00&lt;/time&gt; 回厂 / 钥匙与账册交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;建筑：改装厂·内部接管&lt;/span&gt;这里只交接建筑管理权，不发生职位交接；L12 建设任务立即开启。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;18:00–20:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L12 建设改装厂&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 · 城建首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;城建 ×1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;接过管理权后，玩家立即修复首个工位并恢复生产。&lt;/td&gt;&lt;td&gt;把新取得的管理权变成稳定产出&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;15s&lt;/strong&gt;&lt;br&gt;建设反馈&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;18:00–18:15&lt;/time&gt; 接管状态确认 / 首个建设目标&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;18:15–19:15&lt;/time&gt; 建设操作&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;19:15–20:00&lt;/time&gt; 产出确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;建筑：改装厂 Lv.1&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;钱稳定产出开启&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;20:00–23:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L13 Enforcer 晋升&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;SUP ×1 / 会议 ×1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;从改装厂账目发现内鬼信使 → 追击取证 → 提交证据；原 Enforcer 交棒。&lt;/td&gt;&lt;td&gt;获得管理资格&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20–30s&lt;/strong&gt;&lt;br&gt;职位交接&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;20:20–21:20&lt;/time&gt; 追击 SUP ×1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;22:00–22:30&lt;/time&gt; 表决/权限确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;职位：Enforcer&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁商业街&lt;/span&gt;开始管辖三名 Full Patch。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;23:00–26:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L14 商业街交接准备&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;调查 ×1&lt;/span&gt;&lt;span class=&quot;dc-minigame dc-minigame-optional&quot;&gt;候选 MG-B 商业经营 / 查账&lt;/span&gt;&lt;/td&gt;&lt;td&gt;本帮商业街负责人准备交棒，但账目暴露两处叛徒破坏点。&lt;/td&gt;&lt;td&gt;建立钱产出&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;内部异常&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;23:20–24:20&lt;/time&gt; 可选 MG-B ×1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;24:20–25:00&lt;/time&gt; 确认叛徒藏点&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;25:00–26:00&lt;/time&gt; 选队/备战&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;获得声望；生成两个叛徒清理目标&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-system-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;26:00–29:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L15 首组推关&lt;/div&gt;&lt;span class=&quot;dc-system-first&quot;&gt;新系统解锁 · 推关首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;推关 ×2&lt;/span&gt;&lt;/td&gt;&lt;td&gt;前往本帮建筑内的两处叛徒藏点，完成内部清算。&lt;/td&gt;&lt;td&gt;清理叛徒&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;15s&lt;/strong&gt;&lt;br&gt;开战与结果&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;26:10–27:10&lt;/time&gt; 推关 1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;27:20–28:20&lt;/time&gt; 推关 2&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;28:20–29:00&lt;/time&gt; 清算/交接确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;推关系统正式解锁：此后作为常驻战斗循环复用&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;建筑：商业街·内部交接&lt;/span&gt;建筑归属不变。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;29:00–30:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L16 建设商业街&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;城建 ×1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;本帮前任负责人完成管理权交接；玩家恢复首批商铺并收取第一笔钱。&lt;/td&gt;&lt;td&gt;验证产出&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;15s&lt;/strong&gt;&lt;br&gt;内部交接&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;29:15–29:45&lt;/time&gt; 快速建设 ×1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;29:45–30:00&lt;/time&gt; 首收&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;建筑：商业街 Lv.1&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;钱稳定产出开启&lt;/span&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;职位：Enforcer&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;4&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;30:00–45:00&lt;/span&gt;&lt;b&gt;第三幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;赛事、废车场与叛徒救援&lt;/b&gt;&lt;span&gt;取代 Roadman 席位后接管废车场；再取代叛徒留下的 Road Captain 席位。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP ×2、推关 ×5、城建 ×1、会议 ×1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;晋升 ×2&lt;/b&gt;&lt;span&gt;建筑循环 ×2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Roadman&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Road Captain&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-push&quot;&gt;推关战斗&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;30:00–32:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L17 警长交易&lt;/div&gt;&lt;/td&gt;&lt;td&gt;商业街产钱 → 支付警长 → 枪战 SUP ×1，取得地下赛事和泄密线索。&lt;/td&gt;&lt;td&gt;仍是 Enforcer；无职位交接&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;玩法证明&lt;/span&gt;&lt;/td&gt;&lt;td&gt;把产业资源转成行动成果。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;消耗钱、获得声望；剧情线索开启 Roadman 考核&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;32:30–35:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L18 地下赛事&lt;/div&gt;&lt;/td&gt;&lt;td&gt;MG-A ×1 → 竞速 SUP ×1 → 公开庆祝。&lt;/td&gt;&lt;td&gt;斯宾塞、卡莱布保留另外两个 Roadman 席位，与玩家同级&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;竞速取代&lt;/span&gt;&lt;/td&gt;&lt;td&gt;原席位者转任；玩家取代三席中的一席。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Roadman·三席之一&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁废车场&lt;/span&gt;另外两席不归玩家管辖。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;35:00–38:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building dc-loop-push&quot;&gt;L19 接管废车场&lt;/div&gt;&lt;/td&gt;&lt;td&gt;卡莱布主持帮内防卫演练 → 玩家指挥推关 ×2 → 完成管理权交接。&lt;/td&gt;&lt;td&gt;卡莱布是本帮前任负责人和考官&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;帮内演练&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;已先取得 Roadman 职位权限。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;废车场·内部接管&lt;/span&gt;进入建设循环。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;38:00–40:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L20 建设废车场&lt;/div&gt;&lt;/td&gt;&lt;td&gt;MG-C 候选 ×1，或普通建设操作。&lt;/td&gt;&lt;td&gt;卡莱布继续负责现场，玩家负责管理&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;职责分工&lt;/span&gt;&lt;/td&gt;&lt;td&gt;建设与接管拆为两个循环。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;废车场 Lv.1&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;零件稳定产出开启&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;40:00–42:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L21 比利叛变&lt;/div&gt;&lt;/td&gt;&lt;td&gt;议会出示证据 → 比利逃亡 → SUP 追击 → 夺回背章。&lt;/td&gt;&lt;td&gt;比利是现任 Road Captain；叛徒被制裁后席位空缺&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-lethal&quot;&gt;剥夺职位/制裁&lt;/span&gt;&lt;/td&gt;&lt;td&gt;形成真实的队长空缺。&lt;/td&gt;&lt;td&gt;获得绑架线索；开启代理履职。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;42:00–45:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L22 解救与任命&lt;/div&gt;&lt;/td&gt;&lt;td&gt;代理带队 → 推关 ×3 → 救出梅丽尔 → 撤离；最后 20–30 秒议会任命。&lt;/td&gt;&lt;td&gt;玩家取代比利；原 Roadman 席位由 NPC 补位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;实战代理&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;议会任命&lt;/span&gt;&lt;/td&gt;&lt;td&gt;先履行队长职责，再取得席位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Road Captain&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁加油站&lt;/span&gt;开始管辖三名 Roadman。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;5&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;45:00–60:00&lt;/span&gt;&lt;b&gt;第四幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;加油站、财务官与物流中心&lt;/b&gt;&lt;span&gt;先以 Road Captain 接管加油站；完成产业经营任务后取代一个 Treasurer 席位，再解锁物流中心。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP ×1、推关 ×2、城建 ×2、产业经营 ×1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;晋升 ×1&lt;/b&gt;&lt;span&gt;建筑循环 ×4&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Treasurer&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;45:00–48:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building dc-loop-sup&quot;&gt;L23 接管加油站&lt;/div&gt;&lt;/td&gt;&lt;td&gt;消耗废车场零件强化车辆 → 燃油运输考核 SUP ×1 → 前任负责人交接管理权。&lt;/td&gt;&lt;td&gt;Road Captain 已先解锁加油站&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;岗位考核&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;职位权限立即转成路线职责。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;加油站·内部接管&lt;/span&gt;进入建设循环。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;48:00–50:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L24 建设加油站&lt;/div&gt;&lt;/td&gt;&lt;td&gt;MG-D 候选 ×1，或普通建设操作。&lt;/td&gt;&lt;td&gt;前任经营者继续负责现场，玩家承担路线管理&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;职责分工&lt;/span&gt;&lt;/td&gt;&lt;td&gt;完成独立城建循环。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;加油站 Lv.1&lt;/span&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：油·首次获得&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;油稳定产出开启&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;50:00–53:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L25 产业经营任务&lt;/div&gt;&lt;/td&gt;&lt;td&gt;用零件和油完成补给、路线选择与本帮运输行动。&lt;/td&gt;&lt;td&gt;玩家以 Road Captain 身份实际管理两座产业&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;岗位履职&lt;/span&gt;&lt;/td&gt;&lt;td&gt;证明具备经营能力。&lt;/td&gt;&lt;td&gt;发现戴尔账目缺口；获得 Treasurer 晋升资格。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;53:00–54:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L26 财务官晋升&lt;/div&gt;&lt;/td&gt;&lt;td&gt;戴尔因失职辞任 → 玩家提交经营结果 → 20–30 秒议会交接账册。&lt;/td&gt;&lt;td&gt;玩家取代戴尔所持的 Treasurer 席位；另外两席保留&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;辞任/议会交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;先完成履职，再取得席位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Treasurer·三席之一&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁物流中心&lt;/span&gt;另外两席不归玩家管辖。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;54:00–57:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building dc-loop-push&quot;&gt;L27 接管物流中心&lt;/div&gt;&lt;/td&gt;&lt;td&gt;以 Treasurer 身份追查内部叛徒 → 推关 ×2 → 找回账本与物资 → 戴尔交接管理权。&lt;/td&gt;&lt;td&gt;物流中心始终属于本帮；玩家已先取得职位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;清理叛徒&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;职位在建筑接管之前成立。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;物流中心·内部接管&lt;/span&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：物资·首次获得&lt;/span&gt;进入建设循环。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;57:00–60:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L28 建设物流中心&lt;/div&gt;&lt;/td&gt;&lt;td&gt;完成物流建设、排班和首次运输。&lt;/td&gt;&lt;td&gt;戴尔退为产业顾问；玩家正式履职&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;职责分工&lt;/span&gt;&lt;/td&gt;&lt;td&gt;完成独立城建与产出确认。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;物流中心 Lv.1&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;物资稳定产出开启；至此钱、油、物资均已进入循环&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;6&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;60:00–90:00&lt;/span&gt;&lt;b&gt;第五幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;连续晋升与已有玩法复用&lt;/b&gt;&lt;span&gt;通过枪战 SUP、推关、竞速 SUP 和议会完成连续职位取代，不再新增玩法系统。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP ×5、推关 ×8、议会 ×3、钱/油/物资补给 ×3。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;晋升 ×4&lt;/b&gt;&lt;span&gt;既有玩法复用&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Sergeant&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Senior&lt;/span&gt;&lt;span class=&quot;rc-tag rc-push&quot;&gt;推关战斗&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Vice President&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;President&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;60:00–64:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L29 武装队长切磋&lt;/div&gt;&lt;/td&gt;&lt;td&gt;使用钱、油、物资完成补给 → 友好枪战 SUP ×1 → 议会复盘。&lt;/td&gt;&lt;td&gt;现任者交棒；玩家原 Treasurer 席位由 NPC 补位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;友好切磋&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;职位交棒&lt;/span&gt;&lt;/td&gt;&lt;td&gt;以战斗和带队能力取代现任管理者。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Sergeant-at-arms&lt;/span&gt;开始管辖三名 Treasurer；获得下级英雄并沿用英雄养成。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;64:00–70:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L30 产业防卫&lt;/div&gt;&lt;/td&gt;&lt;td&gt;选择受威胁建筑 → 推关 ×3 → SUP 撤离 ×1 → 修复经营。&lt;/td&gt;&lt;td&gt;完成防卫后，取代一名转任/退休的 Senior Members 席位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;复合行动&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;议会交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;复用推关、SUP 和城建守住成员与产业。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Senior Members·三席之一&lt;/span&gt;另外两席不归玩家管辖。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;70:00–76:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L31 元老任务&lt;/div&gt;&lt;/td&gt;&lt;td&gt;议会选择一个任务 → 推关 ×2 + SUP ×1 → 返回议会复盘。&lt;/td&gt;&lt;td&gt;玩家与另外两名 Senior Members 同级&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;同级履职&lt;/span&gt;&lt;/td&gt;&lt;td&gt;以新元老席位完成首次履职，不取得同级指挥权。&lt;/td&gt;&lt;td&gt;获得副会长挑战提名。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;76:00–82:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L32 副会长传统挑战&lt;/div&gt;&lt;/td&gt;&lt;td&gt;改装/路线选择 → 竞速 SUP ×1 → 带队返程。&lt;/td&gt;&lt;td&gt;韦恩交棒；玩家原 Senior Members 席位由 NPC 补位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;传统竞速&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;主动交棒&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代韦恩成为单席管理者。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Vice President&lt;/span&gt;开始管辖三名 Senior Members；获得 Clubhouse 帮派管理权限。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;82:00–89:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L33 副会长履职&lt;/div&gt;&lt;/td&gt;&lt;td&gt;在 Clubhouse 召开议会 → 使用钱、油、物资补给 → 推关 ×3、SUP ×1 → 恢复建筑。&lt;/td&gt;&lt;td&gt;杰森仍是 President，玩家以副会长身份代理本次行动&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;岗位代理&lt;/span&gt;&lt;/td&gt;&lt;td&gt;复用议会、推关、SUP 与城建，证明会长交接条件。&lt;/td&gt;&lt;td&gt;触发会长提名。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;89:30–90:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L34 会长和平交接&lt;/div&gt;&lt;/td&gt;&lt;td&gt;杰森提名科尔；全体议会表决。&lt;/td&gt;&lt;td&gt;玩家取代杰森；原 Vice President 席位由 NPC 补位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;退位/提名/选举&lt;/span&gt;&lt;/td&gt;&lt;td&gt;副会长履职证明完整领袖能力。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;President&lt;/span&gt;统辖副会长线；获得 Clubhouse 帮派管理权限；一日版结束。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-section&quot;&gt;
      &lt;h2&gt;60 分钟后的版本替换&lt;/h2&gt;
      &lt;div class=&quot;dc-branch&quot;&gt;
        &lt;div&gt;&lt;h3&gt;正式版：官职链衔接大地图&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;60–64：枪战 SUP 切磋 → Sergeant-at-Arms，获得下级英雄并沿用英雄养成。&lt;/li&gt;&lt;li&gt;64–70：用已有英雄完成推关/SUP形式的大地图防卫 → Senior Members。&lt;/li&gt;&lt;li&gt;70–76：议会选择地图目标并完成推关/SUP。&lt;/li&gt;&lt;li&gt;76–82：竞速 SUP → Vice President，获得 Clubhouse 帮派管理权限。&lt;/li&gt;&lt;li&gt;82–89:30：以副会长身份完成一次大地图任务。&lt;/li&gt;&lt;li&gt;89:30–90：通过议会完成 President 交接。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h3&gt;一日版：同一官职链，重复既有玩法&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;60–64：枪战 SUP 完成武装队长切磋。&lt;/li&gt;&lt;li&gt;64–70：重复推关/SUP完成产业防卫。&lt;/li&gt;&lt;li&gt;70–76：议会选择一个本地任务，再完成推关/SUP。&lt;/li&gt;&lt;li&gt;76–82：竞速 SUP 完成副会长挑战。&lt;/li&gt;&lt;li&gt;82–89:30：重复推关/SUP并恢复建筑。&lt;/li&gt;&lt;li&gt;89:30–90：通过议会完成 President 交接。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;dc-warning&quot;&gt;&lt;strong&gt;需要确认的剧情选择：&lt;/strong&gt;本版推荐“杰森转任区域协调者，主动提名科尔”，从而避免杀死或反转杰森；Treasurer 戴尔推荐采用失职辞任，避免连续出现两名叛徒。若希望黑帮感更强，可把戴尔改成第二名叛徒，但不建议改变其推关考核与物流交接功能。&lt;/div&gt;
    &lt;/section&gt;

      &lt;h3&gt;职级对应功能&lt;/h3&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm rank-unlock-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;层级&lt;/th&gt;&lt;th&gt;职级&lt;/th&gt;&lt;th&gt;席位结构&lt;/th&gt;&lt;th&gt;建筑 / 系统解锁&lt;/th&gt;&lt;th&gt;功能解锁&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;T1&lt;/td&gt;&lt;td&gt;Prospect / 见习&lt;/td&gt;&lt;td&gt;每个 T2 下属 3 席；开局为雨果、玩家、1 个空席&lt;/td&gt;&lt;td&gt;改装厂·仅使用权&lt;/td&gt;&lt;td&gt;打工、改车、MG-A；无管理/城建权限&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T2&lt;/td&gt;&lt;td&gt;Full Patch / 正式成员&lt;/td&gt;&lt;td&gt;三席同级层；每席管理 3 名 T1&lt;/td&gt;&lt;td&gt;改装厂·正式接管/城建&lt;/td&gt;&lt;td&gt;管理直属见习、议会、正式成员任务、Enforcer 考核&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T3&lt;/td&gt;&lt;td&gt;Enforcer / 打手&lt;/td&gt;&lt;td&gt;管理 3 名 T2&lt;/td&gt;&lt;td&gt;商业街、钱&lt;/td&gt;&lt;td&gt;推关常驻、警长交易&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T4&lt;/td&gt;&lt;td&gt;Roadman / 路线成员&lt;/td&gt;&lt;td&gt;三席同级层&lt;/td&gt;&lt;td&gt;废车场、零件&lt;/td&gt;&lt;td&gt;资源建筑内部交接任务&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T5&lt;/td&gt;&lt;td&gt;Road Captain / 路线队长&lt;/td&gt;&lt;td&gt;管理 3 名 T4&lt;/td&gt;&lt;td&gt;加油站、油&lt;/td&gt;&lt;td&gt;路线调度、远程补给、下级英雄&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T6&lt;/td&gt;&lt;td&gt;Treasurer / 财务官&lt;/td&gt;&lt;td&gt;三席同级层&lt;/td&gt;&lt;td&gt;物流中心、物资&lt;/td&gt;&lt;td&gt;管理钱、油、物资的消耗与运输；不新增系统&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T7&lt;/td&gt;&lt;td&gt;Sergeant-at-arms / 武装队长&lt;/td&gt;&lt;td&gt;管理 3 名 T6&lt;/td&gt;&lt;td&gt;获得下级英雄&lt;/td&gt;&lt;td&gt;沿用英雄养成，继续游玩 SUP/推关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T8&lt;/td&gt;&lt;td&gt;Senior Members / 元老成员&lt;/td&gt;&lt;td&gt;三席同级层&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;议会选择任务，继续游玩 SUP/推关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T9&lt;/td&gt;&lt;td&gt;Vice President / 副会长&lt;/td&gt;&lt;td&gt;管理 3 名 T8&lt;/td&gt;&lt;td&gt;枪械/载具投放节点&lt;/td&gt;&lt;td&gt;Clubhouse 帮派管理，继续游玩 SUP/推关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T10&lt;/td&gt;&lt;td&gt;President / 会长&lt;/td&gt;&lt;td&gt;顶层单席&lt;/td&gt;&lt;td&gt;Clubhouse、建筑升级解除限制&lt;/td&gt;&lt;td&gt;统辖副会长线；一日版终点&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;gt-foot&quot;&gt;职级名称参考“帮派树”revision 3872，功能参考“帮派树详细”revision 888；席位与管辖结构按本轮确认规则重画。&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-section succession-part&quot; aria-labelledby=&quot;succession-title&quot;&gt;
      &lt;h2 id=&quot;succession-title&quot;&gt;Part：全职位晋升的游戏内表现&lt;/h2&gt;
      &lt;p class=&quot;dc-note&quot;&gt;本 Part 描述玩家在游戏中实际看到和操作的完整场景：任务进入、玩法证明、角色反应、职位交接、界面反馈与新权限首次使用。职位交接只是场景中的一个环节，建筑接管仍放在后续独立循环。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;晋升目标&lt;/th&gt;&lt;th&gt;玩法 TAG&lt;/th&gt;&lt;th&gt;席位与原职位关系&lt;/th&gt;&lt;th&gt;玩法证明&lt;/th&gt;&lt;th&gt;游戏内表现&lt;/th&gt;&lt;th&gt;取代结果与立即解锁&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;T1 Prospect&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;原 Prospect 晋升或转任，入门席位空出&lt;/td&gt;&lt;td&gt;帮规确认与入会任务&lt;/td&gt;&lt;td&gt;杰森确认玩家可以留下，博为玩家戴上见习背章；帮派树弹出并聚焦 T1 与改装厂使用权。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;背章交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代入门席；获得改装厂使用权，无管理/城建权限&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T2 Full Patch&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平直接提升&lt;/span&gt;&lt;/td&gt;&lt;td&gt;特殊例外：玩家从瓦尔特所辖 T1 离开并填入 T2 空席，不要求原 Full Patch 离职&lt;/td&gt;&lt;td&gt;枪战 SUP 完成本帮押送，作为转正前置条件&lt;/td&gt;&lt;td&gt;玩家首次进入议会，成员直接授予身份；帮派树显示玩家进入 T2 空席，并显示该席下属的 3 名 T1。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;无职位交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;进入正式成员层；每个 T2 管理 3 名 T1；解锁改装厂正式接管与城建&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T3 Enforcer&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T2；原 Enforcer 交棒&lt;/td&gt;&lt;td&gt;查出内鬼并带回证据&lt;/td&gt;&lt;td&gt;玩家追捕内鬼信使并把证据放上会议桌；原 Enforcer 交出执法名单，帮派树更新管辖线。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;权限交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代管理席；原 T2 席位补位；管辖三名 T2；解锁商业街&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T4 Roadman&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;三席之一；原席位者转任&lt;/td&gt;&lt;td&gt;地下竞速 SUP&lt;/td&gt;&lt;td&gt;玩家完成赛前改装并赢得地下竞速；庆祝镜头中原席位者退出队列，Roadman 三席之一点亮。&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;竞速取代&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代一席；斯宾塞、卡莱布仍是同级；解锁废车场&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T5 Road Captain&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-push&quot;&gt;推关战斗&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T4；比利叛变失去席位&lt;/td&gt;&lt;td&gt;SUP 追击 + 推关救援 + 代理带队&lt;/td&gt;&lt;td&gt;会议公布比利罪证，玩家追击夺回背章；随后代理带队完成救援，返程后被正式任命。&lt;span class=&quot;dc-transfer dc-transfer-lethal&quot;&gt;叛徒制裁&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;议会任命&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代比利；原 T4 席位补位；管辖三名 T4；解锁加油站&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T6 Treasurer&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;三席之一；戴尔持有其中一席&lt;/td&gt;&lt;td&gt;产业经营任务&lt;/td&gt;&lt;td&gt;玩家提交经营结果；戴尔在议会中承认失职、辞任并递交账册，物流中心权限点亮。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;失职辞任/账册交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代戴尔的一席；另外两席仍是同级；解锁物流中心&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T7 Sergeant-at-arms&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T6；现任者转任教官&lt;/td&gt;&lt;td&gt;钱/油/物资补给 + 友好枪战 SUP&lt;/td&gt;&lt;td&gt;玩家完成补给和友好枪战；议会复盘时现任者转任教官并交出指挥权。&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;帮内切磋&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;指挥权交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代管理席；原 T6 席位补位；管辖三名 T6；获得下级英雄并沿用英雄养成&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T8 Senior Members&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-push&quot;&gt;推关战斗&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;三席之一；原席位者转任/退休&lt;/td&gt;&lt;td&gt;产业防卫&lt;/td&gt;&lt;td&gt;玩家通过推关和 SUP 完成产业防卫；原元老在议会复盘后让出席位。&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;复合行动&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会议交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代一席；另外两席仍是同级&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T9 Vice President&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T8；韦恩为现任者&lt;/td&gt;&lt;td&gt;传统竞速挑战&lt;/td&gt;&lt;td&gt;玩家选择改装与路线后和韦恩竞速；胜利并带队返程，韦恩当众主动交棒。&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;竞速&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;主动交棒&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代韦恩；原 T8 席位补位；管辖三名 T8；获得 Clubhouse 帮派管理权限&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T10 President&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;顶层单席；杰森为现任者&lt;/td&gt;&lt;td&gt;以副会长身份完成既有玩法循环&lt;/td&gt;&lt;td&gt;全体议会中杰森提名玩家；成员完成表决，杰森交出会长席位与 Clubhouse 权限。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;提名/选举/交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代杰森；原 T9 席位补位；统辖副会长线；一日版结束&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;org-rule-grid&quot;&gt;
        &lt;div&gt;&lt;b&gt;和平交接&lt;/b&gt;&lt;span&gt;晋升、转任、退休或主动让位，仍需明确转移席位和权限。&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;SUP / 切磋&lt;/b&gt;&lt;span&gt;竞速、追击、护送或枪战胜利提供取代资格。&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;推关 / 叛徒&lt;/b&gt;&lt;span&gt;代理带队、救援、组织防卫或清理内部叛徒。&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;会议确认&lt;/b&gt;&lt;span&gt;只承担最终任命与权限转移，纯演出控制在 10–30 秒。&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;div class=&quot;dc-source&quot;&gt;依据《一日渐进线》有效画板 revision 66、《DOBE世界观方案－摩托帮》revision 3872 与《帮派树详细》revision 888 调整。演出时间仅统计不可操作的纯演出；系统教学、选择、改装、领取、骑行与结算均计入可玩时间。&lt;/div&gt;
  &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;dobe-compressed-loops&#x27;);
  if (!root) return;
  const sectionIds = {
    &#x27;整体剧情因果&#x27;:&#x27;dc-story-causal&#x27;,
    &#x27;小游戏出现与复用关系&#x27;:&#x27;dc-minigames&#x27;,
    &#x27;60 分钟后的版本替换&#x27;:&#x27;dc-version-branch&#x27;,
    &#x27;帮派树：具体席位与管辖结构&#x27;:&#x27;dc-gang-tree&#x27;,
    &#x27;Part：全职位晋升的游戏内表现&#x27;:&#x27;dc-promotion-scenes&#x27;
  };
  root.querySelectorAll(&#x27;.dc-section&#x27;).forEach(section =&gt; {
    const heading = section.querySelector(&#x27;h2&#x27;);
    const id = heading &amp;&amp; sectionIds[heading.textContent.trim()];
    if (!id) return;
    section.id = id;
    heading.id = `${id}-title`;
    section.setAttribute(&#x27;aria-labelledby&#x27;, heading.id);
  });
  const actIds = [&#x27;dc-act-prologue&#x27;,&#x27;dc-act-1&#x27;,&#x27;dc-act-2&#x27;,&#x27;dc-act-3&#x27;,&#x27;dc-act-4&#x27;,&#x27;dc-act-5&#x27;];
  root.querySelectorAll(&#x27;.dc-act&#x27;).forEach((act, index) =&gt; {
    if (actIds[index]) act.id = actIds[index];
  });
  const versionHeadings = root.querySelectorAll(&#x27;#dc-version-branch h3&#x27;);
  if (versionHeadings[0]) versionHeadings[0].id = &#x27;dc-version-formal&#x27;;
  if (versionHeadings[1]) versionHeadings[1].id = &#x27;dc-version-one-day&#x27;;
  const rankFunctionHeading = [...root.querySelectorAll(&#x27;#dc-gang-tree h3&#x27;)].find(node =&gt; node.textContent.trim() === &#x27;职级对应功能&#x27;);
  if (rankFunctionHeading) rankFunctionHeading.id = &#x27;dc-rank-functions&#x27;;

  const tocItems = [
    { id:&#x27;dc-overview&#x27;, label:&#x27;总览&#x27;, level:2 },
    { id:&#x27;dc-story-causal&#x27;, label:&#x27;整体剧情因果&#x27;, level:2 },
    { id:&#x27;dc-minigames&#x27;, label:&#x27;小游戏出现与复用&#x27;, level:2 },
    { id:&#x27;dc-act-prologue&#x27;, label:&#x27;序幕 · 被卷入&#x27;, level:2 },
    { id:&#x27;dc-act-1&#x27;, label:&#x27;第一幕 · 见习与转正&#x27;, level:2 },
    { id:&#x27;dc-act-2&#x27;, label:&#x27;第二幕 · 改装厂与商业街&#x27;, level:2 },
    { id:&#x27;dc-act-3&#x27;, label:&#x27;第三幕 · 赛事与叛徒&#x27;, level:2 },
    { id:&#x27;dc-act-4&#x27;, label:&#x27;第四幕 · 加油站与物流&#x27;, level:2 },
    { id:&#x27;dc-act-5&#x27;, label:&#x27;第五幕 · 高阶晋升&#x27;, level:2 },
    { id:&#x27;dc-version-branch&#x27;, label:&#x27;60 分钟版本分流&#x27;, level:2 },
    { id:&#x27;dc-version-formal&#x27;, label:&#x27;正式版大地图&#x27;, level:3 },
    { id:&#x27;dc-version-one-day&#x27;, label:&#x27;一日版代理循环&#x27;, level:3 },
    { id:&#x27;dc-gang-tree&#x27;, label:&#x27;帮派树结构&#x27;, level:2 },
    { id:&#x27;dc-rank-functions&#x27;, label:&#x27;职级对应功能&#x27;, level:3 },
    { id:&#x27;dc-promotion-scenes&#x27;, label:&#x27;全职位游戏内表现&#x27;, level:2 }
  ].filter(item =&gt; document.getElementById(item.id));
  const tocNav = root.querySelector(&#x27;#dobe-toc-nav&#x27;);
  const tocList = document.createElement(&#x27;ul&#x27;);
  tocList.className = &#x27;dc-toc-list&#x27;;
  const links = new Map();
  const setActive = id =&gt; {
    links.forEach((link, key) =&gt; link.classList.toggle(&#x27;is-active&#x27;, key === id));
    const active = links.get(id);
    if (active) active.setAttribute(&#x27;aria-current&#x27;, &#x27;location&#x27;);
    links.forEach((link, key) =&gt; { if (key !== id) link.removeAttribute(&#x27;aria-current&#x27;); });
  };
  tocItems.forEach(item =&gt; {
    const listItem = document.createElement(&#x27;li&#x27;);
    listItem.className = &#x27;dc-toc-item&#x27;;
    const link = document.createElement(&#x27;a&#x27;);
    link.className = &#x27;dc-toc-link&#x27;;
    link.href = `#${item.id}`;
    link.dataset.level = String(item.level);
    link.textContent = item.label;
    link.addEventListener(&#x27;click&#x27;, event =&gt; {
      event.preventDefault();
      const target = document.getElementById(item.id);
      if (!target) return;
      const behavior = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches ? &#x27;auto&#x27; : &#x27;smooth&#x27;;
      target.scrollIntoView({ behavior, block:&#x27;start&#x27; });
      setActive(item.id);
    });
    listItem.appendChild(link);
    tocList.appendChild(listItem);
    links.set(item.id, link);
  });
  tocNav.appendChild(tocList);
  setActive(&#x27;dc-overview&#x27;);
  if (&#x27;IntersectionObserver&#x27; in window) {
    const observer = new IntersectionObserver(entries =&gt; {
      const visible = entries.filter(entry =&gt; entry.isIntersecting).sort((a, b) =&gt; a.boundingClientRect.top - b.boundingClientRect.top);
      if (visible[0]) setActive(visible[0].target.id);
    }, { rootMargin:&#x27;-8% 0px -76% 0px&#x27;, threshold:[0, 1] });

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();

      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }

  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

    }

  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);

  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {

    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {

    }

  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
