:root[data-theme=&quot;light&quot;] {

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;dobe-compressed-loops&quot;&gt;
  &lt;style&gt;
    #dobe-compressed-loops {
      color-scheme: light dark;
      --background: light-dark(rgb(255 255 255), rgb(24 24 24));
      --foreground: light-dark(rgb(26 28 31), rgb(255 255 255));
      --muted-foreground: light-dark(rgb(26 28 31 / 58%), rgb(255 255 255 / 62%));

      --viz-series-1: light-dark(rgb(51 156 255), rgb(131 195 255));
      --viz-series-2: light-dark(rgb(243 136 59), rgb(245 154 86));
      --viz-series-3: light-dark(rgb(93 201 119), rgb(116 213 139));
      --viz-series-4: light-dark(rgb(235 119 177), rgb(240 143 192));
      --viz-series-5: light-dark(rgb(155 121 236), rgb(170 145 239));
      --viz-series-6: light-dark(rgb(58 185 177), rgb(90 203 194));

      background: var(--background);
      padding: 24px;
      font-family: &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, system-ui, sans-serif;
    }
    #dobe-compressed-loops * { box-sizing: border-box; }

    #dobe-compressed-loops .dc-toc-list { list-style: none; margin: 0; padding: 0; }
    #dobe-compressed-loops .dc-toc-item { margin: 1px 0; }
    #dobe-compressed-loops .dc-toc-link { display: block; padding: 7px 10px; border-left: 2px solid transparent; color: var(--muted-foreground); text-decoration: none; line-height: 1.45; transition: color .16s ease, background-color .16s ease, border-color .16s ease; }

    #dobe-compressed-loops .dc-toc-link:hover,

    #dobe-compressed-loops .dc-act-chip:last-child { border-right: 0; }

    &lt;div class=&quot;dc-kicker&quot;&gt;一日版本 &#183; 90 分钟渐进体验&lt;/div&gt;
    &lt;h1&gt;Dobe一日渐进规划&lt;/h1&gt;

    &lt;figure class=&quot;dc-journey-map&quot; id=&quot;dc-journey-map&quot; aria-labelledby=&quot;dc-journey-map-title&quot;&gt;
      &lt;figcaption&gt;&lt;div&gt;&lt;b id=&quot;dc-journey-map-title&quot;&gt;方案 B &#183; 本地见习生全流程&lt;/b&gt;&lt;span&gt;从帮派边缘成员到帮派会长：玩家目标、阶段追求与系统承接一图总览&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;dc-journey-badge&quot;&gt;0–90 分钟&lt;/span&gt;&lt;/figcaption&gt;
      &lt;div class=&quot;dc-journey-scroll&quot;&gt;&lt;div class=&quot;dc-journey-route&quot;&gt;
        &lt;article class=&quot;dc-journey-stage&quot; data-step=&quot;01&quot;&gt;&lt;span class=&quot;dc-journey-time&quot;&gt;0:00–3:20 &#183; 序幕&lt;/span&gt;&lt;h3&gt;被帮派接住&lt;/h3&gt;&lt;div class=&quot;dc-journey-copy&quot;&gt;&lt;div class=&quot;dc-player-goal&quot;&gt;&lt;b&gt;玩家目标&lt;/b&gt;&lt;span&gt;配合分流警方、反击黑手党并把受损车辆拖回改装厂&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-player-pursuit&quot;&gt;&lt;b&gt;核心追求&lt;/b&gt;&lt;span&gt;安全回城、完成第一项见习证明&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
        &lt;article class=&quot;dc-journey-stage&quot; data-step=&quot;02&quot;&gt;&lt;span class=&quot;dc-journey-time&quot;&gt;3:20–11:50 &#183; 第一幕&lt;/span&gt;&lt;h3&gt;见习转正&lt;/h3&gt;&lt;div class=&quot;dc-journey-copy&quot;&gt;&lt;div class=&quot;dc-player-goal&quot;&gt;&lt;b&gt;玩家目标&lt;/b&gt;&lt;span&gt;修好自己的车、维修打工并完成袭击车队考核&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-player-pursuit&quot;&gt;&lt;b&gt;核心追求&lt;/b&gt;&lt;span&gt;赢得成员认可，成为 Full Patch&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
        &lt;article class=&quot;dc-journey-stage&quot; data-step=&quot;03&quot;&gt;&lt;span class=&quot;dc-journey-time&quot;&gt;11:50–26:50 &#183; 第二幕&lt;/span&gt;&lt;h3&gt;经营、赛车与复仇&lt;/h3&gt;&lt;div class=&quot;dc-journey-copy&quot;&gt;&lt;div class=&quot;dc-player-goal&quot;&gt;&lt;b&gt;玩家目标&lt;/b&gt;&lt;span&gt;自动化改装厂、赢下赛车、复仇并接管废车场&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-player-pursuit&quot;&gt;&lt;b&gt;核心追求&lt;/b&gt;&lt;span&gt;稳定资源产出、Enforcer 职位与下属&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
        &lt;article class=&quot;dc-journey-stage&quot; data-step=&quot;04&quot;&gt;&lt;span class=&quot;dc-journey-time&quot;&gt;26:50–45:00 &#183; 第三幕&lt;/span&gt;&lt;h3&gt;首次推关与内奸清理&lt;/h3&gt;&lt;div class=&quot;dc-journey-copy&quot;&gt;&lt;div class=&quot;dc-player-goal&quot;&gt;&lt;b&gt;玩家目标&lt;/b&gt;&lt;span&gt;攻打接头点找线索、追回账册、处决比利并恢复产业&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-player-pursuit&quot;&gt;&lt;b&gt;核心追求&lt;/b&gt;&lt;span&gt;Roadman / Road Captain 晋升与产业扩张&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
        &lt;article class=&quot;dc-journey-stage&quot; data-step=&quot;05&quot;&gt;&lt;span class=&quot;dc-journey-time&quot;&gt;45:00–60:00 &#183; 第四幕&lt;/span&gt;&lt;h3&gt;带队救援与物流&lt;/h3&gt;&lt;div class=&quot;dc-journey-copy&quot;&gt;&lt;div class=&quot;dc-player-goal&quot;&gt;&lt;b&gt;玩家目标&lt;/b&gt;&lt;span&gt;连续推关救出梅丽尔、追回账本并恢复物流中心&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-player-pursuit&quot;&gt;&lt;b&gt;核心追求&lt;/b&gt;&lt;span&gt;指挥权、英雄伙伴、Treasurer 资源权&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
        &lt;article class=&quot;dc-journey-stage&quot; data-step=&quot;06&quot;&gt;&lt;span class=&quot;dc-journey-time&quot;&gt;60:00–90:00 &#183; 第五幕&lt;/span&gt;&lt;h3&gt;推关闭环与会长交接&lt;/h3&gt;&lt;div class=&quot;dc-journey-copy&quot;&gt;&lt;div class=&quot;dc-player-goal&quot;&gt;&lt;b&gt;玩家目标&lt;/b&gt;&lt;span&gt;清理残党、护送物资、修复产业并完成连续履职&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-player-pursuit&quot;&gt;&lt;b&gt;核心追求&lt;/b&gt;&lt;span&gt;从 Sergeant 走到 President，掌控整个组织&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
      &lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;dc-journey-outcome&quot;&gt;整条渐进的欲望升级：被保护 → 证明价值 → 拥有产业与下属 → 掌握情报与地盘 → 指挥行动 → 成为 President&lt;/div&gt;

    &lt;section class=&quot;dc-section dc-part&quot; id=&quot;dc-part-2&quot; aria-labelledby=&quot;dc-part-2-title&quot;&gt;

      &lt;p class=&quot;dc-note&quot;&gt;先看整体因果与六幕承接关系，再逐幕查看分钟级循环。&lt;/p&gt;
      &lt;h3 id=&quot;dc-memory-structure-title&quot;&gt;帮派体验记忆结构&lt;/h3&gt;
      &lt;p class=&quot;dc-note&quot;&gt;&lt;strong&gt;核心幻想是归属感。&lt;/strong&gt;现有剧情结构不变，用四类场景表现增强每个关键节点。&lt;/p&gt;
      &lt;div class=&quot;dc-memory-grid&quot;&gt;
        &lt;div class=&quot;dc-memory-card&quot;&gt;&lt;b&gt;Routine &#183; 常态运作&lt;/b&gt;&lt;span&gt;改装厂 SOP、职能称谓、兄弟一起挣钱与经营。&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-memory-card&quot;&gt;&lt;b&gt;Rituals &#183; 权力仪式&lt;/b&gt;&lt;span&gt;背章、座次、木槌、投票、车队阵型与晋升反馈。&lt;/span&gt;&lt;/div&gt;

        &lt;div class=&quot;dc-memory-card&quot;&gt;&lt;b&gt;Sanction &#183; 绝对制裁&lt;/b&gt;&lt;span&gt;由会长或议会授权的追击与处置，强调集体秩序。&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;dc-causal&quot;&gt;
        &lt;div&gt;&lt;b&gt;警匪追逐&lt;/b&gt;&lt;br&gt;&lt;span&gt;帮派成员分流警力&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;黑手党伏击&lt;/b&gt;&lt;br&gt;&lt;span&gt;玩家与金发 NPC 枪战反击&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;加入与转正&lt;/b&gt;&lt;br&gt;&lt;span&gt;保护变成责任&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;承接产业&lt;/b&gt;&lt;br&gt;&lt;span&gt;共同资产转交玩家管理&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;竞速、追杀与复仇&lt;/b&gt;&lt;br&gt;&lt;span&gt;负责人牺牲形成职位与产业空缺&lt;/span&gt;&lt;/div&gt;

        &lt;div&gt;&lt;b&gt;复玩与晋升&lt;/b&gt;&lt;br&gt;&lt;span&gt;证明能领导全帮&lt;/span&gt;&lt;/div&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;1&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;0:00–3:20&lt;/span&gt;&lt;b&gt;序幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;警方分流与黑手党伏击&lt;/b&gt;&lt;span&gt;帮派成员引开警方；黑手党随后突袭并打坏玩家车辆，玩家与金发 NPC 枪战反击后把自己的受损车辆拖回改装厂，完成见习转正任务第 1 项。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;警匪追逐 SUP &#215;1、枪战 SUP &#215;1、帮派树进度提示 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;4 循环 / 3m20s&lt;/b&gt;&lt;span&gt;SUP 各约 60s / 演出 10–30s&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;无&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-sup-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;0:00–1:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L01 警匪追逐&lt;/div&gt;&lt;span class=&quot;dc-first-badge dc-first-sup-badge&quot;&gt;新玩法解锁 &#183; SUP 首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;警匪追逐 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;无人机航拍公路，警方频道播报正在追击科尔；镜头下拉进入汽车视角。&lt;/td&gt;&lt;td&gt;摆脱警方&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;航拍+警方播报+镜头接管&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;0:20–1:20&lt;/time&gt; 警匪追逐 SUP &#215;1：闪避、择路、甩脱&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;SUP 正式解锁：单局约 60 秒；本关不主动撞击警车&lt;/span&gt;普通车辆仍不足以突破追捕。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;1:20–1:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L02 摩托帮成员分流警方&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 兄弟完美接应 / 警方分流&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;剧情接应 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;博与摩托帮成员按预设分流阵型主动分头骑行，把追捕玩家的警车引向不同岔路；玩家成功脱离警方视线，与金发 NPC 在公路接应点会合。&lt;/td&gt;&lt;td&gt;借助帮派摆脱警方&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;30s&lt;/strong&gt;&lt;br&gt;成员出现+分流警车+会合&lt;/td&gt;&lt;td&gt;跟随指示变道 / 确认警方被引开。&lt;/td&gt;&lt;td&gt;警方暂时退场；统一背心与背章首次清晰展示；玩家准备继续当前见习任务。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;1:50–3:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L03 黑手党伏击反击&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;表现约束 &#183; 假友军协作&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与金发 NPC 会合后，黑手党突然驾车袭击。金发 NPC 通过开局同屏、无线电和结尾演出与玩家共同反击；玩家独立完成 SUP 并击退来袭车辆，但玩家自己的车辆在交火中被打坏，无法继续驾驶。&lt;/td&gt;&lt;td&gt;在兄弟接应下击退伏击&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;黑手党突袭+玩家车辆受损+切入枪战&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;2:00–3:00&lt;/time&gt; 枪战 SUP &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;3:00–3:10&lt;/time&gt; 确认击败敌人并检查玩家车辆&lt;/span&gt;&lt;/td&gt;&lt;td&gt;黑手党伏击被击退；玩家车辆受损，需要拖回改装厂维修。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-gang-tree-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;3:10–3:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L04 拖走玩家车辆与任务进度&lt;/div&gt;&lt;span class=&quot;dc-system-first-gang-tree&quot;&gt;新系统解锁 &#183; 帮派树首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;收束演出 &#215;1 / 进度提示 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;帮派成员把玩家被打坏的车辆挂上拖车，准备拖回改装厂。帮派树首次弹出，显示玩家当前为 Prospect，并确认本次反击已完成见习转正任务的第 1 项。&lt;/td&gt;&lt;td&gt;保住自己的车辆并确认转正进度&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;玩家车辆上拖车+任务进度卡&lt;/td&gt;&lt;td&gt;查看帮派树任务进度：1 / 3。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-gang-tree-callout&quot;&gt;帮派树首次出现：见习转正任务 1 / 3 已完成&lt;/span&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;当前职位：Prospect&lt;/span&gt;再完成 2 项任务即可参加正式转正。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;2&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;3:20–11:50&lt;/span&gt;&lt;b&gt;第一幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;搭乘回城、修复自己的车、维修打工与枪战考核&lt;/b&gt;&lt;span&gt;玩家随拖车队回城，先修复自己的受损车辆，再维修两辆帮派成员车辆并完成袭击车队任务，返程后由议会投票正式转正；追杀与拆车剧情移至第二幕。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;帮派骑行 &#215;2、SUP &#215;1、改装/维修小游戏 &#215;4、议会 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;总时长 8m30s&lt;/b&gt;&lt;span&gt;SUP 约 60s&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Full Patch&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平直接提升&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;3:20–4:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L05 搭乘返城与见习任务说明&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 标准车队阵型 / 背章&lt;/span&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新玩法 &#183; 帮派骑行首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;搭乘车队 / 骑行对话 &#215;1 / 帮派树教学 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家搭乘金发 NPC 的车辆，跟随拖着自己受损车辆的标准阵型车队返回城市；途中成员以职能称谓互相呼叫，博讲解帮派设定，并说明玩家只能留在这里继续完成见习转正。抵达后展开帮派树教学，回顾已完成的第 1 项任务和剩余 2 项任务。&lt;/td&gt;&lt;td&gt;跟车回城并继续完成转正&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;转正路径说明&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;3:20–3:50&lt;/time&gt; 搭乘车队 / 对话随骑行推进&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;3:50–4:10&lt;/time&gt; 拖车抵达改装厂&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;4:10–4:50&lt;/time&gt; 帮派树教学 / 查看剩余任务&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;当前职位：Prospect&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;建筑：改装厂&#183;仅使用权&lt;/span&gt;玩家受损车辆进入维修位；转正进度保持 1 / 3。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;4:50–6:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L06 修复自己的车并维修两辆帮派车&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 改装厂 SOP / 集体劳动&lt;/span&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-A 改装 / 维修 &#215;3&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家先修复在 L03 中被黑手党打坏的自己的车辆，恢复行动能力；随后按改装厂接车、维修、交车的 SOP 继续维修两辆帮派成员的车辆，以额外劳动换取资金并完成第二项见习证明。&lt;/td&gt;&lt;td&gt;修回自己的车并证明维修能力&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;0s&lt;/strong&gt;&lt;br&gt;连续操作&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;4:50–5:20&lt;/time&gt; 修复玩家车辆 &#183; MG-A &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;5:20–5:50&lt;/time&gt; 帮派成员车辆 1 &#183; MG-A &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;5:50–6:20&lt;/time&gt; 帮派成员车辆 2 &#183; MG-A &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;6:20–6:30&lt;/time&gt; 两辆帮派车交付 / 结算&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：钱&#183;首次获得&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;自己的车辆维修不产钱；两辆帮派成员车辆结算资金，见习转正进度更新为 2 / 3&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;6:30–8:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L07 车队袭击准备&lt;/div&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-A 改装 / 维修&lt;/span&gt;&lt;/td&gt;&lt;td&gt;博说明转正任务是袭击一支指定车队，交给玩家一个剧情配件用于强化自己的车，随后发放枪支。&lt;/td&gt;&lt;td&gt;为枪战任务完成车辆与武器准备&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;任务与配件交付&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;6:50–7:20&lt;/time&gt; 强化自己的车 &#183; MG-A &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;7:20–7:30&lt;/time&gt; 领取枪支&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;7:30–8:00&lt;/time&gt; 前往目标位置&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;任务车强化与枪支使用权开启；剧情配件不计入零件资源&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;8:00–9:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L08 袭击目标车队&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 兄弟一起做任务&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家按帮派分工袭击指定车队并夺取货物，完成第 3 项见习转正任务；本幕不再出现武装肌肉车追杀。&lt;/td&gt;&lt;td&gt;抢到货物并完成考核&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;目标建立&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;8:20–9:20&lt;/time&gt; 枪战 SUP &#215;1 &#183; 袭击车队夺货&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;9:20–9:30&lt;/time&gt; 夺货结算&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：声望&#183;首次获得&lt;/span&gt;见习转正任务进度达到 3 / 3，接续返程邀请。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;9:30–10:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L09 骑行返程与正式邀请&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 阵型返程 / 正式提名&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;骑行小游戏 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家带着货物回到车队指定位置，与成员按标准阵型骑行返城；过程中博和成员夸奖玩家的驾驶、改装与枪战技术，并正式邀请玩家加入。&lt;/td&gt;&lt;td&gt;带着战果返回帮派&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;0s&lt;/strong&gt;&lt;br&gt;邀请随骑行完成&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;9:30–10:00&lt;/time&gt; 返程骑行小游戏 &#215;1 &#183; 夸奖与正式邀请&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;10:00–10:20&lt;/time&gt; 进入 Clubhouse / 会议入口&lt;/span&gt;&lt;/td&gt;&lt;td&gt;正式入会提名成立；直接接入首次议会投票。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-meeting-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;10:20–11:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L10 首次议会&#183;投票转正&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 座次 / 木槌 / 正式背章&lt;/span&gt;&lt;span class=&quot;dc-system-first-meeting&quot;&gt;新系统解锁 &#183; 议会首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;议会 &#215;1 / 特殊晋升 &#215;1 / 会议任务 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;成员按职级落座；会长以木槌开会、授权发言并确认投票，正式授予 Full Patch 背章。玩家从瓦尔特所辖 T1 离开并填入一个 T2 空席；议会发布后续帮派任务，并把改装厂管理授权交给玩家。&lt;/td&gt;&lt;td&gt;获得正式身份与第一项产业职责&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;座次、木槌与投票&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;10:40–11:20&lt;/time&gt; 议会教学 / T2 空席填入 / 帮派树更新&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;11:20–11:50&lt;/time&gt; 发布会议任务 / 改装厂接管授权&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-meeting-callout&quot;&gt;议会系统正式解锁；帮派树显示每个 T2 管理 3 名 T1&lt;/span&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;职位：Full Patch&#183;和平直接提升&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;改装厂接管任务开启&lt;/span&gt;第一幕结束。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;3&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;11:50–26:50&lt;/span&gt;&lt;b&gt;第二幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;赛车备战、追杀换车与废车场复仇&lt;/b&gt;&lt;span&gt;玩家先让改装厂自动运行，再接受赛车邀请；竞速前去废车场拆黑市车辆取零件并换件。竞速结束后逃回城市，拆解被击毁的追杀车辆、获得并改装第二辆车完成复仇；回帮开会晋升 Enforcer 后，接管、建设并派遣成员到废车厂。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP &#215;3、拆车 &#215;3、改装 &#215;2、成员接管/派遣 &#215;2、建筑接管 &#215;2、城建 &#215;2。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;15 循环&lt;/b&gt;&lt;span&gt;废车厂自动经营 25:50–26:50&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Enforcer&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p class=&quot;dc-note&quot;&gt;赛前拆车由废车场负责人许可，复仇准备发生在玩家逃回城市之后；L22 会议授予 Enforcer 职位和建筑权限，L23–L25 再依次完成接管、建设与成员派遣。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;11:50–12:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L11 接管改装厂&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 &#183; 建筑接管首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;点击接管 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家抵达改装厂，在建筑入口点击接管，立即完成本帮内部管理权确认。&lt;/td&gt;&lt;td&gt;取得改装厂管理权&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;抵达与结果反馈&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;11:50–12:10&lt;/time&gt; 抵达 / 接管入口&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;12:10–12:20&lt;/time&gt; 点击接管 / 状态更新&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;改装厂&#183;内部接管&lt;/span&gt;立即开启 L12。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;12:20–13:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L12 修建改装厂&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 &#183; 城建首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;子建筑升级 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家升级首个子建筑，完成一次城建教学。&lt;/td&gt;&lt;td&gt;开放派遣条件&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;目标与结果&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;12:20–12:30&lt;/time&gt; 目标提示&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;12:30–13:10&lt;/time&gt; 子建筑升级&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;13:10–13:20&lt;/time&gt; 派遣位开放&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;改装厂 Lv.1&lt;/span&gt;尚未自动运行。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;13:20–14:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L13 小弟接管与改装厂派遣&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 &#183; 模拟经营首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;帮派树接管 &#215;1 / 派遣 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;大佬提示玩家可以带小弟；玩家在帮派树接管小弟并派遣至改装厂。&lt;/td&gt;&lt;td&gt;让改装厂自动运行&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;大佬提示&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;13:30–13:45&lt;/time&gt; 帮派树点击接管&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;13:45–14:05&lt;/time&gt; 派遣小弟&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;14:05–14:20&lt;/time&gt; 自动运行反馈&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;模拟经营首次解锁&lt;/span&gt;接到赛车邀请。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;14:20–14:40&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L14 赛车邀请&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;剧情任务 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;帮派邀请玩家参加一场 SUP 赛车，并建议赛前先去废车场拆几辆黑市车辆取配件。&lt;/td&gt;&lt;td&gt;为比赛准备车辆&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;邀请与备战目标&lt;/td&gt;&lt;td&gt;确认比赛目标 / 前往废车场。&lt;/td&gt;&lt;td&gt;废车回收帮助任务开启。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;14:40–16:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L15 黑市车辆回收&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新玩法 &#183; 废车回收首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;拆车 &#215;2&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家到本帮废车场帮忙处理两辆黑市车辆，以获取赛车强化所需配件。&lt;/td&gt;&lt;td&gt;取得竞速强化配件&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;现场说明&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;14:50–15:20&lt;/time&gt; 拆车 1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;15:30–16:00&lt;/time&gt; 拆车 2&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：零件&#183;首次获得&lt;/span&gt;仅获得配件，不获得废车场管理权。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;16:00–16:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L16 赛前换件&lt;/div&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-A 改装 / 维修&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家把刚取得的配件装到当前车辆上，再前往赛场。&lt;/td&gt;&lt;td&gt;把零件转化为竞速能力&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;0s&lt;/strong&gt;&lt;br&gt;全程可操作&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;16:00–16:30&lt;/time&gt; 更换配件 &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;16:30–16:50&lt;/time&gt; 前往赛场&lt;/span&gt;&lt;/td&gt;&lt;td&gt;消耗本次配件；进入竞速 SUP。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;16:50–18:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L17 赛车比赛&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 竞速仪式&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;竞速 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家从车队指定位置出列，代表帮派完成赛车比赛，验证此前的驾驶与改装成果。&lt;/td&gt;&lt;td&gt;赢得比赛&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;开赛与赛果&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;17:10–18:10&lt;/time&gt; 竞速 SUP &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;18:10–18:20&lt;/time&gt; 赛果反馈&lt;/span&gt;&lt;/td&gt;&lt;td&gt;竞速胜利；离场时突发追杀。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;18:20–19:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L18 赛后追杀&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 兄弟完美接应&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;逃亡枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;黑手党战车突然扫射；废车场负责人驾车贴靠接应、替玩家承受致命火力并在追杀中死亡，友军只在开局、无线电和结尾出现，玩家独立完成 SUP 并击毁敌车，最终撤回城市。&lt;/td&gt;&lt;td&gt;活着脱离伏击&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;伏击与死亡&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;18:40–19:40&lt;/time&gt; 枪战 SUP &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;19:40–19:50&lt;/time&gt; 拖车撤回城市&lt;/span&gt;&lt;/td&gt;&lt;td&gt;把被击毁的追杀车辆拖回废车场，准备谋划反击。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;19:50–20:40&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L19 谋划反击与拆车&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 越界定性 / 会长授权&lt;/span&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-C 拆解 / 分拣&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家回城汇报后，会长将袭击定性为越界并授权帮派制裁；玩家与成员制定反击计划，并拆解 L18 拖回的追杀车辆，寻找复仇车辆所需配件。&lt;/td&gt;&lt;td&gt;把敌方残车转化为反击条件&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;反击计划&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;20:00–20:30&lt;/time&gt; 拆解 L18 残车 &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;20:30–20:40&lt;/time&gt; 配件结算&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取得新车改装配件。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;20:40–21:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L20 第二辆车投放与改装&lt;/div&gt;&lt;span class=&quot;dc-reward-vehicle&quot;&gt;新投放 &#183; 剧情线第 2 辆车&lt;/span&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-A 改装 / 维修&lt;/span&gt;&lt;/td&gt;&lt;td&gt;废车场提供一辆可修复的新车；玩家使用拆出的配件完成改装并将其作为复仇车辆。&lt;/td&gt;&lt;td&gt;获得能完成复仇的新载具&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;新车交付&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;21:00–21:30&lt;/time&gt; 新车改装 &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;21:30–21:50&lt;/time&gt; 驾车出发&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-vehicle&quot;&gt;车辆投放：剧情线第 2 辆车&lt;/span&gt;进入复仇 SUP。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;21:50–23:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L21 公路复仇&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 绝对制裁&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家执行会长授权的制裁，驾驶新车追上伏击车队并完成枪战复仇并取回负责人遗物。&lt;/td&gt;&lt;td&gt;为负责人复仇&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;目标确认&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;22:10–23:10&lt;/time&gt; 枪战 SUP &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;23:10–23:20&lt;/time&gt; 取回遗物&lt;/span&gt;&lt;/td&gt;&lt;td&gt;复仇完成；返回帮派召开会议。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;23:20–24:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L22 复仇复盘与 Enforcer 晋升&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 成员追悼 / 木槌 / 座次 / 背章&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;会议 &#215;1 / 晋升 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;遇害负责人的背心与遗物置于纪念位，成员触摸底章并完成引擎致敬；玩家在会议中汇报；现任 Enforcer 转任，会长以木槌确认投票和座次变更，宣布由玩家接替，并授权其接管废车场。&lt;/td&gt;&lt;td&gt;承接战果与产业责任&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20–30s&lt;/strong&gt;&lt;br&gt;会议任命&lt;/td&gt;&lt;td&gt;会议复盘 / Enforcer 交接 / 帮派树更新。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;职位：Enforcer&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁废车回收厂接管&lt;/span&gt;开始管辖三名 Full Patch。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;24:20–24:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L23 接管废车回收厂&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;点击接管 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家以 Enforcer 身份返回废车场，在建筑入口点击接管。&lt;/td&gt;&lt;td&gt;把职位授权落到建筑&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;接管反馈&lt;/td&gt;&lt;td&gt;点击接管 / 管理状态更新。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;废车回收厂&#183;内部接管&lt;/span&gt;进入建设循环。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;24:50–25:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L24 建设废车回收厂&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;子建筑升级 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家修复拆解工位，让废车回收厂具备正式生产条件。&lt;/td&gt;&lt;td&gt;开放成员派遣条件&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;建设反馈&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;25:00–25:40&lt;/time&gt; 工位升级&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;25:40–25:50&lt;/time&gt; 派遣位开放&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;废车回收厂 Lv.1&lt;/span&gt;接续成员接管与派遣。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;25:50–26:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L25 接管成员、派遣与异常汇报&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;帮派树接管 &#215;1 / 派遣 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家在帮派树中接管一名 Full Patch 成员，并把他派遣到废车回收厂负责拆解工位。首轮自动拆解后，下属发现残车编号、出入记录与账目对不上，怀疑帮派内部有人向黑手党泄露车辆路线；会长要求玩家调查内奸。&lt;/td&gt;&lt;td&gt;让废车回收厂自动运行并查清异常&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;下属汇报 / 会长下令&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;26:00–26:20&lt;/time&gt; 帮派树点击接管&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;26:20–26:40&lt;/time&gt; 派遣至废车厂&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;26:40–26:50&lt;/time&gt; 自动运行反馈 / 查看异常记录&lt;/span&gt;&lt;/td&gt;&lt;td&gt;废车回收厂模拟经营循环开启；内奸调查任务成立，异常记录指向两个外部接头点。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;4&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;26:50–45:00&lt;/span&gt;&lt;b&gt;第三幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;调查内奸、推关找线索、Roadman、商业街、比利叛变与加油站&lt;/b&gt;&lt;span&gt;承接废车厂自动经营暴露的异常记录，玩家奉命调查内奸，以首次推关攻打两个外部接头点，取得交易与通讯线索并追回商业街账册；随后晋升 Roadman 并恢复商业街，揭出比利后追击处决并晋升 Road Captain，再接管加油站。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;推关 &#215;2、SUP &#215;1、接管 &#215;2、城建 &#215;2、议会 &#215;2。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;8 循环&lt;/b&gt;&lt;span&gt;首次推关 26:50–30:00&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Roadman&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Road Captain&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-system-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;26:50–30:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L26 调查内奸&#183;首组推关&lt;/div&gt;&lt;span class=&quot;dc-system-first&quot;&gt;新系统解锁 &#183; 推关首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;推关 &#215;2&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家按 L25 的异常记录前往两个外部接头点，连续战斗击败黑手党接头人，取得交易残页和通讯记录，并追回被复制的商业街账册。&lt;/td&gt;&lt;td&gt;寻找内奸线索&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;推关 &#215;2：攻打接头点 1 → 攻打接头点 2 → 搜集剧情线索。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;推关系统正式解锁&lt;/span&gt;获得内奸调查线索；Roadman 晋升议题开启。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;30:00–31:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L27 Roadman 晋升&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家提交追回的商业街账册；现任 Roadman 转任，由会议完成职位交接。&lt;/td&gt;&lt;td&gt;接管更大产业责任&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会议交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Enforcer 阶段完成废车场恢复与内应清理。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Roadman&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁商业街&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;31:00–32:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L28 接管商业街&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家以 Roadman 身份带回账册，本帮前任负责人交出钥匙；梅丽尔首次出场。&lt;/td&gt;&lt;td&gt;恢复钱产业管理&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;已先取得 Roadman 权限。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;商业街&#183;内部接管&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;32:30–34:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L29 建设商业街与支付佣金&lt;/div&gt;&lt;/td&gt;&lt;td&gt;恢复商铺并收钱；警长领取佣金并确认后续帮助义务。&lt;/td&gt;&lt;td&gt;恢复钱产出&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;建设/收取&lt;/span&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;商业街 Lv.1&lt;/span&gt;钱稳定产出开启。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;34:00–36:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L30 庆功与叛徒议会&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 内部越界 / 木槌表决&lt;/span&gt;&lt;/td&gt;&lt;td&gt;庆功中木槌落下、全场归位；证据被摆上议会桌，成员确认比利泄密并投票剥夺背章与职位，比利逃离。&lt;/td&gt;&lt;td&gt;制裁叛徒&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-lethal&quot;&gt;剥夺职位/制裁&lt;/span&gt;&lt;/td&gt;&lt;td&gt;比利失去 Road Captain 席位并形成空缺。&lt;/td&gt;&lt;td&gt;追击任务开启。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;36:00–39:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L31 追击比利与任命&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 绝对制裁 / 席位前移&lt;/span&gt;&lt;/td&gt;&lt;td&gt;追击 SUP &#215;1 → 执行议会制裁 → 取回背章 → 木槌确认任命与车队位置。&lt;/td&gt;&lt;td&gt;填补队长空缺&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;追击叛徒&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;议会任命&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家取代比利；原 Roadman 席位由 NPC 补位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Road Captain&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁加油站&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;39:00–42:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L32 接管加油站&lt;/div&gt;&lt;/td&gt;&lt;td&gt;晋升后前往加油站，本帮前任负责人交出路线图与管理钥匙。&lt;/td&gt;&lt;td&gt;取得油产业&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Road Captain 已先解锁加油站。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;加油站&#183;内部接管&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;42:00–45:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L33 建设加油站&lt;/div&gt;&lt;/td&gt;&lt;td&gt;修复泵机、安排补给路线并收取首批油。&lt;/td&gt;&lt;td&gt;恢复油产出&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;建设/收取&lt;/span&gt;&lt;/td&gt;&lt;td&gt;前任经营者继续负责现场。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;加油站 Lv.1&lt;/span&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：油&#183;首次获得&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;5&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;45:00–60:00&lt;/span&gt;&lt;b&gt;第四幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;梅丽尔救援与物流中心&lt;/b&gt;&lt;span&gt;比利同党绑走梅丽尔；玩家带队救援并追回物流账本，再完成 Treasurer 与物流中心循环。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;推关 &#215;3、接管 &#215;1、城建 &#215;1、议会 &#215;1、英雄获得 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;4 循环&lt;/b&gt;&lt;span&gt;晋升 &#215;1 / 建筑循环 &#215;2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Treasurer&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;45:00–49:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L34 解救梅丽尔&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 兄弟救援&lt;/span&gt;&lt;/td&gt;&lt;td&gt;比利同党绑走梅丽尔以销毁账目 → 玩家带队推关 &#215;3 → 救出梅丽尔并追回物流账本。&lt;/td&gt;&lt;td&gt;履行“兄弟不会被丢下”的队长职责&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;救援行动&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家实际指挥三名 Roadman。&lt;/td&gt;&lt;td&gt;获得英雄梅丽尔；追回账本并开启 Treasurer 议题。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;49:00–51:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L35 财务官晋升&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家在议会交出账本和救援结果 → 戴尔因失察辞任并交出账册。&lt;/td&gt;&lt;td&gt;取得财务官席位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;辞任/议会交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家取代戴尔的一席；另外两席保留。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Treasurer&#183;三席之一&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁物流中心&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;51:00–56:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L36 接管物流中心&lt;/div&gt;&lt;/td&gt;&lt;td&gt;核对追回账本 → 本帮现场负责人交接仓库、车辆与排班表。&lt;/td&gt;&lt;td&gt;接管物资产线&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;物流中心始终属于本帮，玩家已先取得职位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;物流中心&#183;内部接管&lt;/span&gt;进入建设循环。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;56:00–60:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L37 建设物流中心&lt;/div&gt;&lt;/td&gt;&lt;td&gt;修复仓位、安排首条运输并收取第一批物资。&lt;/td&gt;&lt;td&gt;建立物资产出&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;建设/运输&lt;/span&gt;&lt;/td&gt;&lt;td&gt;原负责人转为现场协作。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：物资&#183;首次获得&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;物流中心 Lv.1&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;物资稳定产出开启&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;6&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;60:00–90:00&lt;/span&gt;&lt;b&gt;第五幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;叛徒残党、汉克回归与连续晋升&lt;/b&gt;&lt;span&gt;只用 SUP、推关、议会、城建处理本帮内部事件，不引入额外玩法系统。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP &#215;4、推关 &#215;6、议会 &#215;4、城建恢复 &#215;2。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;晋升 &#215;4&lt;/b&gt;&lt;span&gt;既有玩法复用&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Sergeant&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Senior&lt;/span&gt;&lt;span class=&quot;rc-tag rc-push&quot;&gt;推关战斗&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Vice President&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;President&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;60:00–64:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L38 武装队长切磋&lt;/div&gt;&lt;/td&gt;&lt;td&gt;议会复盘救援与产业恢复 → 使用钱、油、物资补给 → 友好枪战 SUP &#215;1。&lt;/td&gt;&lt;td&gt;证明战斗指挥能力&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;帮内切磋&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;职位交棒&lt;/span&gt;&lt;/td&gt;&lt;td&gt;现任者转任教官；玩家原 Treasurer 席位由 NPC 补位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Sergeant-at-arms&lt;/span&gt;开始管辖三名 Treasurer；沿用英雄养成。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;64:00–70:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L39 追回本帮物资&lt;/div&gt;&lt;/td&gt;&lt;td&gt;比利残党盗走物流中心物资 → 推关 &#215;3清理内部藏点 → SUP &#215;1护送物资返城 → 修复仓位。&lt;/td&gt;&lt;td&gt;守住本帮资产&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;复合行动&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;议会交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;完成行动后取代一名转任/退休的 Senior Members 席位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Senior Members&#183;三席之一&lt;/span&gt;物资回库；不新增系统。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;70:00–76:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L40 汉克回归&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 车队荣耀巡游&lt;/span&gt;&lt;/td&gt;&lt;td&gt;博邀请玩家迎接汉克出狱 → 标准车队阵型完成护送 SUP &#215;1 → 议会确认汉克接受新的职责分工。&lt;/td&gt;&lt;td&gt;调和旧成员关系&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;元老履职&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与另外两名 Senior Members 同级。&lt;/td&gt;&lt;td&gt;获得副会长挑战提名；复用 SUP 与议会。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;76:00–82:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L41 副会长传统挑战&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 竞速仪式 / 阵型前移&lt;/span&gt;&lt;/td&gt;&lt;td&gt;汉克与元老见证 → 改装/路线选择 → 竞速 SUP &#215;1 → 带队返程并在全队面前完成位置交接。&lt;/td&gt;&lt;td&gt;赢得副会长席位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;传统竞速&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;主动交棒&lt;/span&gt;&lt;/td&gt;&lt;td&gt;韦恩交棒；玩家原 Senior Members 席位由 NPC 补位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Vice President&lt;/span&gt;开始管辖三名 Senior Members；获得 Clubhouse 帮派管理权限。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;82:00–89:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L42 副会长履职&lt;/div&gt;&lt;/td&gt;&lt;td&gt;在 Clubhouse 召开议会 → 钱/油/物资补给 → 推关 &#215;3清理叛徒残余 → SUP &#215;1护送成员返城 → 修复建筑。&lt;/td&gt;&lt;td&gt;完成会长前履职&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;岗位代理&lt;/span&gt;&lt;/td&gt;&lt;td&gt;杰森仍任 President，玩家代理本次内部行动。&lt;/td&gt;&lt;td&gt;触发会长提名；不新增系统。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;89:30–90:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L43 会长和平交接&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 最终座次 / 木槌交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;杰森提名科尔；成员按职级落座并表决，木槌确认后交出会长背章与主持位置。&lt;/td&gt;&lt;td&gt;玩家取代杰森；原 Vice President 席位由 NPC 补位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;退位/提名/选举&lt;/span&gt;&lt;/td&gt;&lt;td&gt;副会长履职证明完整领袖能力。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;President&lt;/span&gt;统辖副会长线；获得 Clubhouse 帮派管理权限；一日版结束。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-section&quot;&gt;
      &lt;h2&gt;Part 3 &#183; 一日版本与正式版本分流&lt;/h2&gt;
      &lt;div class=&quot;dc-branch&quot;&gt;
        &lt;div&gt;&lt;h3&gt;正式版：官职链衔接大地图&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;60–64：枪战 SUP 切磋 → Sergeant-at-Arms。&lt;/li&gt;&lt;li&gt;64–70：追回本帮物资后进入大地图任务 → Senior Members。&lt;/li&gt;&lt;li&gt;70–76：迎接汉克回归并由议会选定地图目标。&lt;/li&gt;&lt;li&gt;76–82：竞速 SUP → Vice President，获得 Clubhouse 帮派管理权限。&lt;/li&gt;&lt;li&gt;82–89:30：以副会长身份完成一次大地图任务。&lt;/li&gt;&lt;li&gt;89:30–90：通过议会完成 President 交接。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h3&gt;一日版：同一官职链，重复既有玩法&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;60–64：枪战 SUP 完成武装队长切磋。&lt;/li&gt;&lt;li&gt;64–70：推关清理叛徒藏点，SUP 护送本帮物资返城。&lt;/li&gt;&lt;li&gt;70–76：迎接汉克回归，完成一次车队护送 SUP。&lt;/li&gt;&lt;li&gt;76–82：竞速 SUP 完成副会长挑战。&lt;/li&gt;&lt;li&gt;82–89:30：推关清理叛徒残余、SUP 护送返城并恢复建筑。&lt;/li&gt;&lt;li&gt;89:30–90：通过议会完成 President 交接。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;dc-warning&quot;&gt;&lt;strong&gt;改编边界：&lt;/strong&gt;七月 Demo 台本后段未确认的玩法不进入本方案；对应剧情功能统一改为“叛徒残党盗运本帮物资 → 推关清理内部藏点 → SUP 护送返城 → 城建修复”。所有城市建筑始终属于我方帮派。&lt;/div&gt;
    &lt;/section&gt;

      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm rank-unlock-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;层级&lt;/th&gt;&lt;th&gt;职级&lt;/th&gt;&lt;th&gt;席位结构&lt;/th&gt;&lt;th&gt;建筑 / 系统解锁&lt;/th&gt;&lt;th&gt;功能解锁&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;T1&lt;/td&gt;&lt;td&gt;Prospect / 见习&lt;/td&gt;&lt;td&gt;每个 T2 下属 3 席；开局为雨果、玩家、1 个空席&lt;/td&gt;&lt;td&gt;改装厂&#183;仅使用权&lt;/td&gt;&lt;td&gt;打工、改车、MG-A；无管理/城建权限&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T2&lt;/td&gt;&lt;td&gt;Full Patch / 正式成员&lt;/td&gt;&lt;td&gt;三席同级层；每席管理 3 名 T1&lt;/td&gt;&lt;td&gt;改装厂&#183;正式接管/城建&lt;/td&gt;&lt;td&gt;管理直属见习、议会、正式成员任务、Enforcer 考核&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T3&lt;/td&gt;&lt;td&gt;Enforcer / 打手&lt;/td&gt;&lt;td&gt;管理 3 名 T2&lt;/td&gt;&lt;td&gt;废车回收厂、零件&lt;/td&gt;&lt;td&gt;复仇任务、推关首次解锁&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T4&lt;/td&gt;&lt;td&gt;Roadman / 路线成员&lt;/td&gt;&lt;td&gt;三席同级层&lt;/td&gt;&lt;td&gt;商业街、钱&lt;/td&gt;&lt;td&gt;商业街内部交接、警长交易&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T5&lt;/td&gt;&lt;td&gt;Road Captain / 路线队长&lt;/td&gt;&lt;td&gt;管理 3 名 T4&lt;/td&gt;&lt;td&gt;加油站、油&lt;/td&gt;&lt;td&gt;路线调度、远程补给、下级英雄&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T6&lt;/td&gt;&lt;td&gt;Treasurer / 财务官&lt;/td&gt;&lt;td&gt;三席同级层&lt;/td&gt;&lt;td&gt;物流中心、物资&lt;/td&gt;&lt;td&gt;管理钱、油、物资的消耗与运输；不新增系统&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T7&lt;/td&gt;&lt;td&gt;Sergeant-at-arms / 武装队长&lt;/td&gt;&lt;td&gt;管理 3 名 T6&lt;/td&gt;&lt;td&gt;获得下级英雄&lt;/td&gt;&lt;td&gt;沿用英雄养成，继续游玩 SUP/推关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T8&lt;/td&gt;&lt;td&gt;Senior Members / 元老成员&lt;/td&gt;&lt;td&gt;三席同级层&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;议会选择任务，继续游玩 SUP/推关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T9&lt;/td&gt;&lt;td&gt;Vice President / 副会长&lt;/td&gt;&lt;td&gt;管理 3 名 T8&lt;/td&gt;&lt;td&gt;枪械/载具投放节点&lt;/td&gt;&lt;td&gt;Clubhouse 帮派管理，继续游玩 SUP/推关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T10&lt;/td&gt;&lt;td&gt;President / 会长&lt;/td&gt;&lt;td&gt;顶层单席&lt;/td&gt;&lt;td&gt;Clubhouse、建筑升级解除限制&lt;/td&gt;&lt;td&gt;统辖副会长线；一日版终点&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;gt-foot&quot;&gt;职级名称参考“帮派树”revision 3872，功能参考“帮派树详细”revision 888；席位与管辖结构按本轮确认规则重画。&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-section succession-part&quot; id=&quot;dc-promotion-scenes&quot; aria-labelledby=&quot;succession-title&quot;&gt;
      &lt;h3 id=&quot;succession-title&quot;&gt;全职位晋升的游戏内表现&lt;/h3&gt;
      &lt;p class=&quot;dc-note&quot;&gt;本 Part 描述玩家在游戏中实际看到和操作的完整场景：任务进入、玩法证明、角色反应、职位交接、界面反馈与新权限首次使用。职位交接只是场景中的一个环节，建筑接管仍放在后续独立循环。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;晋升目标&lt;/th&gt;&lt;th&gt;玩法 TAG&lt;/th&gt;&lt;th&gt;席位与原职位关系&lt;/th&gt;&lt;th&gt;玩法证明&lt;/th&gt;&lt;th&gt;游戏内表现&lt;/th&gt;&lt;th&gt;取代结果与立即解锁&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;T1 Prospect&lt;/td&gt;&lt;td&gt;开局身份&lt;/td&gt;&lt;td&gt;玩家原本就在瓦尔特所辖 T1 席位&lt;/td&gt;&lt;td&gt;完成三项见习转正任务&lt;/td&gt;&lt;td&gt;L04 拖回黑手党车辆后，帮派树首次弹出并确认转正任务进度 1 / 3；L05 展开完整教学并显示剩余两项任务。&lt;/td&gt;&lt;td&gt;保持 Prospect；获得改装厂使用权，无管理/城建权限&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T2 Full Patch&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平直接提升&lt;/span&gt;&lt;/td&gt;&lt;td&gt;特殊例外：玩家从瓦尔特所辖 T1 离开并填入 T2 空席，不要求原 Full Patch 离职&lt;/td&gt;&lt;td&gt;枪战 SUP 完成袭击目标车队任务，返程骑行中获得正式邀请&lt;/td&gt;&lt;td&gt;玩家首次进入议会，成员投票确认身份；帮派树显示玩家进入 T2 空席及其 3 名直属 T1，会议同时发布任务并授予改装厂管理授权。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;无职位交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;进入正式成员层；每个 T2 管理 3 名 T1；解锁改装厂现场接管与城建&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T3 Enforcer&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T2；原 Enforcer 转任&lt;/td&gt;&lt;td&gt;竞速后从追杀中生还，换新车并完成枪战复仇&lt;/td&gt;&lt;td&gt;玩家驾驶第二辆车完成复仇并带回负责人遗物；回帮会议中现任 Enforcer 转任，老大完成职位与废车场管理授权交接。&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;复仇证明&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会议交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代管理席；原 T2 席位补位；管辖三名 T2；解锁废车回收厂&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T4 Roadman&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;三席之一；现任 Roadman 转任&lt;/td&gt;&lt;td&gt;以 Enforcer 身份恢复废车场并通过推关追回商业街账册&lt;/td&gt;&lt;td&gt;玩家提交账册并完成内应清理；第三幕开场会议中现任 Roadman 转任，完成背章与商业街管理权限交接。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会议交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代一名 Roadman；另外两席仍为同级；解锁商业街正式接管&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T5 Road Captain&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T4；比利叛变失去席位&lt;/td&gt;&lt;td&gt;议会制裁 + SUP 追击&lt;/td&gt;&lt;td&gt;庆功后的议会公布比利罪证；玩家追上逃亡的比利，完成处决/掩护并取回背章，返程后被正式任命。&lt;span class=&quot;dc-transfer dc-transfer-lethal&quot;&gt;叛徒制裁&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;议会任命&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代比利；原 T4 席位补位；管辖三名 T4；解锁加油站&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T6 Treasurer&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;三席之一；戴尔持有其中一席&lt;/td&gt;&lt;td&gt;梅丽尔救援 + 追回物流账本&lt;/td&gt;&lt;td&gt;玩家交出救援中追回的账本；戴尔因失察辞任并递交财务账册，物流中心权限点亮。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;失察辞任/账册交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代戴尔的一席；另外两席仍是同级；解锁物流中心&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T7 Sergeant-at-arms&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T6；现任者转任教官&lt;/td&gt;&lt;td&gt;钱/油/物资补给 + 友好枪战 SUP&lt;/td&gt;&lt;td&gt;玩家完成补给和友好枪战；议会复盘时现任者转任教官并交出指挥权。&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;帮内切磋&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;指挥权交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代管理席；原 T6 席位补位；管辖三名 T6；获得下级英雄并沿用英雄养成&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T8 Senior Members&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-push&quot;&gt;推关战斗&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;三席之一；原席位者转任/退休&lt;/td&gt;&lt;td&gt;产业防卫&lt;/td&gt;&lt;td&gt;玩家通过推关和 SUP 完成产业防卫；原元老在议会复盘后让出席位。&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;复合行动&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会议交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代一席；另外两席仍是同级&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T9 Vice President&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T8；韦恩为现任者&lt;/td&gt;&lt;td&gt;传统竞速挑战&lt;/td&gt;&lt;td&gt;玩家选择改装与路线后和韦恩竞速；胜利并带队返程，韦恩当众主动交棒。&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;竞速&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;主动交棒&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代韦恩；原 T8 席位补位；管辖三名 T8；获得 Clubhouse 帮派管理权限&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T10 President&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;顶层单席；杰森为现任者&lt;/td&gt;&lt;td&gt;以副会长身份完成既有玩法循环&lt;/td&gt;&lt;td&gt;全体议会中杰森提名玩家；成员完成表决，杰森交出会长席位与 Clubhouse 权限。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;提名/选举/交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代杰森；原 T9 席位补位；统辖副会长线；一日版结束&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;org-rule-grid&quot;&gt;
        &lt;div&gt;&lt;b&gt;和平交接&lt;/b&gt;&lt;span&gt;晋升、转任、退休或主动让位，仍需明确转移席位和权限。&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;SUP / 切磋&lt;/b&gt;&lt;span&gt;竞速、追击、护送或枪战胜利提供取代资格。&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;推关 / 叛徒&lt;/b&gt;&lt;span&gt;代理带队、救援、组织防卫或清理内部叛徒。&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;会议确认&lt;/b&gt;&lt;span&gt;只承担最终任命与权限转移，纯演出控制在 10–30 秒。&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;div class=&quot;dc-source&quot;&gt;依据《一日渐进线汇总一图流》revision 67 中首个有效“基础信息”画板、《七月 Demo 台本》revision 4963、《DOBE世界观方案－摩托帮》revision 3872 与《帮派树详细》revision 888 调整；文档内标注“草稿，废弃不用”的后续画板未纳入。演出时间仅统计不可操作的纯演出；系统教学、选择、改装、领取、骑行与结算均计入可玩时间。&lt;/div&gt;

  if (rankFunctionHeading) rankFunctionHeading.id = &#39;dc-rank-functions&#39;;

    { id:&#39;dc-journey-map&#39;, label:&#39;方案 B &#183; 全流程一图&#39;, level:3 },

&lt;script&gt;
(() =&gt; {
  const reportProgress = () =&gt; {
    const root = document.documentElement;
    const body = document.body;
    const height = Math.max(root.scrollHeight, body?.scrollHeight || 0);
    const maxScroll = Math.max(height - window.innerHeight, 1);
    const top = window.scrollY || root.scrollTop || body?.scrollTop || 0;
    window.parent.postMessage({ type:&#39;dobe-reading-progress&#39;, progress:Math.min(Math.max(top / maxScroll, 0), 1) }, &#39;*&#39;);
  };
  let pending = false;
  window.addEventListener(&#39;scroll&#39;, () =&gt; {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() =&gt; { pending = false; reportProgress(); });
  }, { passive:true });
  window.addEventListener(&#39;message&#39;, event =&gt; {
    if (event.data?.type !== &#39;dobe-apply-progress&#39;) return;
    const progress = Number(event.data.progress);
    if (!Number.isFinite(progress)) return;
    const height = Math.max(document.documentElement.scrollHeight, document.body?.scrollHeight || 0);
    window.scrollTo(0, Math.round(Math.max(height - window.innerHeight, 0) * Math.min(Math.max(progress, 0), 1)));
    requestAnimationFrame(reportProgress);
  });
  requestAnimationFrame(reportProgress);
})();
&lt;/script&gt;

"></iframe>
<script>
(() => {
  const child = document.querySelector('iframe');
  window.addEventListener('message', event => {
    if (event.source === child?.contentWindow && event.data?.type === 'dobe-reading-progress') {
      window.parent.postMessage(event.data, '*');
    } else if (event.source === window.parent && event.data?.type === 'dobe-apply-progress') {
      child?.contentWindow?.postMessage(event.data, '*');
    }
  });
})();
</script>
