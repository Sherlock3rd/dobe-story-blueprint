.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;div class=&quot;dc-wrap&quot; id=&quot;dc-overview&quot;&gt;
    &lt;div class=&quot;dc-kicker&quot;&gt;一日版本 &#183; 90 分钟渐进体验&lt;/div&gt;
    &lt;h1&gt;Dobe一日渐进规划&lt;/h1&gt;

    &lt;section class=&quot;dc-section dc-part&quot; id=&quot;dc-part-1&quot; aria-labelledby=&quot;dc-part-1-title&quot;&gt;
      &lt;h2 id=&quot;dc-part-1-title&quot;&gt;Part 1 &#183; 目前已确定的信息&lt;/h2&gt;
      &lt;p class=&quot;dc-note&quot;&gt;以下内容整理自《一日渐进线汇总一图流》的有效“基础信息”框；帮派树结构统一放到 Part 4。&lt;/p&gt;

      &lt;h3 id=&quot;dc-confirmed-docs&quot;&gt;关联文档&lt;/h3&gt;
      &lt;div class=&quot;dc-link-list&quot;&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/wiki/ZjSowGJvPiXaA5k3nokcHjHEnhe&quot;&gt;&lt;strong&gt;Dobe 记忆点梳理&lt;/strong&gt;&lt;span&gt;叙事与记忆点来源&lt;/span&gt;&lt;/a&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/wiki/OMqDwrtSaizj4lkssBHcH4R2nxd?sheet=JmzW2M&quot;&gt;&lt;strong&gt;DOBE世界观方案 - 摩托帮&lt;/strong&gt;&lt;span&gt;帮派世界观与职级命名来源&lt;/span&gt;&lt;/a&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/sheets/XDBMs2LLnhcjB1tTWZ5c570fnbd?sheet=d4nknv&quot;&gt;&lt;strong&gt;帮派树与章节体与会议&lt;/strong&gt;&lt;span&gt;章节节点与会议结构来源&lt;/span&gt;&lt;/a&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/wiki/Url8w5jzIi7egukzDsHcR4y1nRi?sheet=5b3ec5&amp;amp;table=tblXtHbB5XD5buPw&amp;amp;view=vewnVSvZqi&quot;&gt;&lt;strong&gt;七月 Demo 台本&lt;/strong&gt;&lt;span&gt;商业街开始后的剧情顺序与场景元素来源&lt;/span&gt;&lt;/a&gt;
      &lt;/div&gt;

      &lt;h3 id=&quot;dc-confirmed-framework&quot;&gt;内容与成长框架&lt;/h3&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-confirmed-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;范围&lt;/th&gt;&lt;th&gt;已确定内容&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;叙事&lt;/td&gt;&lt;td&gt;以“记忆点”组织叙事推进&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;车配件养成&lt;/td&gt;&lt;td&gt;等级、品质&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;枪械养成&lt;/td&gt;&lt;td&gt;等级；星级仍待确认&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;英雄养成&lt;/td&gt;&lt;td&gt;等级、技能；星级仍待确认&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;SUP&lt;/td&gt;&lt;td&gt;竞速、枪战关、碰撞型枪战异化关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;推关&lt;/td&gt;&lt;td&gt;独立战斗循环&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;城建&lt;/td&gt;&lt;td&gt;接管、碎片化升级、升级&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;任务系统&lt;/td&gt;&lt;td&gt;L04 结算见习转正任务并直接引导玩家参加转正会议；L05 通过会议确认转正并首次显示帮派树职级变化；L10 教学 N-1 收复、收复雨果并获得改装功能使用权；L11 首次出现章节任务，由会长向全体成员分派反击准备工作，此后玩法和建筑循环由章节任务串联&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;模拟经营&lt;/td&gt;&lt;td&gt;确定采用小人投放：L23 引导玩家派遣已收复的瓦尔特进入废车回收厂，使建筑自动运行；后续建筑、岗位与增益数值待定&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;待确认项&lt;/td&gt;&lt;td&gt;小游戏&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

      &lt;h3 id=&quot;dc-drop-overview&quot;&gt;投放总览&lt;/h3&gt;
      &lt;p class=&quot;dc-note&quot;&gt;“3 + 1 + 1”依次指剧情线、活动签到、首充三个渠道；仅记录当前已确认的投放数量，不补充未确认渠道。&lt;/p&gt;

    &lt;section class=&quot;dc-section dc-part&quot; id=&quot;dc-part-2&quot; aria-labelledby=&quot;dc-part-2-title&quot;&gt;
      &lt;h2 id=&quot;dc-part-2-title&quot;&gt;Part 2 &#183; 渐进规划&lt;/h2&gt;
      &lt;figure class=&quot;dc-journey-map dc-first30&quot; id=&quot;dc-journey-map&quot; aria-labelledby=&quot;dc-journey-map-title&quot;&gt;
        &lt;figcaption&gt;&lt;div&gt;&lt;b id=&quot;dc-journey-map-title&quot;&gt;方案 D &#183; 案件板&lt;/b&gt;&lt;span&gt;开局至追杀叛徒、救回梅丽尔并完成章节晋升&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;dc-journey-badge&quot;&gt;L01–L31&lt;/span&gt;&lt;/figcaption&gt;
        &lt;div class=&quot;dc-journey-image&quot; role=&quot;img&quot; aria-label=&quot;方案 D 从本地打工（叙事小改版）到 Roadman 晋升的案件板&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-density-scale&quot; aria-label=&quot;定制化内容密度递减&quot;&gt;&lt;b&gt;定制化内容密度&lt;/b&gt;&lt;span&gt;高 &#183; 专属追逃与伏击&lt;/span&gt;&lt;i&gt;→&lt;/i&gt;&lt;span&gt;中高 &#183; 修车、氮气与 1v1 教学&lt;/span&gt;&lt;i&gt;→&lt;/i&gt;&lt;span&gt;中 &#183; 改装厂遇袭、修复与伏击&lt;/span&gt;&lt;i&gt;→&lt;/i&gt;&lt;span&gt;低 &#183; 常规 SLG 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-first30-grid&quot;&gt;
          &lt;article&gt;&lt;span&gt;0:00–3:20&lt;/span&gt;&lt;h3&gt;接应预警与反伏击&lt;/h3&gt;&lt;p&gt;刚甩开警方便收到劫货预警，黑手党随即出现，连续演出直接切入战斗。&lt;/p&gt;&lt;b&gt;核心追求：完成见习转正任务&lt;/b&gt;&lt;/article&gt;
          &lt;article&gt;&lt;span&gt;3:20–8:10&lt;/span&gt;&lt;h3&gt;先转正，再用改车与竞速庆祝&lt;/h3&gt;&lt;p&gt;会议直接确认玩家成为 Full Patch；金发随后带玩家修好车辆、安装氮气，并用 1v1 SUP 庆祝转正，最后一起返程。&lt;/p&gt;&lt;b&gt;核心追求：获得正式身份并完成第一次庆祝仪式&lt;/b&gt;&lt;/article&gt;
          &lt;article&gt;&lt;span&gt;8:10–14:40&lt;/span&gt;&lt;h3&gt;接管改装厂、全员任务与收车强化&lt;/h3&gt;&lt;p&gt;玩家返程后先收复雨果并获得改装功能使用权；随后帮派建筑遭黑手党袭击爆炸，会长向每名成员分派任务。玩家通过首次收车小游戏取得多辆任务废车，再完成拆解并强化大家的车辆。&lt;/p&gt;&lt;b&gt;核心追求：为全帮反击完成车辆准备&lt;/b&gt;&lt;/article&gt;
          &lt;article&gt;&lt;span&gt;14:40–36:30&lt;/span&gt;&lt;h3&gt;联手伏击、双线试炼与叛徒追杀&lt;/h3&gt;&lt;p&gt;金发带回情报后与玩家共同伏击并安全返城；L19 会议同时完成 Enforcer 晋升和内奸调查发布。产业与调查双线在 L27 汇合，随后进入独立新章，救回梅丽尔并制裁科腾。&lt;/p&gt;&lt;b&gt;核心追求：查清内奸并完成制裁&lt;/b&gt;&lt;/article&gt;
        &lt;/div&gt;
        &lt;div class=&quot;dc-journey-outcome&quot;&gt;20:10 后开启并行试炼：产业线完成两名管理者收复、两座建筑任意顺序接管与废车厂自动化；调查线完成英雄收复、推关五关和挡风玻璃逼问。双线汇合晋升 Roadman 后，立即进入营救梅丽尔的新章节。&lt;/div&gt;
      &lt;/figure&gt;
      &lt;p class=&quot;dc-note&quot;&gt;先看整体因果与七幕承接关系，再逐幕查看分钟级循环。&lt;/p&gt;
      &lt;h3 id=&quot;dc-memory-structure-title&quot;&gt;帮派体验记忆结构&lt;/h3&gt;
      &lt;p class=&quot;dc-note&quot;&gt;&lt;strong&gt;核心幻想是归属感。&lt;/strong&gt;现有剧情结构不变，用四类场景表现增强每个关键节点。&lt;/p&gt;
      &lt;div class=&quot;dc-memory-grid&quot;&gt;
        &lt;div class=&quot;dc-memory-card&quot;&gt;&lt;b&gt;Routine &#183; 常态运作&lt;/b&gt;&lt;span&gt;先通过会议获得正式身份，再由金发带玩家完成修车、氮气安装与竞速庆祝；下一章才进入收复废车、拆解与强化的成长 SOP。&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-memory-card&quot;&gt;&lt;b&gt;Rituals &#183; 权力仪式&lt;/b&gt;&lt;span&gt;背章、座次、木槌、投票、车队阵型与晋升反馈。&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-memory-card&quot;&gt;&lt;b&gt;Violation &#183; 边界越界&lt;/b&gt;&lt;span&gt;产业遭袭、成员被杀、内部泄密，明确触碰帮派底线。&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-memory-card&quot;&gt;&lt;b&gt;Sanction &#183; 绝对制裁&lt;/b&gt;&lt;span&gt;由会长或议会授权的追击与处置，强调集体秩序。&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;h3 id=&quot;dc-story-causal-title&quot;&gt;整体剧情因果&lt;/h3&gt;
      &lt;div class=&quot;dc-causal&quot;&gt;
        &lt;div&gt;&lt;b&gt;警匪追逐&lt;/b&gt;&lt;br&gt;&lt;span&gt;玩家甩开警方 → 摩托帮前来接应 → 博预警黑手党将来劫货&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;黑手党伏击&lt;/b&gt;&lt;br&gt;&lt;span&gt;玩家与金发 NPC 枪战反击&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;会议转正&lt;/b&gt;&lt;br&gt;&lt;span&gt;拖回玩家车辆 → 直接参加会议 → 投票授章 → 帮派树显示晋升 Full Patch&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;改车与 1v1 庆祝&lt;/b&gt;&lt;br&gt;&lt;span&gt;金发带玩家修车 → 赠送并安装氮气 → 1v1 SUP 教学特技与氮气 → 一起返程&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;下一章接管与全员任务&lt;/b&gt;&lt;br&gt;&lt;span&gt;返程抵达改装厂 → 收复雨果并正式接管 → 本帮另一处建筑被炸 → 会长发布全员任务 → 玩家负责收车、拆车和强化大家的车辆&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;收车、全员强化与伏击返城&lt;/b&gt;&lt;br&gt;&lt;span&gt;地图点选收集多辆废车 → 前往废车场拆解 → 强化大家的车辆 → 与金发共同伏击成功 → 一起返城提交任务 → L19 会议晋升并提出内奸调查&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;精准刺杀与内奸调查&lt;/b&gt;&lt;br&gt;&lt;span&gt;废车厂刚自动运行就遭精准袭击；新英雄救场后陪玩家推关追线并逼问代号&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;庆功与叛徒&lt;/b&gt;&lt;br&gt;&lt;span&gt;科腾叛逃、救回梅丽尔&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;复玩与晋升&lt;/b&gt;&lt;br&gt;&lt;span&gt;证明能领导全帮&lt;/span&gt;&lt;/div&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;1&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;0:00–3:20&lt;/span&gt;&lt;b&gt;序幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;摩托帮接应与黑手党伏击&lt;/b&gt;&lt;span&gt;玩家刚甩开警方，摩托帮成员便前来接应；博说接到消息，黑手党准备来劫货，话音刚落敌人就出现。玩家与金发 NPC 枪战反击后把自己的受损车辆拖回修车厂，完成见习转正任务。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;警匪追逐 SUP &#215;1、枪战 SUP &#215;1、转正任务结算 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;3 循环 / 3m20s&lt;/b&gt;&lt;span&gt;SUP 各约 60s / 演出 10–30s&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;无&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-sup-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;0:00–1:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L01 警匪追逐&lt;/div&gt;&lt;span class=&quot;dc-first-badge dc-first-sup-badge&quot;&gt;新玩法解锁 &#183; SUP 首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;警匪追逐 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;无人机航拍公路，警方频道播报正在追击科尔；镜头下拉进入汽车视角。&lt;/td&gt;&lt;td&gt;摆脱警方&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;航拍+警方播报+镜头接管&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;0:20–1:20&lt;/time&gt; 警匪追逐 SUP &#215;1：闪避、择路、甩脱&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;SUP 正式解锁：单局约 60 秒；本关不主动撞击警车&lt;/span&gt;玩家暂时甩开警方，进入 L02 接应点。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;1:20–1:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L02 摩托帮接应&#183;黑手党劫货预警&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 兄弟接应 / 危险话音刚落&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;剧情接应 &#215;1 / 劫货预警 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家刚刚甩开警察，摩托帮成员便赶到公路接应点。博告诉玩家，他接到消息，黑手党准备来劫这批货；话音刚落，黑手党车辆就从道路两侧冲出，直接进入 L03。&lt;/td&gt;&lt;td&gt;确认接应并应对突发劫货&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;30s&lt;/strong&gt;&lt;br&gt;成员到场+博发出预警+敌车出现&lt;/td&gt;&lt;td&gt;接近摩托帮成员 / 听取博的预警 / 镜头转向来袭车辆。&lt;/td&gt;&lt;td&gt;警方已退场；黑手党劫货袭击立即发生，无缝切入 L03 枪战 SUP。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;1:50–3:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L03 黑手党伏击反击&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;表现约束 &#183; 假友军协作&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与金发 NPC 会合后，黑手党突然驾车袭击。金发 NPC 通过开局同屏、无线电和结尾演出与玩家共同反击；玩家独立完成 SUP 并击退来袭车辆，但玩家自己的车辆在交火中被打坏，无法继续驾驶。&lt;/td&gt;&lt;td&gt;在兄弟接应下击退伏击&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;黑手党突袭+玩家车辆受损+切入枪战&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;2:00–3:00&lt;/time&gt; 枪战 SUP &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;3:00–3:10&lt;/time&gt; 确认击败敌人并检查玩家车辆&lt;/span&gt;&lt;/td&gt;&lt;td&gt;黑手党伏击被击退；玩家车辆受损，需要拖回修车厂维修。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;3:10–3:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L04 拖回玩家车辆&#183;转正任务完成&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;收束演出 &#215;1 / 任务完成提示 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;帮派成员把玩家被打坏的车辆挂上拖车并拖回修车厂。任务结算恭喜玩家已经完成见习转正任务，并通知玩家直接前往 Clubhouse 参加转正会议；车辆维修安排在会后。&lt;/td&gt;&lt;td&gt;立即参加转正会议&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;玩家车辆上拖车+任务完成提示+会议目标&lt;/td&gt;&lt;td&gt;确认车辆被拖回修车厂 / 查看转正任务完成提示 / 跟随会议目标。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;见习转正任务完成&lt;/span&gt;下一目标：直接进入 L05 转正会议；帮派树尚未出现。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;2&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;3:20–8:10&lt;/span&gt;&lt;b&gt;第一幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;先转正，再改车竞速庆祝&lt;/b&gt;&lt;span&gt;玩家拖车返城后直接参加转正会议，投票与授章确认其成为 Full Patch，帮派树首次显示职级变化。会后金发小哥带玩家修好自己的车、赠送并安装氮气，再发起 1v1 竞速 SUP 庆祝转正；比赛结束后两人一起返程。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;议会 &#215;1、帮派树职级展示 &#215;1、维修/氮气安装 &#215;1、1v1 竞速 SUP &#215;1、返程骑行 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;4 循环 / 4m50s&lt;/b&gt;&lt;span&gt;SUP 约 60s&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Full Patch&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平直接提升&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-meeting-row dc-first-gang-tree-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;3:20–4:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L05 首次议会&#183;直接确认转正&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 座次 / 木槌 / 正式背章&lt;/span&gt;&lt;span class=&quot;dc-system-first-meeting&quot;&gt;新系统解锁 &#183; 议会首次出现&lt;/span&gt;&lt;span class=&quot;dc-system-first-gang-tree&quot;&gt;新系统解锁 &#183; 帮派树首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;议会 &#215;1 / 特殊晋升 &#215;1 / 帮派树职级展示 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;拖车返城后，玩家直接进入转正会议。成员按职级落座，会长以木槌确认投票并授予正式背章，明确告知玩家已经成为 Full Patch；帮派树首次出现，以演出方式展示玩家从 Prospect 上升至 Full Patch。&lt;/td&gt;&lt;td&gt;确认转正结果并获得正式成员身份&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;座次、木槌、投票与职级上升&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;3:20–4:10&lt;/time&gt; 议会教学 / 投票 / 正式成员身份确认&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;4:10–4:30&lt;/time&gt; 授予正式背章 / 帮派树首次展开&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;4:30–4:50&lt;/time&gt; 职级从 Prospect 上升至 Full Patch / 会后离场&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-meeting-callout&quot;&gt;议会系统正式解锁&lt;/span&gt;&lt;span class=&quot;dc-first-gang-tree-callout&quot;&gt;帮派树首次出现&lt;/span&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;职位：Full Patch&#183;和平直接提升&lt;/span&gt;进入 L06。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;4:50–5:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L06 会后改车&#183;安装氮气&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 &#183; 车辆养成首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;维修小游戏 &#215;1 / 氮气安装 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;转正会议结束后，金发小哥告诉玩家先去把自己的车修好，并把一套氮气加速装置送给玩家。玩家完成维修和氮气安装后，金发提议用一场 1v1 竞速庆祝转正。&lt;/td&gt;&lt;td&gt;修好车辆并为转正庆祝赛做好准备&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;金发赠送氮气 / 发出庆祝赛邀请&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;4:50–5:20&lt;/time&gt; 维修小游戏 &#215;1 / 修好玩家车辆&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;5:20–5:40&lt;/time&gt; 金发赠送氮气 / 玩家完成安装&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;5:40–5:50&lt;/time&gt; 接受 1v1 庆祝赛邀请&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;车辆养成正式解锁&lt;/span&gt;自己的车恢复可用并获得氮气能力，进入 L07。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;5:50–7:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L07 转正庆祝&#183;与金发小哥 1v1&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 竞速仪式 / 兄弟认可&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;1v1 竞速 SUP &#215;1 / 特技教学 &#215;1 / 氮气教学 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与金发小哥进行 1v1 竞速 SUP，作为玩家正式转正后的庆祝。本关集中教学特技动作与氮气使用：先完成基础特技，再在直线与超车节点主动使用氮气，最终赢下比赛。&lt;/td&gt;&lt;td&gt;掌握 SUP 特技与氮气，并完成转正庆祝&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;起跑仪式 / 赛后兄弟认可&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;5:50–6:00&lt;/time&gt; 起跑演出 / 金发祝贺玩家转正&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;6:00–7:00&lt;/time&gt; 1v1 竞速 SUP &#215;1 / 特技与氮气教学&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;7:00–7:20&lt;/time&gt; 赛后认可 / 约定一起返程&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：声望&#183;首次获得&lt;/span&gt;完成庆祝赛，进入 L08 返程。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;7:20–8:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L08 庆祝赛返程&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 阵型返程 / 正式成员归队&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;返程骑行 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与金发小哥按标准阵型返回城市。金发在路上夸奖玩家已经有正式成员的样子，并说回去之后还有新的帮派任务等着他。两人返回城市后收到前往改装厂办理交接的新任务。&lt;/td&gt;&lt;td&gt;带着新身份返回城市并承接建筑职责&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;标准阵型 / 城市入口 / 新任务提示&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;7:20–8:00&lt;/time&gt; 返程骑行 &#215;1 / 金发祝贺与新任务预告&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;8:00–8:10&lt;/time&gt; 返回城市 / 接取改装厂交接任务&lt;/span&gt;&lt;/td&gt;&lt;td&gt;转正庆祝段落结束；进入 L09 改装厂交接。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;3&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;8:10–21:10&lt;/span&gt;&lt;b&gt;第二幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;改装厂接管、全员任务与联手伏击&lt;/b&gt;&lt;span&gt;玩家与金发完成转正庆祝并返城，随后收复雨果并获得改装功能使用权。紧接着本帮建筑遭黑手党袭击爆炸，会长向每个人分派任务；玩家负责收集废车、完成拆解并强化大家的车辆。金发带回情报后，两人发动伏击并安全返城；L18 只提交任务，L19 同一场会议完成 Enforcer 晋升并提出内奸调查。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;帮派树收复 &#215;1、改装功能解锁 &#215;1、全员任务发布 &#215;1、收车小游戏 &#215;1、废车拆解 &#215;N、成员车辆强化 &#215;1、枪战 SUP &#215;1、任务结算 &#215;1、晋升兼内奸会议 &#215;1、双线任务开启 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;12 循环&lt;/b&gt;&lt;span&gt;L18 任务结算 / L19 晋升兼内奸会议 / L20 双线开启&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Enforcer&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p class=&quot;dc-note&quot;&gt;接管顺序：L09 到达改装厂准备交接，L10 教学 N-1 收复并正式接管；L11 才发生另一处本帮建筑爆炸。会长发布全员任务，玩家只承担其中的车辆准备链：收车 → 拆车 → 强化大家的车辆。废车数量先记为 N，等待数值确认。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;8:10–8:40&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L09 前往改装厂办理交接&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;返程收束 &#215;1 / 交接准备 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;承接 L08 返程，玩家与金发回到城市后按会长的新任务前往改装厂。雨果确认转正结果，带玩家查看工位、功能入口和建筑管理状态，准备完成正式交接。&lt;/td&gt;&lt;td&gt;把正式成员身份转化为建筑职责&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;到场 / 雨果说明交接&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;8:10–8:30&lt;/time&gt; 前往改装厂 / 查看功能入口&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;8:30–8:40&lt;/time&gt; 雨果确认交接条件&lt;/span&gt;&lt;/td&gt;&lt;td&gt;进入 L10，教学 N-1 收复并完成正式接管。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;8:40–9:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L10 收复雨果&#183;获得改装权限&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新规则教学 &#183; 晋升后收复 N-1 成员&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;进入帮派树 &#215;1 / 收复雨果 &#215;1 / 点击接管 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;系统打开帮派树，确认玩家已处于 T2 Full Patch，并说明只能收复前一层级成员。玩家点击雨果&#183;维尔的照片完成首次 N-1 收复，取得修车与改装功能使用权；正式地图接管留到 L22 与废车回收厂并行处理。&lt;/td&gt;&lt;td&gt;取得修车与改装功能使用权&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;雨果确认交接 / T2 → T1 收复规则&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;8:40–9:00&lt;/time&gt; 展开 T1 照片与奖励角标&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;9:00–9:20&lt;/time&gt; 点击收复雨果&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;9:20–9:50&lt;/time&gt; 确认改装功能权限&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;当前职位：Full Patch&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;改装厂（修车厂）&#183;功能使用权&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;N-1 收复规则完成教学；进入 L11&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;9:50–10:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L11 帮派建筑爆炸&#183;会长发布全员任务&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 &#183; 章节任务首次出现&lt;/span&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 精准袭击 / 全员动员&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;袭击演出 &#215;1 / 全员任务发布 &#215;1 / 玩家任务接取 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家刚完成改装厂接管，本帮另一处建筑突然爆炸，确认是黑手党袭击。会长赶到现场发布章节任务：每名成员都承担一项反击准备。玩家负责收集多辆废车，拆出可用零件与配件，强化大家的车辆。具体被炸建筑暂不绑定新功能，等待剧情确认。&lt;/td&gt;&lt;td&gt;完成全帮反击前的车辆准备&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20–30s&lt;/strong&gt;&lt;br&gt;建筑爆炸 / 会长到场 / 全员分工&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;9:50–10:20&lt;/time&gt; 爆炸与袭击结果演出&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;10:20–10:40&lt;/time&gt; 会长向成员逐项分派任务&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;10:40–10:50&lt;/time&gt; 接取“收车并强化全员车辆”任务&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;章节任务正式解锁&lt;/span&gt;进入 L12 收车小游戏。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;10:50–11:40&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L12 收车小游戏&#183;地图点选废车&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新小游戏 &#183; 收车首次出现&lt;/span&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-D 收车点选 &#215;1&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;打开任务地图 &#215;1 / 点选废车点位 &#215;N&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家打开本地任务地图，在多个废车点位上依次点击，完成车辆定位、派车回收和任务确认，获得一批待拆废车。这里是独立的收车小游戏，不代表大地图系统提前开放。&lt;/td&gt;&lt;td&gt;为全员车辆强化收集拆解来源&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;会长任务提示 / 地图展开&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;11:00–11:20&lt;/time&gt; 打开收车任务地图&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;11:20–11:40&lt;/time&gt; 点击多个废车点位 / 完成回收&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;收车小游戏正式解锁&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;任务废车 &#215;N（数量待定）&lt;/span&gt;进入 L13 废车场拆解。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;11:40–13:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L13 前往废车场&#183;批量拆车&lt;/div&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-C 拆解 / 分拣 &#215;N&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家前往废车回收站，连续拆解收车小游戏获得的任务废车，完成配件分拣与结算，取得强化帮派成员车辆所需的零件和配件。&lt;/td&gt;&lt;td&gt;把收回的废车转化为全员强化材料&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;任务废车批量入位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;11:50–12:50&lt;/time&gt; 连续拆车 &#215;N / 单次约 30s&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;12:50–13:10&lt;/time&gt; 配件分拣 / 零件与配件结算&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：零件&#183;首次获得&lt;/span&gt;获得成员车辆强化所需配件；进入 L14。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;13:10–14:40&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L14 强化大家的车辆&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;成员车辆强化 &#215;1 / 配件安装 &#215;N&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家返回改装厂，按照会长的分工把拆车所得零件与配件装到帮派成员的车辆上。完成整批车辆强化后，玩家提交自己的章节任务，等待金发带回袭击者情报。&lt;/td&gt;&lt;td&gt;把拆解产出转化为全帮反击战力&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;成员车辆排队入位 / 强化完成&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;13:20–14:20&lt;/time&gt; 为成员车辆安装配件 / 批量强化&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;14:20–14:40&lt;/time&gt; 提交玩家任务 / 等待全员任务汇总&lt;/span&gt;&lt;/td&gt;&lt;td&gt;大家的车辆完成伏击前强化，进入 L15。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;14:40–15:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L15 金发带回情报&#183;出发伏击&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 兄弟一起做任务&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;情报演出 &#215;1 / 任务追踪 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;金发小哥回到改装厂，说明已查到袭击者的行车路线和停靠点。玩家提交“强化大家的车辆”目标、更新章节任务，两人制定伏击路线并一起出发。&lt;/td&gt;&lt;td&gt;把全员准备转化为主动反击&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;情报摊开 / 伏击路线确认&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;15:00–15:15&lt;/time&gt; 完成全员车辆强化目标 / 更新章节任务&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;15:15–15:30&lt;/time&gt; 选择伏击目标 / 出发&lt;/span&gt;&lt;/td&gt;&lt;td&gt;锁定袭击者车队；进入 L16 枪战 SUP。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;15:30–16:40&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L16 伏击袭击者车队&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 兄弟协作 / 绝对制裁&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与金发小哥伏击黑手党车队。金发通过开局同屏、无线电和结尾演出协作；玩家完成枪战 SUP，成功击毁敌车并击杀主要袭击者。&lt;/td&gt;&lt;td&gt;完成对改装厂袭击者的复仇&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;伏击开场 / 敌人确认&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;15:40–16:40&lt;/time&gt; 枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;伏击成功，主要敌人被击杀；进入战后收束。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;16:40–18:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L17 清理现场&#183;与金发一起返城&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 兄弟并肩 / 带回战果&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;战后清理 &#215;1 / 车队返城 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;伏击结束后，玩家与金发小哥确认主要袭击者已经被击杀，搜集能够证明黑手党行动路线的现场记录，并与帮派成员一起带着战果返回城市。&lt;/td&gt;&lt;td&gt;确认复仇结果并把行动证据带回帮派&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;确认战果 / 兄弟碰拳 / 车队集结&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;16:40–17:10&lt;/time&gt; 清理现场 / 收集行动记录&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;17:10–18:10&lt;/time&gt; 与金发及帮派车队一起返城&lt;/span&gt;&lt;/td&gt;&lt;td&gt;金发小哥存活并继续参与帮派行动；进入 L18 提交全员任务。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;18:10–19:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L18 提交全员任务&#183;晋升入口点亮&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;任务完成 &#215;1 / 声望结算 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家回城后提交自己负责的收车、拆车、全员强化与伏击任务，领取声望结算。任务列表提示玩家已达到 Enforcer 晋升条件，并要求前往 L19 会议接受正式确认。&lt;/td&gt;&lt;td&gt;把完整行动结果转化为晋升资格&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;任务完成提示 / 晋升入口点亮&lt;/td&gt;&lt;td&gt;点击完成章节任务 / 查看声望达标与会议目标。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;Enforcer 晋升条件满足&lt;/span&gt;进入 L19 会议。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;19:10–20:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L19 Enforcer 晋升&#183;提出内奸调查&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 木槌授章 / 内部危机&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;会议 &#215;1 / 晋升 &#215;1 / 章节任务发布 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;同一场会议中，会长先以木槌确认玩家完成全员任务、声望达标，晋升为 Enforcer 并开放 T2 Full Patch 收复任务；随后复盘连续几次精准袭击，指出帮派内部一定存在内奸，并把调查任务交给玩家。&lt;/td&gt;&lt;td&gt;承担更高职责并找出泄露行动位置的内奸&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;木槌授章 / 证据上桌 / 调查定调&lt;/td&gt;&lt;td&gt;确认 Enforcer 晋升 / 查看袭击共同点 / 接取内奸调查章节任务。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;职位：Enforcer&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;开放 T2 收复任务；内奸调查主线成立&lt;/span&gt;进入 L20。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;20:10–21:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L20 会后试炼&#183;开启两条并行线&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新结构 &#183; 双线可并行&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;帮派树查看 &#215;1 / 并行任务开启 &#215;2&lt;/span&gt;&lt;/td&gt;&lt;td&gt;会议结束后，会长单独告诉玩家：可以靠自己的能力试着收复一些帮内小弟，看看玩家到底有多少能耐。系统引导玩家进入帮派树，开启两条可任意先后完成的任务线：产业管理线与内奸调查线。&lt;/td&gt;&lt;td&gt;用收复成员证明管理与调查能力&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;会长私下试炼 / 帮派树展开&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;20:10–20:40&lt;/time&gt; 查看帮派树与可收复目标&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;20:40–21:10&lt;/time&gt; 开启产业线和调查线&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;并行窗口：L21–L23 与 L24–L26 可任意顺序完成&lt;/span&gt;两线全部完成后才开放 L27。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;4&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;21:10–26:30&lt;/span&gt;&lt;b&gt;第三幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;双线试炼与 Roadman 晋升&lt;/b&gt;&lt;span&gt;玩家在帮派树中开启产业与调查两条并行线：产业线完成管理者收复、两座建筑接管与废车厂自动化；调查线完成英雄收复、五关追线与挡风玻璃逼问。两线在 L27 汇合，玩家晋升 Roadman，会议揭出科腾叛逃并绑走梅丽尔，本章到此结束。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;产业线：收复 &#215;2、接管 &#215;2、派遣 &#215;1；调查线：英雄收复 &#215;1、推关 &#215;5、特殊 SUP &#215;1；汇合会议 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;7 循环&lt;/b&gt;&lt;span&gt;L20 分叉 / L21–L26 并行 / L27 汇合&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Roadman&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;21:10–22:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L21 产业线&#183;收复两名管理者&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;管理者任务 &#215;2 / 收复确认 &#215;2&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家在帮派树中处理雨果&#183;维尔与瓦尔特&#183;维尔的管理者任务。已在前段完成的关系结果会直接记入本线，不重复演出；本节点统一确认两名管理者都已归入玩家名下，并获得修车厂与废车回收厂的地图接管权限。&lt;/td&gt;&lt;td&gt;补齐两座产业的管理人&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;收复任务 / 关系确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;完成两名管理者对应任务并确认收复状态。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;修车厂、废车回收厂&#183;地图接管权限&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;22:10–23:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L22 产业线&#183;任意顺序接管两座建筑&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;地图接管 &#215;2 / 顺序自由&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家打开本地城市地图，可先后以任意顺序前往修车厂和废车回收厂，分别点击接管。两次接管都属于本帮内部管理权移交，不出现敌对占领。&lt;/td&gt;&lt;td&gt;把成员关系转化为实际产业控制&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;地图点选 / 内部接管&lt;/span&gt;&lt;/td&gt;&lt;td&gt;修车厂接管 &#215;1、废车回收厂接管 &#215;1；先后顺序不限制。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;两座建筑进入玩家管理列表&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;23:30–24:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L23 产业线&#183;废车厂自动化&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;管理者派遣 &#215;1 / 自动运行确认 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家将瓦尔特派遣到废车回收厂工作，确认拆解岗位进入自动运行；雨果继续作为修车厂管理者。产业管理线完成。&lt;/td&gt;&lt;td&gt;让已接管产业开始自动工作&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;派遣 / 自动化&lt;/span&gt;&lt;/td&gt;&lt;td&gt;派遣瓦尔特到废车回收厂并确认自动运行。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;废车回收厂自动化运行&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;产业线完成&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;21:10–21:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L24 调查线&#183;收复英雄 NPC&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;英雄收复任务 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家在帮派树中选择会长推荐的英雄 NPC，完成其收复任务。英雄表示愿意协助调查内奸，并把黑手党外围联络点作为第一批追查目标。&lt;/td&gt;&lt;td&gt;获得调查行动的战斗搭档&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;英雄收复任务&lt;/span&gt;&lt;/td&gt;&lt;td&gt;完成英雄个人任务并确认加入。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-hero&quot;&gt;英雄 NPC 加入调查线&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-system-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;21:50–24:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L25 调查线&#183;首次推关寻找线索&lt;/div&gt;&lt;span class=&quot;dc-system-first&quot;&gt;新系统解锁 &#183; 推关首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;推关 &#215;5&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与英雄沿黑手党联络链连续推进五关，清理外围据点、拼合通信记录与行车路线，最终锁定负责传递玩家位置的接头人。&lt;/td&gt;&lt;td&gt;找到能指向内奸的具体接头人&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;五关追线&lt;/span&gt;&lt;/td&gt;&lt;td&gt;推关 &#215;5：清理据点 → 收集线索 → 锁定接头人。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;推关系统正式解锁&lt;/span&gt;开启特殊逼问行动。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;24:00–25:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L26 调查线&#183;挡风玻璃逼问&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 挡风玻璃逼问&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;定制逼问 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家截获接头人，英雄把俘虏固定在肌肉车挡风玻璃上。玩家完成定制 SUP，在高速逃亡中施压逼问；对方交代内奸代号，但不知道真实姓名。调查线完成。&lt;/td&gt;&lt;td&gt;把线索转化为可核验的内奸代号&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;特殊 SUP / 挡风玻璃逼问&lt;/span&gt;&lt;/td&gt;&lt;td&gt;逼问 SUP &#215;1（约 60s）。&lt;/td&gt;&lt;td&gt;获得内奸代号；&lt;span class=&quot;dc-reward-note&quot;&gt;调查线完成&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;25:00–26:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L27 双线汇合&#183;晋升与紧急会议&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;双线结算 &#215;1 / 点击晋升 &#215;1 / 会议 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;产业线与调查线全部完成后，章节任务结算，玩家凭累积声望点击晋升 Roadman。紧急会议随即召开：帮派查明接头人口中的代号对应商业街现任管理者科腾&#183;万斯，但科腾已先一步逃走，还绑走了梅丽尔。&lt;/td&gt;&lt;td&gt;把两线成果转化为晋升，并立即处理叛逃危机&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;点击晋升 / 会议确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;产业管理线与内奸调查线均完成，声望达到 Roadman 门槛。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Roadman&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;新章节：追捕科腾、营救梅丽尔&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act dc-act-chase&quot; data-series=&quot;5&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;26:30–36:30&lt;/span&gt;&lt;b&gt;第四幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;新章：追杀叛徒科腾，救回梅丽尔&lt;/b&gt;&lt;span&gt;本章不插入产业经营。玩家先沿科腾的撤离路线突入关押点救出梅丽尔，再根据她提供的去向追上叛徒车队，完成对科腾的制裁；返城后用一场会议结算救援与追杀结果，并晋升 Road Captain。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;救援推关 &#215;5、救援结算 &#215;1、追杀 SUP &#215;1、章节结算会议 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;4 循环&lt;/b&gt;&lt;span&gt;追踪 → 救人 → 追杀 → 制裁与晋升&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Road Captain&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;游戏内表现&lt;/th&gt;&lt;th&gt;完成条件&lt;/th&gt;&lt;th&gt;奖励 / 接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;26:30–29:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L28 新章&#183;推关营救梅丽尔&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 兄弟不会被丢下&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;推关 &#215;5&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家和英雄沿科腾留下的路线推进五关，从商业街外围据点一路打进关押地点，逐步确认梅丽尔仍然活着。&lt;/td&gt;&lt;td&gt;在科腾转移人质前救出梅丽尔&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;连续救援推关&lt;/span&gt;&lt;/td&gt;&lt;td&gt;推关 &#215;5：追踪 → 突入 → 清场 → 定位人质。&lt;/td&gt;&lt;td&gt;锁定梅丽尔所在房间并进入救援结算。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;29:30–30:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L29 救出梅丽尔&#183;取得科腾去向&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;救援结算 &#215;1 / 英雄获得 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家救出梅丽尔。她确认科腾就是商业街内奸，并指出科腾刚刚带着账册沿旧货运公路撤离；玩家不回城，直接组织追杀。&lt;/td&gt;&lt;td&gt;救回成员并抓住追上叛徒的最后窗口&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;救援结算 / 英雄加入&lt;/span&gt;&lt;/td&gt;&lt;td&gt;护送梅丽尔脱离关押点并取得科腾撤离路线。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-hero&quot;&gt;英雄：梅丽尔&lt;/span&gt;锁定科腾车队，进入 L30。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;30:30–33:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L30 追杀科腾&#183;执行叛徒制裁&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 叛徒追击 / 集体制裁&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;追杀枪战 SUP &#215;1 / 处决演出 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家根据梅丽尔提供的路线追上科腾车队，在枪战 SUP 中逐辆击毁护卫车并逼停目标。结尾由玩家当面确认科腾身份、执行叛徒制裁，夺回商业街账册和管理钥匙。&lt;/td&gt;&lt;td&gt;阻止内奸再次逃脱并为绑架与泄密付出代价&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;追杀枪战 SUP / 叛徒处决&lt;/span&gt;&lt;/td&gt;&lt;td&gt;击毁护卫车、逼停目标并完成科腾制裁。&lt;/td&gt;&lt;td&gt;科腾线正式结束；取回商业街账册与管理钥匙。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;33:30–36:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L31 章节结算&#183;晋升 Road Captain&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 木槌结案 / 路线授章&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;返城会议 &#215;1 / 点击晋升 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家带梅丽尔、科腾的账册与管理钥匙返城。会议确认梅丽尔安全、内奸已被制裁，玩家凭声望晋升 Road Captain；会长授权下一章紧急接管科腾留下的商业街。&lt;/td&gt;&lt;td&gt;让救援与追杀形成明确结案，并获得下一阶段职责&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会议结案 / 晋升授章&lt;/span&gt;&lt;/td&gt;&lt;td&gt;梅丽尔获救、科腾被制裁、账册与钥匙取回。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Road Captain&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;本章结束；下一章开放商业街紧急接管&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;6&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;36:30–54:50&lt;/span&gt;&lt;b&gt;第五幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;商业街、加油站与物流中心恢复&lt;/b&gt;&lt;span&gt;追杀科腾与救援梅丽尔已经结案，本幕才开始处理叛徒留下的产业空缺：先接管并恢复商业街，再取得加油站，最后晋升 Treasurer 并接入物流中心。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;内部接管 &#215;3、城建/经营 &#215;3、议会晋升 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;7 循环&lt;/b&gt;&lt;span&gt;产业恢复从新章结案后开始&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Treasurer&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;游戏内表现&lt;/th&gt;&lt;th&gt;完成条件&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;36:30–38:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L32 紧急接管商业街&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家持科腾留下的管理钥匙进入商业街，由本帮现场人员确认 Road Captain 授权，完成内部管理权交接。&lt;/td&gt;&lt;td&gt;填补叛徒留下的产业管理空缺&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接 / 点击接管&lt;/span&gt;&lt;/td&gt;&lt;td&gt;已完成 L31 章节结案并获得会长授权。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;商业街&#183;紧急接管&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;38:00–39:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L33 恢复商业街经营&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家恢复商铺运营、核对科腾留下的账目并完成首次收取。&lt;/td&gt;&lt;td&gt;恢复钱产出并稳定商业街&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;经营恢复 / 首次收取&lt;/span&gt;&lt;/td&gt;&lt;td&gt;商业街已完成内部接管。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;商业街 Lv.1&lt;/span&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：钱&#183;首次获得&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;39:30–42:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L34 收复斯宾塞&#183;接管加油站&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家完成 T4 斯宾塞&#183;曼森的收复任务，取得其加油站与油功能；随后由本帮现场负责人交出路线图与管理钥匙。&lt;/td&gt;&lt;td&gt;取得油产业&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;N-1 收复 / 内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家已达到 T5 Road Captain，可收复 T4 Roadman。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;加油站&#183;功能解锁与内部接管&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;42:30–45:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L35 建设加油站&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家修复泵机、安排补给路线并收取首批油。&lt;/td&gt;&lt;td&gt;恢复油产出&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;建设 / 收取&lt;/span&gt;&lt;/td&gt;&lt;td&gt;加油站已完成内部接管。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;加油站 Lv.1&lt;/span&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：油&#183;首次获得&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;45:30–47:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L36 财务官晋升&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家在议会提交商业街与加油站恢复结果，凭累积声望晋升 Treasurer；帮派树开放 T5 Road Captain 收复任务。&lt;/td&gt;&lt;td&gt;承担跨产业财务与调度职责&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;产业复盘 / 晋升确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;钱与油两条产业恢复完成，声望达到 Treasurer 门槛。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Treasurer&#183;三席之一&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;开放 T5 Road Captain 收复任务&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;47:30–51:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L37 收复物流负责人&#183;接管物流中心&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家完成 T5 物流负责人的收复任务，取得物流中心与物资功能；本帮现场负责人交接仓库、车辆与排班表。&lt;/td&gt;&lt;td&gt;接管物资产线&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;N-1 收复 / 内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家已达到 T6 Treasurer，可收复 T5 Road Captain。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;物流中心&#183;功能解锁与内部接管&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;51:30–54:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L38 建设物流中心&lt;/div&gt;&lt;/td&gt;&lt;td&gt;修复仓位、安排首条运输并收取第一批物资。&lt;/td&gt;&lt;td&gt;建立物资产出&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;建设 / 运输&lt;/span&gt;&lt;/td&gt;&lt;td&gt;物流中心已完成内部接管。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：物资&#183;首次获得&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;物流中心 Lv.1&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;6&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;54:50–90:00&lt;/span&gt;&lt;b&gt;第五幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;叛徒残党、汉克回归与连续晋升&lt;/b&gt;&lt;span&gt;只用 SUP、推关、议会、城建处理本帮内部事件，不引入额外玩法系统；84:50 完成会长交接后预留 5 分 10 秒用于既有玩法复玩与结算缓冲。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP &#215;4、推关 &#215;6、议会 &#215;4、城建恢复 &#215;2。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;晋升 &#215;4&lt;/b&gt;&lt;span&gt;84:50–90:00 既有玩法复玩 / 结算缓冲&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Sergeant&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Senior&lt;/span&gt;&lt;span class=&quot;rc-tag rc-push&quot;&gt;推关战斗&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Vice President&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;President&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;54:50–58:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L38 武装队长切磋&lt;/div&gt;&lt;/td&gt;&lt;td&gt;议会复盘救援与产业恢复 → 使用钱、油、物资补给 → 友好枪战 SUP &#215;1。&lt;/td&gt;&lt;td&gt;证明战斗指挥能力&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;帮内切磋&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;晋升事件&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家凭声望晋升为 Sergeant-at-arms；现任角色保留并开放收复任务。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Sergeant-at-arms&lt;/span&gt;开始管辖三名 Treasurer；沿用英雄养成。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;58:50–64:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L39 追回本帮物资&lt;/div&gt;&lt;/td&gt;&lt;td&gt;科腾同党盗走物流中心物资 → 推关 &#215;3清理内部藏点 → SUP &#215;1护送物资返城 → 修复仓位。&lt;/td&gt;&lt;td&gt;守住本帮资产&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;复合行动&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;议会交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;完成行动并累积足够声望后，玩家晋升为 Senior Members；原元老保留。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Senior Members&#183;三席之一&lt;/span&gt;物资回库；不新增系统。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;64:50–70:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L40 汉克回归&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 车队荣耀巡游&lt;/span&gt;&lt;/td&gt;&lt;td&gt;博邀请玩家迎接汉克出狱 → 标准车队阵型完成护送 SUP &#215;1 → 议会确认汉克接受新的职责分工。&lt;/td&gt;&lt;td&gt;调和旧成员关系&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;元老履职&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与另外两名 Senior Members 同级。&lt;/td&gt;&lt;td&gt;获得副会长挑战提名；复用 SUP 与议会。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;70:50–76:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L41 副会长传统挑战&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 竞速仪式 / 阵型前移&lt;/span&gt;&lt;/td&gt;&lt;td&gt;汉克与元老见证 → 改装/路线选择 → 竞速 SUP &#215;1 → 带队返程并在全队面前完成晋升仪式。&lt;/td&gt;&lt;td&gt;晋升为副会长&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;传统竞速&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;竞速晋升事件&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家凭声望晋升为 Vice President；韦恩保留并开放收复任务。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Vice President&lt;/span&gt;开始管辖三名 Senior Members；获得 Clubhouse 帮派管理权限。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;76:50–84:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L42 副会长履职&lt;/div&gt;&lt;/td&gt;&lt;td&gt;在 Clubhouse 召开议会 → 钱/油/物资补给 → 推关 &#215;3清理叛徒残余 → SUP &#215;1护送成员返城 → 修复建筑。&lt;/td&gt;&lt;td&gt;完成会长前履职&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;岗位代理&lt;/span&gt;&lt;/td&gt;&lt;td&gt;杰森仍任 President，玩家代理本次内部行动。&lt;/td&gt;&lt;td&gt;触发会长提名；不新增系统。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;84:20–84:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L43 会长晋升事件&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 最终声望 / 木槌授章&lt;/span&gt;&lt;/td&gt;&lt;td&gt;杰森提名科尔；成员按职级落座并表决，木槌确认后授予玩家会长背章与主持权限。&lt;/td&gt;&lt;td&gt;玩家凭声望晋升为 President；杰森保留并开放收复任务&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;提名/选举/晋升&lt;/span&gt;&lt;/td&gt;&lt;td&gt;副会长履职证明完整领袖能力。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;President&lt;/span&gt;统辖副会长线；获得 Clubhouse 帮派管理权限；一日版结束。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-section&quot;&gt;
      &lt;h2&gt;Part 3 &#183; 一日版本与正式版本分流&lt;/h2&gt;
      &lt;div class=&quot;dc-branch&quot;&gt;
        &lt;div&gt;&lt;h3&gt;正式版：官职链衔接大地图&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;60–64：枪战 SUP 切磋 → Sergeant-at-Arms。&lt;/li&gt;&lt;li&gt;64–70：追回本帮物资后进入大地图任务 → Senior Members。&lt;/li&gt;&lt;li&gt;70–76：迎接汉克回归并由议会选定地图目标。&lt;/li&gt;&lt;li&gt;76–82：竞速 SUP → Vice President，获得 Clubhouse 帮派管理权限。&lt;/li&gt;&lt;li&gt;82:00–89:30：以副会长身份完成一次大地图任务。&lt;/li&gt;&lt;li&gt;89:30–90:00：通过议会完成 President 交接。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h3&gt;一日版：同一官职链，重复既有玩法&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;54:50–58:50：枪战 SUP 完成武装队长切磋。&lt;/li&gt;&lt;li&gt;58:50–64:50：推关清理叛徒藏点，SUP 护送本帮物资返城。&lt;/li&gt;&lt;li&gt;64:50–70:50：迎接汉克回归，完成一次车队护送 SUP。&lt;/li&gt;&lt;li&gt;70:50–76:50：竞速 SUP 完成副会长挑战。&lt;/li&gt;&lt;li&gt;76:50–84:20：推关清理叛徒残余、SUP 护送返城并恢复建筑。&lt;/li&gt;&lt;li&gt;84:20–84:50：通过议会完成 President 交接。&lt;/li&gt;&lt;li&gt;84:50–90:00：既有玩法复玩与结算缓冲。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;dc-warning&quot;&gt;&lt;strong&gt;改编边界：&lt;/strong&gt;七月 Demo 台本后段未确认的玩法不进入本方案；对应剧情功能统一改为“叛徒残党盗运本帮物资 → 推关清理内部藏点 → SUP 护送返城 → 城建修复”。所有城市建筑始终属于我方帮派。&lt;/div&gt;
    &lt;/section&gt;

  &lt;h2 id=&quot;gang-tree-title&quot;&gt;Part 4 &#183; 帮派照片墙&lt;/h2&gt;
  &lt;p class=&quot;dc-note&quot;&gt;&lt;strong&gt;玩家靠声望纵向晋升，NPC 靠任务横向收复。&lt;/strong&gt;原职级和已有正式角色名字不变；每次晋升触发一个独立事件，只开放前一职级 NPC 的收复任务。未确定角色的席位保留空相框。&lt;/p&gt;
  &lt;div class=&quot;gw-rule&quot;&gt;&lt;div&gt;&lt;b&gt;晋升 = 纵向成长&lt;/b&gt;&lt;span&gt;累计声望达到门槛 → 点击晋升 → 播放该职级事件；原职位 NPC 全部保留。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;收复 = N-1 横向收集&lt;/b&gt;&lt;span&gt;玩家到达 Tn 后，只开放 T(n-1) 的 NPC 照片；逐个完成专属任务，将角色收入玩家阵营。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;奖励 = 角色投放&lt;/b&gt;&lt;span&gt;人物照片、任务特点与奖励角标绑定在同一张角色卡上；建筑功能随 N-1 角色取得。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;gw-loop&quot; aria-label=&quot;帮派照片墙核心循环&quot;&gt;&lt;div&gt;&lt;b&gt;1 &#183; 玩法赚声望&lt;/b&gt;&lt;span&gt;SUP、推关、任务、城建&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;2 &#183; 达到职级门槛&lt;/b&gt;&lt;span&gt;查看声望进度&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;3 &#183; 触发晋升事件&lt;/b&gt;&lt;span&gt;每职级一个事件&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;4 &#183; 解锁 N-1 照片&lt;/b&gt;&lt;span&gt;只出现前一职级 NPC&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;5 &#183; 完成收复任务&lt;/b&gt;&lt;span&gt;领取角色与投放奖励&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;gw-frame&quot;&gt;&lt;div class=&quot;gw-board&quot; aria-label=&quot;T1 到 T10 帮派照片墙&quot;&gt;
    &lt;div class=&quot;gw-plaque&quot;&gt;&lt;b&gt;DOBE MC &#183; MEMBER WALL&lt;/b&gt;&lt;span&gt;声望晋升 / 任务收复 / 角色投放&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;gw-legend&quot;&gt;&lt;span&gt;&lt;i class=&quot;gw-drop&quot;&gt;确定投放&lt;/i&gt;已有建筑与资源功能&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;gw-drop pending&quot;&gt;候选投放&lt;/i&gt;小人、英雄、车或枪&lt;/span&gt;&lt;span&gt;照片只展示人物；照片下保留任务特点与奖励角标&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;gw-tier&quot; data-tier=&quot;T10&quot;&gt;&lt;div class=&quot;gw-promotion&quot;&gt;&lt;strong&gt;T10 President（会长）&lt;/strong&gt;&lt;span class=&quot;gw-rep&quot;&gt;声望门槛：5,500（示意）&lt;/span&gt;&lt;span class=&quot;gw-event&quot;&gt;晋升事件：全体选举与会长授章&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gw-people&quot;&gt;&lt;article class=&quot;gw-person&quot; data-scene=&quot;council-promotion.webp&quot;&gt;&lt;div class=&quot;gw-drops&quot;&gt;&lt;i class=&quot;gw-drop&quot;&gt;Clubhouse&lt;/i&gt;&lt;i class=&quot;gw-drop&quot;&gt;建筑上限&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;gw-photo&quot; style=&quot;--gw-scene:url(&#39;assets/clue-scenes/council-promotion.webp&#39;)&quot;&gt;&lt;b class=&quot;gw-photo-code&quot;&gt;JM&lt;/b&gt;&lt;span class=&quot;gw-photo-label&quot;&gt;全体选举&lt;/span&gt;&lt;/div&gt;&lt;b class=&quot;gw-name&quot;&gt;杰森“拉斯蒂”蒙哥马利&lt;/b&gt;&lt;span class=&quot;gw-task&quot;&gt;任务：赢得全体选举，在木槌表决后接受会长授章。&lt;/span&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gw-tier&quot; data-tier=&quot;T9&quot;&gt;&lt;div class=&quot;gw-promotion&quot;&gt;&lt;strong&gt;T9 Vice President（副会长）&lt;/strong&gt;&lt;span class=&quot;gw-rep&quot;&gt;声望门槛：4,200（示意）&lt;/span&gt;&lt;span class=&quot;gw-event&quot;&gt;晋升事件：传统竞速与车队授位&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gw-people&quot;&gt;&lt;article class=&quot;gw-person&quot; data-scene=&quot;one-on-one-race.webp&quot;&gt;&lt;div class=&quot;gw-drops&quot;&gt;&lt;i class=&quot;gw-drop&quot;&gt;车&lt;/i&gt;&lt;i class=&quot;gw-drop&quot;&gt;枪&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;gw-photo&quot; style=&quot;--gw-scene:url(&#39;assets/clue-scenes/one-on-one-race.webp&#39;)&quot;&gt;&lt;b class=&quot;gw-photo-code&quot;&gt;WK&lt;/b&gt;&lt;span class=&quot;gw-photo-label&quot;&gt;传统竞速&lt;/span&gt;&lt;/div&gt;&lt;b class=&quot;gw-name&quot;&gt;韦恩&#183;“加斯”&#183;科瓦尔斯基&lt;/b&gt;&lt;span class=&quot;gw-task&quot;&gt;任务：完成副会长传统竞速，并带领车队按阵型返城。&lt;/span&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gw-tier&quot; data-tier=&quot;T8&quot;&gt;&lt;div class=&quot;gw-promotion&quot;&gt;&lt;strong&gt;T8 Senior Members（元老成员）&lt;/strong&gt;&lt;span class=&quot;gw-rep&quot;&gt;声望门槛：3,200（示意）&lt;/span&gt;&lt;span class=&quot;gw-event&quot;&gt;晋升事件：产业防卫复盘&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gw-people&quot;&gt;&lt;article class=&quot;gw-person&quot; data-scene=&quot;gang-convoy-formation.webp&quot;&gt;&lt;div class=&quot;gw-drops&quot;&gt;&lt;i class=&quot;gw-drop pending&quot;&gt;英雄候选&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;gw-photo&quot; style=&quot;--gw-scene:url(&#39;assets/clue-scenes/gang-convoy-formation.webp&#39;)&quot;&gt;&lt;b class=&quot;gw-photo-code&quot;&gt;HM&lt;/b&gt;&lt;span class=&quot;gw-photo-label&quot;&gt;产业防卫&lt;/span&gt;&lt;/div&gt;&lt;b class=&quot;gw-name&quot;&gt;汉克&#183;麦考密克&lt;/b&gt;&lt;span class=&quot;gw-task&quot;&gt;任务：守住帮派产业车队，并完成元老复盘与路线纠错。&lt;/span&gt;&lt;/article&gt;&lt;article class=&quot;gw-person gw-empty&quot; data-scene=&quot;member-bike-service.webp&quot;&gt;&lt;div class=&quot;gw-drops&quot;&gt;&lt;i class=&quot;gw-drop pending&quot;&gt;小人候选&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;gw-photo&quot; style=&quot;--gw-scene:url(&#39;assets/clue-scenes/member-bike-service.webp&#39;)&quot;&gt;&lt;b class=&quot;gw-photo-code&quot;&gt;S8-A&lt;/b&gt;&lt;span class=&quot;gw-photo-label&quot;&gt;车队整备&lt;/span&gt;&lt;/div&gt;&lt;b class=&quot;gw-name&quot;&gt;未命名角色&lt;/b&gt;&lt;span class=&quot;gw-task&quot;&gt;任务：在防卫行动前完成全车队整备。&lt;/span&gt;&lt;/article&gt;&lt;article class=&quot;gw-person gw-empty&quot; data-scene=&quot;tow-convoy.webp&quot;&gt;&lt;div class=&quot;gw-drops&quot;&gt;&lt;i class=&quot;gw-drop pending&quot;&gt;小人候选&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;gw-photo&quot; style=&quot;--gw-scene:url(&#39;assets/clue-scenes/tow-convoy.webp&#39;)&quot;&gt;&lt;b class=&quot;gw-photo-code&quot;&gt;S8-B&lt;/b&gt;&lt;span class=&quot;gw-photo-label&quot;&gt;伤员回收&lt;/span&gt;&lt;/div&gt;&lt;b class=&quot;gw-name&quot;&gt;填位人&lt;/b&gt;&lt;span class=&quot;gw-task&quot;&gt;任务：在产业防卫后拖回损毁车辆和伤员。&lt;/span&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;

  ].filter(item =&gt; document.getElementById(item.id));
  const tocNav = root.querySelector(&#39;#dobe-toc-nav&#39;);

    const rankShelf = doc.createElement('section'); rankShelf.className = 'dc-rank-shelf';
    Object.entries(rankLinks).forEach(([tier,clue]) => { const source = doc.querySelector('#dc-gang-tree .gw-tier[data-tier="' + tier + '"]'); if (!source) return; const card = doc.createElement('article'); card.className = 'dc-rank-card'; card.dataset.clue = clue; const title = text(source.querySelector('.gw-promotion strong')); const rep = text(source.querySelector('.gw-rep')); const event = text(source.querySelector('.gw-event')); const people = [...source.querySelectorAll('.gw-person')].map(person => { const file = person.dataset.scene || 'tow-convoy.webp'; const name = text(person.querySelector('.gw-name')); const reward = [...person.querySelectorAll('.gw-drop')].map(text).join(' · '); const portraitIndex = Number(person.dataset.portraitIndex || 0); const px = (portraitIndex % 4) * 100 / 3; const py = Math.floor(portraitIndex / 4) * 100 / 7; const emptyClass = person.classList.contains('gw-empty') ? ' is-empty' : ''; return '<div class="dc-rank-person' + (name === '玩家角色' ? ' is-player' : '') + emptyClass + '"><div class="dc-rank-photo" style="background-image:linear-gradient(to top,rgba(12,13,11,.82),transparent 65%),url(&quot;' + portraitSheet + '&quot;);background-size:400% 800%;background-position:' + px + '% ' + py + '%">' + (emptyClass ? '空相框' : text(person.querySelector('.gw-photo-label'))) + '</div><b class="dc-rank-name">' + name + '</b><span class="dc-rank-reward">' + reward + '</span></div>'; }).join(''); card.innerHTML = '<div class="dc-rank-head"><b>' + title + '</b><span>' + rep + '</span></div><div class="dc-rank-event">' + event + (clue ? ' · 对应 ' + clue : ' · 本段未解锁') + '</div><div class="dc-rank-members">' + people + '</div>'; rankShelf.appendChild(card); });
    grid.appendChild(rankShelf);

    const parallel = doc.createElement('section'); parallel.className = 'dc-parallel-board'; parallel.innerHTML = '<header><b>L20 分叉 · 两条任务线可并行</b><span>产业管理线与内奸调查线可任意先后；两线完成后结束本章</span></header><div class="dc-parallel-lane industry"><h4>线 1 · 产业管理</h4></div><div class="dc-parallel-lane investigation"><h4>线 2 · 内奸调查</h4></div><footer><b>下一章入口 · L27</b><span>双线结算 → 晋升 Roadman → 揭出科腾叛逃并绑走梅丽尔</span></footer>';
    const cardById = id => grid.querySelector('[data-clue-id="' + id + '"]'); ['L21','L22','L23'].forEach(id => parallel.querySelector('.industry').appendChild(cardById(id))); ['L24','L25','L26'].forEach(id => parallel.querySelector('.investigation').appendChild(cardById(id)));
    const chapterSpecs = [

      {key:'middle',start:9,end:18,transition:'L18 全员任务结算、晋升条件达成 → L19 晋升 Enforcer 并接取内奸调查'},

    chapterSpecs.forEach(spec => { const chapter = doc.createElement('section'); chapter.className = 'dc-case-chapter'; chapter.dataset.chapter = spec.key; const body = doc.createElement('div'); body.className = 'dc-chapter-body'; const phase = grid.querySelector('.dc-phase-bar.' + spec.key); chapter.append(phase,body); for(let n=spec.start;n<=spec.end;n+=1){ const id='L'+String(n).padStart(2,'0'); if(spec.key==='after' && n===21){body.appendChild(parallel); n=26; continue;} const card=cardById(id); if(card) body.appendChild(card); } storyAxis.appendChild(chapter); if(spec.transition){ const link=doc.createElement('div'); link.className='dc-chapter-transition'; link.innerHTML='<b>章节承接</b><span>'+spec.transition+'</span><i>↓</i>'; storyAxis.appendChild(link); } });
    const rankPanel = doc.createElement('aside'); rankPanel.className = 'dc-rank-panel'; rankPanel.append(rankPhase,rankShelf); const caseSplit = doc.createElement('div'); caseSplit.className = 'dc-case-split'; caseSplit.append(storyAxis,rankPanel); grid.appendChild(caseSplit);

      const height = grid.scrollHeight;
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
      const edgePairs = cards.slice(1).map((card,index) => [cards[index],card,'']).filter(([card,next]) => card.dataset.phase === next.dataset.phase && !['L24'].includes(next.dataset.clueId) && !['L23','L26'].includes(card.dataset.clueId));
      const byId = id => cards.find(card => card.dataset.clueId === id), l20 = byId('L20'), l24 = byId('L24'), l23 = byId('L23'), l26 = byId('L26'), l27 = byId('L27');
      if (l20 && l24) edgePairs.push([l20,l24,'plot']); if (l23 && l27) edgePairs.push([l23,l27,'chapter']); if (l26 && l27) edgePairs.push([l26,l27,'chapter']); [['L08','L09'],['L18','L19']].forEach(([from,to]) => { const a=byId(from),b=byId(to); if(a&&b) edgePairs.push([a,b,'chapter']); });
      const svgRect = svg.getBoundingClientRect();

    };

      panY = drag.panY + event.clientY - drag.y;
