.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;div class=&quot;dc-wrap&quot; id=&quot;dc-overview&quot;&gt;
    &lt;div class=&quot;dc-kicker&quot;&gt;一日版本 &#183; 90 分钟渐进体验&lt;/div&gt;
    &lt;h1&gt;Dobe一日渐进规划&lt;/h1&gt;

    &lt;section class=&quot;dc-section dc-part&quot; id=&quot;dc-part-1&quot; aria-labelledby=&quot;dc-part-1-title&quot;&gt;
      &lt;h2 id=&quot;dc-part-1-title&quot;&gt;Part 1 &#183; 目前已确定的信息&lt;/h2&gt;
      &lt;p class=&quot;dc-note&quot;&gt;以下内容整理自《一日渐进线汇总一图流》的有效“基础信息”框；帮派树结构统一放到 Part 4。&lt;/p&gt;

      &lt;h3 id=&quot;dc-confirmed-docs&quot;&gt;关联文档&lt;/h3&gt;
      &lt;div class=&quot;dc-link-list&quot;&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/wiki/ZjSowGJvPiXaA5k3nokcHjHEnhe&quot;&gt;&lt;strong&gt;Dobe 记忆点梳理&lt;/strong&gt;&lt;span&gt;叙事与记忆点来源&lt;/span&gt;&lt;/a&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/wiki/OMqDwrtSaizj4lkssBHcH4R2nxd?sheet=JmzW2M&quot;&gt;&lt;strong&gt;DOBE世界观方案 - 摩托帮&lt;/strong&gt;&lt;span&gt;帮派世界观与职级命名来源&lt;/span&gt;&lt;/a&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/sheets/XDBMs2LLnhcjB1tTWZ5c570fnbd?sheet=d4nknv&quot;&gt;&lt;strong&gt;帮派树与章节体与会议&lt;/strong&gt;&lt;span&gt;章节节点与会议结构来源&lt;/span&gt;&lt;/a&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/wiki/Url8w5jzIi7egukzDsHcR4y1nRi?sheet=5b3ec5&amp;amp;table=tblXtHbB5XD5buPw&amp;amp;view=vewnVSvZqi&quot;&gt;&lt;strong&gt;七月 Demo 台本&lt;/strong&gt;&lt;span&gt;商业街开始后的剧情顺序与场景元素来源&lt;/span&gt;&lt;/a&gt;
      &lt;/div&gt;

      &lt;h3 id=&quot;dc-confirmed-framework&quot;&gt;内容与成长框架&lt;/h3&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-confirmed-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;范围&lt;/th&gt;&lt;th&gt;已确定内容&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;叙事&lt;/td&gt;&lt;td&gt;以“记忆点”组织叙事推进&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;车配件养成&lt;/td&gt;&lt;td&gt;等级、品质&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;枪械养成&lt;/td&gt;&lt;td&gt;等级；星级仍待确认&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;英雄养成&lt;/td&gt;&lt;td&gt;等级、技能；星级仍待确认&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;SUP&lt;/td&gt;&lt;td&gt;竞速、枪战关、碰撞型枪战异化关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;推关&lt;/td&gt;&lt;td&gt;独立战斗循环&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;城建&lt;/td&gt;&lt;td&gt;接管、碎片化升级、升级&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;任务系统&lt;/td&gt;&lt;td&gt;L05 首次出现任务列表、帮派树升级与任务追踪；L09 完成转正任务并开放晋升入口；L11 首次出现章节任务，此后玩法和建筑循环由章节任务串联&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;模拟经营&lt;/td&gt;&lt;td&gt;确定采用小人投放：L22 引导玩家在帮派树接管 Full Patch 并派遣至废车回收厂，使建筑自动运行；后续建筑、岗位与增益数值待定&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;待确认项&lt;/td&gt;&lt;td&gt;小游戏&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

      &lt;h3 id=&quot;dc-drop-overview&quot;&gt;投放总览&lt;/h3&gt;
      &lt;p class=&quot;dc-note&quot;&gt;“3 + 1 + 1”依次指剧情线、活动签到、首充三个渠道；仅记录当前已确认的投放数量，不补充未确认渠道。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-confirmed-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;投放内容&lt;/th&gt;&lt;th&gt;剧情线&lt;/th&gt;&lt;th&gt;活动签到&lt;/th&gt;&lt;th&gt;首充&lt;/th&gt;&lt;th&gt;当前合计&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;英雄&lt;/td&gt;&lt;td&gt;3 个&lt;/td&gt;&lt;td&gt;1 个&lt;/td&gt;&lt;td&gt;1 个&lt;/td&gt;&lt;td&gt;5 个&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;车&lt;/td&gt;&lt;td&gt;3 辆&lt;/td&gt;&lt;td&gt;1 辆&lt;/td&gt;&lt;td&gt;1 辆&lt;/td&gt;&lt;td&gt;5 辆&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;枪&lt;/td&gt;&lt;td&gt;3 把&lt;/td&gt;&lt;td&gt;1 把&lt;/td&gt;&lt;td&gt;1 把&lt;/td&gt;&lt;td&gt;5 把&lt;/td&gt;&lt;/tr&gt;

    &lt;section class=&quot;dc-section dc-part&quot; id=&quot;dc-part-2&quot; aria-labelledby=&quot;dc-part-2-title&quot;&gt;
      &lt;h2 id=&quot;dc-part-2-title&quot;&gt;Part 2 &#183; 渐进规划&lt;/h2&gt;
      &lt;figure class=&quot;dc-journey-map dc-first30&quot; id=&quot;dc-journey-map&quot; aria-labelledby=&quot;dc-journey-map-title&quot;&gt;
        &lt;figcaption&gt;&lt;div&gt;&lt;b id=&quot;dc-journey-map-title&quot;&gt;方案 C &#183; 案件板&lt;/b&gt;&lt;span&gt;开局至首次推关结束与 Roadman 晋升&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;dc-journey-badge&quot;&gt;L01–L24&lt;/span&gt;&lt;/figcaption&gt;
        &lt;div class=&quot;dc-journey-image&quot; role=&quot;img&quot; aria-label=&quot;方案 C 从本地打工崽到 Roadman 晋升的案件板&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-density-scale&quot; aria-label=&quot;定制化内容密度递减&quot;&gt;&lt;b&gt;定制化内容密度&lt;/b&gt;&lt;span&gt;高 &#183; 专属追逃与伏击&lt;/span&gt;&lt;i&gt;→&lt;/i&gt;&lt;span&gt;中高 &#183; 收车拆解强化&lt;/span&gt;&lt;i&gt;→&lt;/i&gt;&lt;span&gt;中 &#183; 氮气备赛与废车场接管&lt;/span&gt;&lt;i&gt;→&lt;/i&gt;&lt;span&gt;低 &#183; 常规 SLG 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-first30-grid&quot;&gt;
          &lt;article&gt;&lt;span&gt;0:00–3:20&lt;/span&gt;&lt;h3&gt;分流警方与反伏击&lt;/h3&gt;&lt;p&gt;连续角色协作与战斗演出，定制密度最高。&lt;/p&gt;&lt;b&gt;核心追求：转正任务进度（1 / 3）&lt;/b&gt;&lt;/article&gt;
          &lt;article&gt;&lt;span&gt;3:20–11:50&lt;/span&gt;&lt;h3&gt;收车、拆解、强化与转正&lt;/h3&gt;&lt;p&gt;先建立“获得车 → 拆车 → 强化自己”的核心循环，再进入袭击考核。&lt;/p&gt;&lt;b&gt;核心追求：转正任务进度（3 / 3）&lt;/b&gt;&lt;/article&gt;
          &lt;article&gt;&lt;span&gt;11:50–17:20&lt;/span&gt;&lt;h3&gt;竞速目标、氮气备赛与追杀&lt;/h3&gt;&lt;p&gt;转正后立刻接受竞速目标，拆出氮气并强化自己的车，尽快进入竞速与追杀主线。&lt;/p&gt;&lt;b&gt;核心追求：车辆强度&lt;/b&gt;&lt;/article&gt;
          &lt;article&gt;&lt;span&gt;17:20–27:30&lt;/span&gt;&lt;h3&gt;复仇、废车场城建与首次推关&lt;/h3&gt;&lt;p&gt;复仇后接管废车场，24:20 开始首次推关，城建循环整体提前。&lt;/p&gt;&lt;b&gt;核心追求：推关进度&lt;/b&gt;&lt;/article&gt;
        &lt;/div&gt;
        &lt;div class=&quot;dc-journey-outcome&quot;&gt;24:20 后进入推关：竞速目标直接承接转正，玩家提前 2 分 30 秒进入废车场城建和标准战斗循环。&lt;/div&gt;
      &lt;/figure&gt;
      &lt;p class=&quot;dc-note&quot;&gt;先看整体因果与六幕承接关系，再逐幕查看分钟级循环。&lt;/p&gt;
      &lt;h3 id=&quot;dc-memory-structure-title&quot;&gt;帮派体验记忆结构&lt;/h3&gt;
      &lt;p class=&quot;dc-note&quot;&gt;&lt;strong&gt;核心幻想是归属感。&lt;/strong&gt;现有剧情结构不变，用四类场景表现增强每个关键节点。&lt;/p&gt;
      &lt;div class=&quot;dc-memory-grid&quot;&gt;
        &lt;div class=&quot;dc-memory-card&quot;&gt;&lt;b&gt;Routine &#183; 常态运作&lt;/b&gt;&lt;span&gt;收车、拆解、强化自己的车，形成稳定的成长 SOP。&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-memory-card&quot;&gt;&lt;b&gt;Rituals &#183; 权力仪式&lt;/b&gt;&lt;span&gt;背章、座次、木槌、投票、车队阵型与晋升反馈。&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-memory-card&quot;&gt;&lt;b&gt;Violation &#183; 边界越界&lt;/b&gt;&lt;span&gt;产业遭袭、成员被杀、内部泄密，明确触碰帮派底线。&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-memory-card&quot;&gt;&lt;b&gt;Sanction &#183; 绝对制裁&lt;/b&gt;&lt;span&gt;由会长或议会授权的追击与处置，强调集体秩序。&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;h3 id=&quot;dc-story-causal-title&quot;&gt;整体剧情因果&lt;/h3&gt;
      &lt;div class=&quot;dc-causal&quot;&gt;
        &lt;div&gt;&lt;b&gt;警匪追逐&lt;/b&gt;&lt;br&gt;&lt;span&gt;帮派成员分流警力&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;黑手党伏击&lt;/b&gt;&lt;br&gt;&lt;span&gt;玩家与金发 NPC 枪战反击&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;收车拆解强化&lt;/b&gt;&lt;br&gt;&lt;span&gt;获得车辆 → 废车场拆解 → 修车厂强化自己&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;加入与转正&lt;/b&gt;&lt;br&gt;&lt;span&gt;任务追踪 → 完成见习证明 → 点击晋升 → 议会确认&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;竞速目标&lt;/b&gt;&lt;br&gt;&lt;span&gt;转正后受邀竞速 → 拆出氮气 → 回厂安装 → 立即参赛&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;竞速、追杀与复仇&lt;/b&gt;&lt;br&gt;&lt;span&gt;废车厂管理人金发小哥牺牲，形成职位与产业空缺&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;精准刺杀与内奸调查&lt;/b&gt;&lt;br&gt;&lt;span&gt;废车厂刚自动运行就遭精准袭击；新英雄救场后陪玩家推关追线并逼问代号&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;庆功与叛徒&lt;/b&gt;&lt;br&gt;&lt;span&gt;追击比利、救回梅丽尔&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;复玩与晋升&lt;/b&gt;&lt;br&gt;&lt;span&gt;证明能领导全帮&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;h3 id=&quot;dc-act-relations-title&quot;&gt;六幕关系&lt;/h3&gt;
      &lt;div class=&quot;dc-overview&quot; aria-label=&quot;六幕时间分配与承接关系&quot;&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;0–3:20&lt;/span&gt;&lt;b&gt;序幕&lt;/b&gt;&lt;span&gt;追逐 / 警力分流 / 黑手党枪战 / 首次帮派树&lt;br&gt;4 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;3:20–11:50&lt;/span&gt;&lt;b&gt;第一幕&lt;/b&gt;&lt;span&gt;收车 / 拆车 / 强化 / 袭击 / 议会转正&lt;br&gt;6 循环&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;11:50–24:20&lt;/span&gt;&lt;b&gt;第二幕&lt;/b&gt;&lt;span&gt;竞速目标 / 拆氮气 / 安装 / 竞速 / 复仇 / 废车场城建&lt;br&gt;12 循环&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;24:20–42:30&lt;/span&gt;&lt;b&gt;第三幕&lt;/b&gt;&lt;span&gt;内奸调查 / 首次推关 / Roadman / 商业街 / 比利 / 加油站&lt;br&gt;8 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;42:30–57:30&lt;/span&gt;&lt;b&gt;第四幕&lt;/b&gt;&lt;span&gt;梅丽尔救援 / 物流中心&lt;br&gt;4 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;57:30–90&lt;/span&gt;&lt;b&gt;第五幕&lt;/b&gt;&lt;span&gt;叛徒残党 / 汉克回归 / 晋升会长 / 复玩缓冲&lt;br&gt;6 循环&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;1&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;0:00–3:20&lt;/span&gt;&lt;b&gt;序幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;警方分流与黑手党伏击&lt;/b&gt;&lt;span&gt;帮派成员引开警方；黑手党随后突袭并打坏玩家车辆，玩家与金发 NPC 枪战反击后把自己的受损车辆拖回修车厂，完成见习转正任务第 1 项。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;警匪追逐 SUP &#215;1、枪战 SUP &#215;1、帮派树进度提示 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;4 循环 / 3m20s&lt;/b&gt;&lt;span&gt;SUP 各约 60s / 演出 10–30s&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;无&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-sup-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;0:00–1:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L01 警匪追逐&lt;/div&gt;&lt;span class=&quot;dc-first-badge dc-first-sup-badge&quot;&gt;新玩法解锁 &#183; SUP 首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;警匪追逐 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;无人机航拍公路，警方频道播报正在追击科尔；镜头下拉进入汽车视角。&lt;/td&gt;&lt;td&gt;摆脱警方&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;航拍+警方播报+镜头接管&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;0:20–1:20&lt;/time&gt; 警匪追逐 SUP &#215;1：闪避、择路、甩脱&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;SUP 正式解锁：单局约 60 秒；本关不主动撞击警车&lt;/span&gt;普通车辆仍不足以突破追捕。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;1:20–1:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L02 摩托帮成员分流警方&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 兄弟完美接应 / 警方分流&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;剧情接应 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;博与摩托帮成员按预设分流阵型主动分头骑行，把追捕玩家的警车引向不同岔路；玩家成功脱离警方视线，与金发 NPC 在公路接应点会合。&lt;/td&gt;&lt;td&gt;借助帮派摆脱警方&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;30s&lt;/strong&gt;&lt;br&gt;成员出现+分流警车+会合&lt;/td&gt;&lt;td&gt;跟随指示变道 / 确认警方被引开。&lt;/td&gt;&lt;td&gt;警方暂时退场；统一背心与背章首次清晰展示；玩家准备继续当前见习任务。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;1:50–3:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L03 黑手党伏击反击&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;表现约束 &#183; 假友军协作&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与金发 NPC 会合后，黑手党突然驾车袭击。金发 NPC 通过开局同屏、无线电和结尾演出与玩家共同反击；玩家独立完成 SUP 并击退来袭车辆，但玩家自己的车辆在交火中被打坏，无法继续驾驶。&lt;/td&gt;&lt;td&gt;在兄弟接应下击退伏击&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;黑手党突袭+玩家车辆受损+切入枪战&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;2:00–3:00&lt;/time&gt; 枪战 SUP &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;3:00–3:10&lt;/time&gt; 确认击败敌人并检查玩家车辆&lt;/span&gt;&lt;/td&gt;&lt;td&gt;黑手党伏击被击退；玩家车辆受损，需要拖回修车厂维修。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-gang-tree-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;3:10–3:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L04 拖走玩家车辆与任务进度&lt;/div&gt;&lt;span class=&quot;dc-system-first-gang-tree&quot;&gt;新系统解锁 &#183; 帮派树首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;收束演出 &#215;1 / 进度提示 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;帮派成员把玩家被打坏的车辆挂上拖车，准备拖回修车厂。帮派树首次弹出，显示玩家当前为 Prospect，并确认本次反击已完成见习转正任务的第 1 项。&lt;/td&gt;&lt;td&gt;保住自己的车辆并确认转正进度&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;玩家车辆上拖车+任务进度卡&lt;/td&gt;&lt;td&gt;查看帮派树任务进度：1 / 3。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-gang-tree-callout&quot;&gt;帮派树首次出现：见习转正任务 1 / 3 已完成&lt;/span&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;当前职位：Prospect&lt;/span&gt;再完成 2 项任务即可参加正式转正。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;2&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;3:20–11:50&lt;/span&gt;&lt;b&gt;第一幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;收车、拆解、强化与枪战考核&lt;/b&gt;&lt;span&gt;玩家随车队回城后，金发 NPC 首次带玩家建立“通过帮派任务获得待处理车辆 → 去废车场拆解 → 把零件和配件带回修车厂强化自己”的循环；完成强化后才执行 L08 袭击任务，返程后由议会投票正式转正。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;帮派骑行 &#215;2、收车玩法 &#215;1、拆车 &#215;1、车辆养成 &#215;1、枪战 SUP &#215;1、议会 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;总时长 8m30s&lt;/b&gt;&lt;span&gt;SUP 约 60s&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Full Patch&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平直接提升&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;3:20–4:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L05 搭乘返城与见习任务说明&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 标准车队阵型 / 背章&lt;/span&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新玩法 &#183; 帮派骑行首次出现&lt;/span&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 &#183; 任务系统首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;骑行对话 &#215;1 / 任务系统教学 &#215;1 / 帮派树升级 &#215;1 / 任务追踪 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家搭乘金发 NPC 的车辆随车队返回城市；博说明见习转正规则。抵达后任务系统首次出现，任务列表展示当前进度和最终条件“达到可晋升等级”；玩家进入帮派树点击一次升级，提升成长等级但仍保持 Prospect，再返回任务列表点击追踪，由任务指引进入 L06。&lt;/td&gt;&lt;td&gt;理解转正目标并开始按任务行动&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;转正路径说明&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;3:20–3:50&lt;/time&gt; 搭乘车队 / 对话随骑行推进&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;3:50–4:10&lt;/time&gt; 拖车抵达修车厂&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;4:10–4:25&lt;/time&gt; 任务系统首次展开 / 查看晋升条件&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;4:25–4:40&lt;/time&gt; 帮派树点击升级 / 成长等级提升&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;4:40–4:50&lt;/time&gt; 返回任务列表 / 点击追踪 L06&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;任务系统正式解锁&lt;/span&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;当前职位：Prospect&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;当前任务：首次收车并完成废车拆解&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;4:50–6:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L06 首次收车与废车拆解&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;核心循环首次出现 &#183; 获得车辆 → 拆解&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;收车玩法 &#215;1 / 拆车 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;金发 NPC 首次带玩家完成一项帮派收车任务，取得一辆待处理车辆，并直接领玩家前往本帮废车场。玩家把车辆拆掉，获得零件资源和一个可安装配件，完成第二项见习证明。&lt;/td&gt;&lt;td&gt;获得强化自己所需的材料&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;金发 NPC 领路与首次说明&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;5:10–5:40&lt;/time&gt; 收车玩法 &#215;1 / 获得待处理车辆&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;5:40–6:00&lt;/time&gt; 前往废车场 / 说明拆解用途&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;6:00–6:30&lt;/time&gt; 拆车 &#215;1 / 结算零件与配件&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：零件&#183;首次获得&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;获得一个可安装配件；见习转正进度更新为 2 / 3&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;6:30–8:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L07 返回修车厂强化自己&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 &#183; 车辆养成首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;零件强化 &#215;1 / 配件安装 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家把拆车所得带回修车厂，首次进入真实车辆养成界面：消耗零件强化自己的车，并安装刚获得的配件。强化完成后领取枪支和 L08 袭击任务。&lt;/td&gt;&lt;td&gt;把拆解产出转化为自身实力&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;任务目标与枪支交付&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;6:50–7:20&lt;/time&gt; 消耗零件强化自己的车 &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;7:20–7:40&lt;/time&gt; 安装配件 &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;7:40–8:00&lt;/time&gt; 领取枪支 / 前往袭击位置&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;车辆养成正式解锁&lt;/span&gt;进入 L08 袭击考核。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;8:00–9:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L08 袭击目标车队&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 兄弟一起做任务&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家按帮派分工袭击指定车队并夺取货物，完成第 3 项见习转正任务；本幕不再出现武装肌肉车追杀。&lt;/td&gt;&lt;td&gt;抢到货物并完成考核&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;目标建立&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;8:20–9:20&lt;/time&gt; 枪战 SUP &#215;1 &#183; 袭击车队夺货&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;9:20–9:30&lt;/time&gt; 夺货结算&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：声望&#183;首次获得&lt;/span&gt;见习转正任务进度达到 3 / 3，接续返程邀请。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;9:30–10:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L09 骑行返程、任务完成与正式邀请&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 阵型返程 / 正式提名&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;骑行小游戏 &#215;1 / 任务完成 &#215;2 / 晋升入口解锁 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家带着货物按标准阵型返城，成员正式邀请其加入。抵达后玩家点击完成袭击任务，任务列表刷新出最后条件“达到可晋升等级”；帮派树成长等级已满足要求，玩家再次点击完成，晋升按钮亮起。&lt;/td&gt;&lt;td&gt;提交全部见习证明并取得晋升资格&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;0s&lt;/strong&gt;&lt;br&gt;邀请随骑行完成&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;9:30–10:00&lt;/time&gt; 返程骑行小游戏 &#215;1 &#183; 夸奖与正式邀请&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;10:00–10:08&lt;/time&gt; 点击完成袭击任务&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;10:08–10:15&lt;/time&gt; 最终任务检查：达到可晋升等级&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;10:15–10:20&lt;/time&gt; 点击完成 / 晋升入口点亮&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;全部见习任务完成&lt;/span&gt;晋升 Full Patch 按钮开放，进入 L10。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-meeting-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;10:20–11:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L10 点击晋升&#183;首次议会转正&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 座次 / 木槌 / 正式背章&lt;/span&gt;&lt;span class=&quot;dc-system-first-meeting&quot;&gt;新系统解锁 &#183; 议会首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;点击晋升 &#215;1 / 议会 &#215;1 / 特殊晋升 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家在帮派树点击“晋升 Full Patch”，随后进入首次议会。成员按职级落座，会长以木槌确认投票并授予正式背章；玩家照片墙层级上升至 T2。会议结束后进入 L11，由章节任务承接正式成员的下一段行动。&lt;/td&gt;&lt;td&gt;把任务资格转化为正式身份和新的帮派活动资格&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;座次、木槌与投票&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;10:20–10:30&lt;/time&gt; 帮派树点击晋升 Full Patch&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;10:30–11:20&lt;/time&gt; 议会教学 / 投票 / 照片墙层级上升至 T2&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;11:20–11:50&lt;/time&gt; 授予正式背章 / 会议收束&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-meeting-callout&quot;&gt;议会系统正式解锁；帮派树显示每个 T2 管理 3 名 T1&lt;/span&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;职位：Full Patch&#183;和平直接提升&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;进入 L11 章节任务&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;3&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;11:50–24:20&lt;/span&gt;&lt;b&gt;第二幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;氮气备赛、竞速追杀与废车场复仇&lt;/b&gt;&lt;span&gt;玩家转正后，金发小哥立即发出 1v1 邀请，并指出玩家的车太烂；玩家直接去废车回收厂拆出氮气、回修车厂强化自己的车并参赛。竞速结束后遭追杀，金发小哥死亡；玩家完成复仇后接管废车场，尽快进入首个正式城建与派遣循环。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP &#215;3、氮气拆解 &#215;1、自己的车安装氮气 &#215;1、复仇拆车 &#215;1、第二辆车改装 &#215;1、废车场接管/城建/派遣各 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;12 循环&lt;/b&gt;&lt;span&gt;废车场自动经营提前至 23:20–24:20&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Enforcer&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p class=&quot;dc-note&quot;&gt;转正后直接按“竞速邀请并指出车辆太差 → 废车场拆出氮气 → 回修车厂强化自己的车 → 竞速”推进；修车厂只承担车辆养成功能，首个建筑管理循环落在废车回收厂。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;11:50–12:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L11 章节任务出现&#183;竞速邀请&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 &#183; 章节任务首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;剧情任务 &#215;1 / 章节任务接取 &#215;1 / 点击追踪 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;金发小哥发出 1v1 竞速邀请，但指出玩家的车太烂。对话结束后首次弹出章节任务“赢下金发小哥的挑战”；玩家点击接取和追踪，第一目标指向废车回收厂，要求从最新废车拆出一件够用的配件。后续节点按章节任务逐项推进。&lt;/td&gt;&lt;td&gt;接受挑战并按章节目标强化自己的车&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;邀请 / 嘲讽车辆太差 / 章节任务弹出&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;11:50–12:00&lt;/time&gt; 金发小哥发出邀请&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;12:00–12:10&lt;/time&gt; 章节任务出现 / 接取 / 点击追踪&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;章节任务正式解锁&lt;/span&gt;第一目标指向 L12 废车拆解。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;12:10–13:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L12 拆出最新氮气加速配件&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;废车拆解 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家前往废车回收厂，对最新到场的车辆进行一次拆解玩法，从中找到一套可用的氮气加速装置。&lt;/td&gt;&lt;td&gt;取得能改变竞速结果的关键配件&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;抵达 / 锁定最新车辆&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;12:30–13:00&lt;/time&gt; 废车拆解 &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;13:00–13:30&lt;/time&gt; 氮气配件结算 / 返回修车厂&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;获得配件：氮气加速装置&lt;/span&gt;不新增资源类型；进入 L13 安装。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;13:30–14:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L13 给自己的车安装氮气&lt;/div&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-A 改装 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家回到修车厂，把刚拆出的氮气加速装置安装到自己的车上，并确认竞速中可主动使用氮气。&lt;/td&gt;&lt;td&gt;把新配件转化为竞速能力&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;返厂 / 安装目标提示&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;13:50–14:20&lt;/time&gt; 安装氮气 &#215;1 / 功能确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;自己的车获得氮气加速能力；直接进入 L14 竞速。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;14:20–15:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L14 与金发小哥赛车&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 竞速仪式&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;1v1 竞速 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家驾驶刚装好氮气的车辆与金发小哥完成 1v1 赛车；竞速中首次把新装氮气用于超车并取胜。&lt;/td&gt;&lt;td&gt;证明自己的车已经有资格赢下比赛&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;进入赛场 / 开赛 / 赛后认可&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;14:40–15:40&lt;/time&gt; 1v1 竞速 SUP &#215;1 / 使用氮气&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;15:40–15:50&lt;/time&gt; 金发小哥反馈赛果&lt;/span&gt;&lt;/td&gt;&lt;td&gt;竞速胜利；玩家与金发小哥离场时突发追杀，接回现有 L15。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;15:50–17:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L15 赛后追杀与金发小哥牺牲&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 兄弟完美接应&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;逃亡枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;黑手党战车在两人离场时突然扫射；金发小哥以废车回收厂管理人的车辆贴靠接应，替玩家承受致命火力并在追杀中死亡。金发小哥只在开局、无线电和结尾演出中协作，玩家独立完成 SUP、击毁敌车并撤回城市。&lt;/td&gt;&lt;td&gt;活着脱离伏击并带金发小哥回城&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;伏击 / 金发小哥接应与死亡&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;16:10–17:10&lt;/time&gt; 枪战 SUP &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;17:10–17:20&lt;/time&gt; 拖车并带金发小哥撤回城市&lt;/span&gt;&lt;/td&gt;&lt;td&gt;金发小哥死亡，废车回收厂管理席空缺；被击毁的追杀车辆拖回废车场，准备谋划反击。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;17:20–18:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L16 谋划反击与拆车&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 越界定性 / 会长授权&lt;/span&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-C 拆解 / 分拣&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家带金发小哥回城汇报后，会长将袭击定性为越界并授权帮派制裁；玩家与成员制定为金发小哥复仇的计划，并拆解 L15 拖回的追杀车辆，寻找复仇车辆所需配件。&lt;/td&gt;&lt;td&gt;把敌方残车转化为反击条件&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;追悼 / 反击计划&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;17:30–18:00&lt;/time&gt; 拆解 L15 残车 &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;18:00–18:10&lt;/time&gt; 配件结算&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取得新车改装配件。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;18:10–19:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L17 第二辆车投放与改装&lt;/div&gt;&lt;span class=&quot;dc-reward-vehicle&quot;&gt;新投放 &#183; 剧情线第 2 辆车&lt;/span&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-A 改装 / 维修&lt;/span&gt;&lt;/td&gt;&lt;td&gt;废车场提供一辆可修复的新车；玩家使用拆出的配件完成改装并将其作为复仇车辆。&lt;/td&gt;&lt;td&gt;获得能完成复仇的新载具&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;新车交付&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;18:30–19:00&lt;/time&gt; 新车改装 &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;19:00–19:20&lt;/time&gt; 驾车出发&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-vehicle&quot;&gt;车辆投放：剧情线第 2 辆车&lt;/span&gt;进入复仇 SUP。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;19:20–20:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L18 为金发小哥复仇&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 绝对制裁&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家执行会长授权的制裁，驾驶新车追上伏击车队，为金发小哥完成枪战复仇并取回他的背章、废车厂钥匙与遗物。&lt;/td&gt;&lt;td&gt;为金发小哥复仇&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;目标确认&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;19:40–20:40&lt;/time&gt; 枪战 SUP &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;20:40–20:50&lt;/time&gt; 取回背章、钥匙与遗物&lt;/span&gt;&lt;/td&gt;&lt;td&gt;复仇完成；带着金发小哥遗物返回帮派会议。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;20:50–21:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L19 复仇复盘与 Enforcer 晋升&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 成员追悼 / 木槌 / 座次 / 背章&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;会议 &#215;1 / 晋升 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;金发小哥的背心、废车厂钥匙与遗物置于纪念位，成员触摸底章并完成引擎致敬；玩家汇报复仇结果，会长以木槌确认投票和座次变更，宣布玩家声望达标并晋升至 Enforcer，并授权其接管废车回收厂。&lt;/td&gt;&lt;td&gt;承接金发小哥留下的产业责任&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20–30s&lt;/strong&gt;&lt;br&gt;追悼 / 会议任命&lt;/td&gt;&lt;td&gt;追悼金发小哥 / Enforcer 晋升 / 帮派树更新。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;职位：Enforcer&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁废车回收厂接管&lt;/span&gt;开始管辖三名 Full Patch。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;21:50–22:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L20 接管废车回收厂&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;点击接管 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家以 Enforcer 身份返回废车场，在建筑入口点击接管。&lt;/td&gt;&lt;td&gt;把职位授权落到建筑&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;接管反馈&lt;/td&gt;&lt;td&gt;点击接管 / 管理状态更新。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;废车回收厂&#183;内部接管&lt;/span&gt;进入建设循环。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;22:20–23:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L21 建设废车回收厂&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;子建筑升级 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家修复拆解工位，让废车回收厂具备正式生产条件。&lt;/td&gt;&lt;td&gt;开放成员派遣条件&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;建设反馈&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;22:30–23:10&lt;/time&gt; 工位升级&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;23:10–23:20&lt;/time&gt; 派遣位开放&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;废车回收厂 Lv.1&lt;/span&gt;接续成员接管与派遣。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;23:20–24:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L22 派遣自动化与英雄救场&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 兄弟完美接应 / 精准袭击&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;帮派树接管 &#215;1 / 派遣 &#215;1 / 救场演出 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家接管一名 Full Patch 并派遣到废车回收厂，建筑进入自动运行。刚完成反馈，黑手党摩托车突然出现并向玩家射击；一名英雄单位驾驶肌肉车撞飞来袭摩托，表示自己是会长派来协助调查内奸的。连续袭击都能准确找到玩家位置，说明帮派内部有人持续泄露行踪。&lt;/td&gt;&lt;td&gt;让废车厂自动运行并活过精准刺杀&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;自动运行 / 摩托刺杀 / 肌肉车救场&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;23:30–23:45&lt;/time&gt; 帮派树接管&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;23:45–24:00&lt;/time&gt; 派遣并确认自动运行&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;24:00–24:20&lt;/time&gt; 刺杀出现 → 肌肉车撞飞敌人 → 英雄说明来意&lt;/span&gt;&lt;/td&gt;&lt;td&gt;废车回收厂自动化运行；&lt;span class=&quot;dc-reward-hero&quot;&gt;新英雄登场&#183;会长派遣的调查搭档&lt;/span&gt;内奸调查成立。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;4&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;24:20–42:30&lt;/span&gt;&lt;b&gt;第三幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;调查内奸、推关找线索、Roadman、商业街、比利叛变与加油站&lt;/b&gt;&lt;span&gt;承接废车厂派遣后的精准刺杀：会长派来的英雄单位驾肌肉车救场，并判断连续袭击说明内部有人泄露位置。两人通过首次推关击穿五个据点，再以挡风玻璃逼问 SUP 取得内奸代号；玩家回城受嘉奖晋升 Roadman，随后恢复商业街、揭出比利并完成制裁。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;推关 &#215;5、SUP &#215;2、接管 &#215;2、城建 &#215;2、议会 &#215;2。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;8 循环&lt;/b&gt;&lt;span&gt;首次推关与逼问 SUP 24:20–27:30&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Roadman&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Road Captain&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-system-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;24:20–27:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L23 五关追线与挡风玻璃逼问&lt;/div&gt;&lt;span class=&quot;dc-system-first&quot;&gt;新系统解锁 &#183; 推关首次出现&lt;/span&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 挡风玻璃逼问&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;推关 &#215;5 / 定制逼问 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与新英雄沿黑手党联络链连续推过五关，最后抓到负责传递位置的接头人。英雄把俘虏固定在肌肉车挡风玻璃上，玩家进入定制 SUP，一边高速驾驶、躲避追兵和制造压迫，一边逼问口供。关卡结束时，对方交代了内奸代号，但不知道其真实姓名。&lt;/td&gt;&lt;td&gt;取得内奸可追查的身份线索&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;挡风玻璃逼问&lt;/span&gt;&lt;/td&gt;&lt;td&gt;推关 &#215;5：逐层击穿联络点并暴露接头人 → 逼问 SUP &#215;1（约 60s）→ 获得内奸代号。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;推关系统正式解锁&lt;/span&gt;获得内奸代号，真实姓名仍未知；Roadman 晋升议题开启。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;27:30–28:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L24 任务完成&#183;点击晋升 Roadman&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;章节任务完成 &#215;1 / 点击晋升 &#215;1 / 会议确认 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与新英雄返回 Clubhouse，在章节任务中提交内奸代号并点击完成；任务面板确认 Roadman 晋升条件已满足，玩家进入帮派树点击晋升。会长随后公开嘉奖，触发 Roadman 晋升事件；现任 Roadman 保留并开放后续收复任务。&lt;/td&gt;&lt;td&gt;把调查成果转化为继续查内奸所需的产业权限&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;任务完成 / 点击晋升 / 晋升事件&lt;/span&gt;&lt;/td&gt;&lt;td&gt;完成五关追线、取得内奸代号并提交章节任务；帮派树显示 Roadman 条件全部满足。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Roadman&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁商业街接管&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;28:30–30:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L25 接管商业街&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家以 Roadman 身份带回账册，本帮前任负责人交出钥匙；梅丽尔首次出场。&lt;/td&gt;&lt;td&gt;恢复钱产业管理&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;已先取得 Roadman 权限。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;商业街&#183;内部接管&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;

      &lt;h2&gt;Part 3 &#183; 一日版本与正式版本分流&lt;/h2&gt;
      &lt;div class=&quot;dc-branch&quot;&gt;
        &lt;div&gt;&lt;h3&gt;正式版：官职链衔接大地图&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;60–64：枪战 SUP 切磋 → Sergeant-at-Arms。&lt;/li&gt;&lt;li&gt;64–70：追回本帮物资后进入大地图任务 → Senior Members。&lt;/li&gt;&lt;li&gt;70–76：迎接汉克回归并由议会选定地图目标。&lt;/li&gt;&lt;li&gt;76–82：竞速 SUP → Vice President，获得 Clubhouse 帮派管理权限。&lt;/li&gt;&lt;li&gt;82:00–89:30：以副会长身份完成一次大地图任务。&lt;/li&gt;&lt;li&gt;89:30–90:00：通过议会完成 President 交接。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h3&gt;一日版：同一官职链，重复既有玩法&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;57:30–61:30：枪战 SUP 完成武装队长切磋。&lt;/li&gt;&lt;li&gt;61:30–67:30：推关清理叛徒藏点，SUP 护送本帮物资返城。&lt;/li&gt;&lt;li&gt;67:30–73:30：迎接汉克回归，完成一次车队护送 SUP。&lt;/li&gt;&lt;li&gt;73:30–79:30：竞速 SUP 完成副会长挑战。&lt;/li&gt;&lt;li&gt;79:30–87:00：推关清理叛徒残余、SUP 护送返城并恢复建筑。&lt;/li&gt;&lt;li&gt;87:00–87:30：通过议会完成 President 交接。&lt;/li&gt;&lt;li&gt;87:30–90:00：既有玩法复玩与结算缓冲。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;dc-warning&quot;&gt;&lt;strong&gt;改编边界：&lt;/strong&gt;七月 Demo 台本后段未确认的玩法不进入本方案；对应剧情功能统一改为“叛徒残党盗运本帮物资 → 推关清理内部藏点 → SUP 护送返城 → 城建修复”。所有城市建筑始终属于我方帮派。&lt;/div&gt;
    &lt;/section&gt;

  &lt;h2 id=&quot;gang-tree-title&quot;&gt;Part 4 &#183; 帮派照片墙&lt;/h2&gt;
  &lt;p class=&quot;dc-note&quot;&gt;&lt;strong&gt;玩家靠声望纵向晋升，NPC 靠任务横向收复。&lt;/strong&gt;原职级和已有名字不变；每次晋升触发一个独立事件，晋升后逐步开放低职级 NPC 的收复任务。&lt;/p&gt;
  &lt;div class=&quot;gw-rule&quot;&gt;&lt;div&gt;&lt;b&gt;晋升 = 纵向成长&lt;/b&gt;&lt;span&gt;累计声望达到门槛 → 点击晋升 → 播放该职级事件；原职位 NPC 全部保留。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;收复 = 横向收集&lt;/b&gt;&lt;span&gt;晋升后解锁低阶 NPC 照片；逐个完成照片上的专属任务，将角色收入玩家阵营。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;奖励 = 角色投放&lt;/b&gt;&lt;span&gt;人物照片、任务特点与奖励角标绑定在同一张角色卡上。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;gw-loop&quot; aria-label=&quot;帮派照片墙核心循环&quot;&gt;&lt;div&gt;&lt;b&gt;1 &#183; 玩法赚声望&lt;/b&gt;&lt;span&gt;SUP、推关、任务、城建&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;2 &#183; 达到职级门槛&lt;/b&gt;&lt;span&gt;查看声望进度&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;3 &#183; 触发晋升事件&lt;/b&gt;&lt;span&gt;每职级一个事件&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;4 &#183; 解锁低阶照片&lt;/b&gt;&lt;span&gt;出现可收复 NPC&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;5 &#183; 完成收复任务&lt;/b&gt;&lt;span&gt;领取角色与投放奖励&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;gw-frame&quot;&gt;&lt;div class=&quot;gw-board&quot; aria-label=&quot;T1 到 T10 帮派照片墙&quot;&gt;
    &lt;div class=&quot;gw-plaque&quot;&gt;&lt;b&gt;DOBE MC &#183; MEMBER WALL&lt;/b&gt;&lt;span&gt;声望晋升 / 任务收复 / 角色投放&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;gw-legend&quot;&gt;&lt;span&gt;&lt;i class=&quot;gw-drop&quot;&gt;确定投放&lt;/i&gt;已有建筑与资源功能&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;gw-drop pending&quot;&gt;候选投放&lt;/i&gt;小人、英雄、车或枪&lt;/span&gt;&lt;span&gt;照片只展示人物；照片下保留任务特点与奖励角标&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;gw-tier&quot; data-tier=&quot;T10&quot;&gt;&lt;div class=&quot;gw-promotion&quot;&gt;&lt;strong&gt;T10 President（会长）&lt;/strong&gt;&lt;span class=&quot;gw-rep&quot;&gt;声望门槛：5,500（示意）&lt;/span&gt;&lt;span class=&quot;gw-event&quot;&gt;晋升事件：全体选举与会长授章&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gw-people&quot;&gt;&lt;article class=&quot;gw-person&quot; data-scene=&quot;council-promotion.webp&quot;&gt;&lt;div class=&quot;gw-drops&quot;&gt;&lt;i class=&quot;gw-drop&quot;&gt;Clubhouse&lt;/i&gt;&lt;i class=&quot;gw-drop&quot;&gt;建筑上限&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;gw-photo&quot; style=&quot;--gw-scene:url(&#39;assets/clue-scenes/council-promotion.webp&#39;)&quot;&gt;&lt;b class=&quot;gw-photo-code&quot;&gt;JM&lt;/b&gt;&lt;span class=&quot;gw-photo-label&quot;&gt;全体选举&lt;/span&gt;&lt;/div&gt;&lt;b class=&quot;gw-name&quot;&gt;杰森“拉斯蒂”蒙哥马利&lt;/b&gt;&lt;span class=&quot;gw-task&quot;&gt;任务：赢得全体选举，在木槌表决后接受会长授章。&lt;/span&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gw-tier&quot; data-tier=&quot;T9&quot;&gt;&lt;div class=&quot;gw-promotion&quot;&gt;&lt;strong&gt;T9 Vice President（副会长）&lt;/strong&gt;&lt;span class=&quot;gw-rep&quot;&gt;声望门槛：4,200（示意）&lt;/span&gt;&lt;span class=&quot;gw-event&quot;&gt;晋升事件：传统竞速与车队授位&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gw-people&quot;&gt;&lt;article class=&quot;gw-person&quot; data-scene=&quot;one-on-one-race.webp&quot;&gt;&lt;div class=&quot;gw-drops&quot;&gt;&lt;i class=&quot;gw-drop&quot;&gt;车&lt;/i&gt;&lt;i class=&quot;gw-drop&quot;&gt;枪&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;gw-photo&quot; style=&quot;--gw-scene:url(&#39;assets/clue-scenes/one-on-one-race.webp&#39;)&quot;&gt;&lt;b class=&quot;gw-photo-code&quot;&gt;WK&lt;/b&gt;&lt;span class=&quot;gw-photo-label&quot;&gt;传统竞速&lt;/span&gt;&lt;/div&gt;&lt;b class=&quot;gw-name&quot;&gt;韦恩&#183;“加斯”&#183;科瓦尔斯基&lt;/b&gt;&lt;span class=&quot;gw-task&quot;&gt;任务：完成副会长传统竞速，并带领车队按阵型返城。&lt;/span&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;

  if (versionHeadings[0]) versionHeadings[0].id = &#39;dc-version-formal&#39;;

  const partSelector = &#39;#dc-part-1, #dc-part-2, #dc-version-branch, #dc-gang-tree&#39;;

    while (heading.nextSibling) body.appendChild(heading.nextSibling);
    section.appendChild(body);
    const toggle = document.createElement(&#39;button&#39;);
    toggle.type = &#39;button&#39;;
    toggle.className = &#39;dc-part-toggle&#39;;
    const setOpen = open =&gt; {
      toggle.setAttribute(&#39;aria-expanded&#39;, String(open));
      toggle.textContent = open ? &#39;收起&#39; : &#39;展开&#39;;
      body.hidden = !open;
      section.classList.toggle(&#39;is-collapsed&#39;, !open);
    };
    toggle._setPartOpen = setOpen;
    toggle.addEventListener(&#39;click&#39;, () =&gt; setOpen(toggle.getAttribute(&#39;aria-expanded&#39;) !== &#39;true&#39;));
    heading.appendChild(toggle);
    setOpen(section.id !== &#39;dc-part-1&#39;);

  const tocItems = [

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;

  const hoverDelay = 700;
  const skipDelay = 300;

  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;

        svg.appendChild(line);
      });
      [...rankShelf.querySelectorAll('.dc-rank-card')].forEach(rank => { const clue = cards.find(card => card.dataset.clueId === rank.dataset.clue); if (!clue) return; const line = doc.createElementNS('http://www.w3.org/2000/svg','line'); line.setAttribute('x1', storyAxis.offsetLeft + clue.offsetLeft + clue.offsetWidth); line.setAttribute('y1', storyAxis.offsetTop + clue.offsetTop + clue.offsetHeight / 2); line.setAttribute('x2', rankPanel.offsetLeft + rankShelf.offsetLeft + rank.offsetLeft); line.setAttribute('y2', rankPanel.offsetTop + rankShelf.offsetTop + rank.offsetTop + rank.offsetHeight / 2); line.setAttribute('class','rank'); svg.appendChild(line); });
    };
    let scale = 1, panX = 0, panY = 0, drag = null;
    const applyView = () => {
      canvas.style.zoom = scale;
      canvas.style.left = (panX / scale) + 'px';
      canvas.style.top = (panY / scale) + 'px';
      canvas.style.transform = '';
    };
    const fitView = () => { scale = Math.min(1, (viewport.clientWidth - 48) / grid.scrollWidth); panX = Math.max(24, (viewport.clientWidth - grid.scrollWidth * scale) / 2); panY = 24; applyView(); };
    fullscreenButton.addEventListener('click', () => doc.fullscreenElement === wall ? doc.exitFullscreen() : wall.requestFullscreen());
    doc.addEventListener('fullscreenchange', () => {
      const active = doc.fullscreenElement === wall;
      fullscreenButton.textContent = active ? 'Esc 退出全屏' : '⛶ 全屏查看';
      if (active) requestAnimationFrame(fitView); else { scale = 1; panX = 0; panY = 0; canvas.style.zoom = ''; canvas.style.left = ''; canvas.style.top = ''; canvas.style.transform = ''; }
    });
    viewport.addEventListener('wheel', event => {
      if (doc.fullscreenElement !== wall) {
        if (Math.abs(event.deltaY) >= Math.abs(event.deltaX)) { event.preventDefault(); doc.defaultView.scrollBy(0, event.deltaY); }
        return;
      }
      event.preventDefault();
      const rect = viewport.getBoundingClientRect();
      const mx = event.clientX - rect.left, my = event.clientY - rect.top;
      const nextScale = Math.max(.25, Math.min(5, scale * (event.deltaY < 0 ? 1.12 : .89)));
      panX = mx - (mx - panX) * nextScale / scale;
      panY = my - (my - panY) * nextScale / scale;
      scale = nextScale;
      applyView();
    }, {passive:false});
    viewport.addEventListener('pointerdown', event => {
      if (doc.fullscreenElement !== wall || event.button !== 0) return;
      drag = {x:event.clientX,y:event.clientY,panX,panY};
      viewport.classList.add('is-dragging');
      viewport.setPointerCapture(event.pointerId);
    });
    viewport.addEventListener('pointermove', event => {
      if (!drag) return;
      panX = drag.panX + event.clientX - drag.x;
      panY = drag.panY + event.clientY - drag.y;
      applyView();
    });
    const stopDrag = event => { if (!drag) return; drag = null; viewport.classList.remove('is-dragging'); if (viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId); };
    viewport.addEventListener('pointerup', stopDrag);
    viewport.addEventListener('pointercancel', stopDrag);
    requestAnimationFrame(draw);
    new ResizeObserver(draw).observe(grid);
  };
  frame?.addEventListener('load', () => setTimeout(build,0));
  setTimeout(build,0);
  let retries = 0;
  const retryTimer = setInterval(() => {
    if (frame?.contentDocument?.querySelector('.dc-clue-wall') || retries++ > 120) { clearInterval(retryTimer); return; }
    build();
  }, 500);
})();
</script>
</body>
</html>
