:root[data-theme=&quot;light&quot;] {

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;dobe-compressed-loops&quot;&gt;
  &lt;style&gt;
    #dobe-compressed-loops {

    &lt;div class=&quot;dc-kicker&quot;&gt;一日版本 &#183; 90 分钟渐进体验&lt;/div&gt;
    &lt;h1&gt;Dobe一日渐进规划&lt;/h1&gt;

    &lt;section class=&quot;dc-section dc-part&quot; id=&quot;dc-part-1&quot; aria-labelledby=&quot;dc-part-1-title&quot;&gt;
      &lt;h2 id=&quot;dc-part-1-title&quot;&gt;Part 1 &#183; 目前已确定的信息&lt;/h2&gt;
      &lt;p class=&quot;dc-note&quot;&gt;以下内容整理自《一日渐进线汇总一图流》的有效“基础信息”框；帮派树结构统一放到 Part 4。&lt;/p&gt;

      &lt;h3 id=&quot;dc-confirmed-docs&quot;&gt;关联文档&lt;/h3&gt;
      &lt;div class=&quot;dc-link-list&quot;&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/wiki/ZjSowGJvPiXaA5k3nokcHjHEnhe&quot;&gt;&lt;strong&gt;Dobe 记忆点梳理&lt;/strong&gt;&lt;span&gt;叙事与记忆点来源&lt;/span&gt;&lt;/a&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/wiki/OMqDwrtSaizj4lkssBHcH4R2nxd?sheet=JmzW2M&quot;&gt;&lt;strong&gt;DOBE世界观方案 - 摩托帮&lt;/strong&gt;&lt;span&gt;帮派世界观与职级命名来源&lt;/span&gt;&lt;/a&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/sheets/XDBMs2LLnhcjB1tTWZ5c570fnbd?sheet=d4nknv&quot;&gt;&lt;strong&gt;帮派树与章节体与会议&lt;/strong&gt;&lt;span&gt;章节节点与会议结构来源&lt;/span&gt;&lt;/a&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/wiki/Url8w5jzIi7egukzDsHcR4y1nRi?sheet=5b3ec5&amp;amp;table=tblXtHbB5XD5buPw&amp;amp;view=vewnVSvZqi&quot;&gt;&lt;strong&gt;七月 Demo 台本&lt;/strong&gt;&lt;span&gt;商业街开始后的剧情顺序与场景元素来源&lt;/span&gt;&lt;/a&gt;
      &lt;/div&gt;

      &lt;h3 id=&quot;dc-confirmed-framework&quot;&gt;内容与成长框架&lt;/h3&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-confirmed-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;范围&lt;/th&gt;&lt;th&gt;已确定内容&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;叙事&lt;/td&gt;&lt;td&gt;以“记忆点”组织叙事推进&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;车配件养成&lt;/td&gt;&lt;td&gt;等级、品质&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;枪械养成&lt;/td&gt;&lt;td&gt;等级；星级仍待确认&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;英雄养成&lt;/td&gt;&lt;td&gt;等级、技能；星级仍待确认&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;SUP&lt;/td&gt;&lt;td&gt;竞速、枪战关、碰撞型枪战异化关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;推关&lt;/td&gt;&lt;td&gt;独立战斗循环&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;城建&lt;/td&gt;&lt;td&gt;接管、碎片化升级、升级&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;模拟经营&lt;/td&gt;&lt;td&gt;确定采用小人投放并派遣至建筑工作；L16 首次教学接管一名 Prospect 并派遣至改装厂&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;待确认项&lt;/td&gt;&lt;td&gt;小游戏&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

      &lt;h3 id=&quot;dc-drop-overview&quot;&gt;投放总览&lt;/h3&gt;
      &lt;p class=&quot;dc-note&quot;&gt;“3 + 1 + 1”依次指剧情线、活动签到、首充三个渠道；仅记录当前已确认的投放数量，不补充未确认渠道。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-confirmed-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;投放内容&lt;/th&gt;&lt;th&gt;剧情线&lt;/th&gt;&lt;th&gt;活动签到&lt;/th&gt;&lt;th&gt;首充&lt;/th&gt;&lt;th&gt;当前合计&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;英雄&lt;/td&gt;&lt;td&gt;3 个&lt;/td&gt;&lt;td&gt;1 个&lt;/td&gt;&lt;td&gt;1 个&lt;/td&gt;&lt;td&gt;5 个&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;车&lt;/td&gt;&lt;td&gt;3 辆&lt;/td&gt;&lt;td&gt;1 辆&lt;/td&gt;&lt;td&gt;1 辆&lt;/td&gt;&lt;td&gt;5 辆&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;枪&lt;/td&gt;&lt;td&gt;3 把&lt;/td&gt;&lt;td&gt;1 把&lt;/td&gt;&lt;td&gt;1 把&lt;/td&gt;&lt;td&gt;5 把&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;模拟经营小人&lt;/td&gt;&lt;td&gt;5 个以上，具体数量待定&lt;/td&gt;&lt;td&gt;未确认&lt;/td&gt;&lt;td&gt;未确认&lt;/td&gt;&lt;td&gt;5 个以上，具体数量待定&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;配件&lt;/td&gt;&lt;td&gt;有，数量待定&lt;/td&gt;&lt;td&gt;有，数量待定&lt;/td&gt;&lt;td&gt;有，数量待定&lt;/td&gt;&lt;td&gt;数量待定&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

      &lt;h3 id=&quot;dc-confirmed-buildings&quot;&gt;确定建筑与功能&lt;/h3&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-building-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;建筑名&lt;/th&gt;&lt;th&gt;确定功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Clubhouse&lt;/td&gt;&lt;td&gt;帮派议会演出 / 帮派管理（之后模拟经营小人）/ 推关挂机产出&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;修车厂&lt;/td&gt;&lt;td&gt;载具改装；第一个解锁建筑&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;废车回收场&lt;/td&gt;&lt;td&gt;高级资源：零件；产载具部件&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;商业街&lt;/td&gt;&lt;td&gt;基础资源：钱&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;物资中转站 / 运输公司&lt;/td&gt;&lt;td&gt;基础资源：物资&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;加油站&lt;/td&gt;&lt;td&gt;基础资源：油&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

      &lt;h3 id=&quot;dc-confirmed-anchors&quot;&gt;版本锚点&lt;/h3&gt;
      &lt;div class=&quot;dc-rules&quot;&gt;
        &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;一日版本终点：&lt;/strong&gt;玩家成为 President（会长）&lt;/span&gt;
        &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;正式版预期：&lt;/strong&gt;取得 Clubhouse 后解锁第二段帮派树，节点可能对应联盟玩法解锁&lt;/span&gt;
        &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;一日版调整：&lt;/strong&gt;Clubhouse 的取得位置允许灵活调整&lt;/span&gt;
        &lt;span class=&quot;dc-rule&quot;&gt;&lt;strong&gt;前 10 分钟：&lt;/strong&gt;允许先使用功能，但不代表真正取得对应建筑&lt;/span&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-section dc-part&quot; id=&quot;dc-part-2&quot; aria-labelledby=&quot;dc-part-2-title&quot;&gt;
      &lt;h2 id=&quot;dc-part-2-title&quot;&gt;Part 2 &#183; 渐进规划&lt;/h2&gt;
      &lt;p class=&quot;dc-note&quot;&gt;先看整体因果与六幕承接关系，再逐幕查看分钟级循环。&lt;/p&gt;
      &lt;h3 id=&quot;dc-story-causal-title&quot;&gt;整体剧情因果&lt;/h3&gt;
      &lt;div class=&quot;dc-causal&quot;&gt;
        &lt;div&gt;&lt;b&gt;带货甩警&lt;/b&gt;&lt;br&gt;&lt;span&gt;玩家骑摩托摆脱警方&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;交货遇袭&lt;/b&gt;&lt;br&gt;&lt;span&gt;黑手党打坏摩托，金发 NPC 接应&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;修车与 1v1&lt;/b&gt;&lt;br&gt;&lt;span&gt;氮气维修后用竞速建立信任&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;改装厂爆炸&lt;/b&gt;&lt;br&gt;&lt;span&gt;货物被抢，会长要求先强化车辆&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;枪战反击&lt;/b&gt;&lt;br&gt;&lt;span&gt;夺回货物，金发 NPC 为玩家牺牲&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;加入摩托帮&lt;/b&gt;&lt;br&gt;&lt;span&gt;追杀压力转化为 Prospect 身份&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;议会转正与经营&lt;/b&gt;&lt;br&gt;&lt;span&gt;接管改装厂，派遣见习实现自动运行&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;赛车伏击与复仇&lt;/b&gt;&lt;br&gt;&lt;span&gt;接应者牺牲，玩家以第二辆车完成复仇并补位晋升&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;h3 id=&quot;dc-act-relations-title&quot;&gt;六幕关系&lt;/h3&gt;
      &lt;div class=&quot;dc-overview&quot; aria-label=&quot;六幕时间分配与承接关系&quot;&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;0–3:20&lt;/span&gt;&lt;b&gt;序幕&lt;/b&gt;&lt;span&gt;甩警 / 交货遇袭 / 枪战逃亡 / 回厂&lt;br&gt;4 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;3:20–14:00&lt;/span&gt;&lt;b&gt;第一幕&lt;/b&gt;&lt;span&gt;维修 / 竞速 / 失窃反击 / 正式加入&lt;br&gt;8 循环&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;14:00–27:20&lt;/span&gt;&lt;b&gt;第二幕&lt;/b&gt;&lt;span&gt;转正 / 改装厂 / 赛车伏击 / 废车厂&lt;br&gt;14 循环&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;27:20–45:30&lt;/span&gt;&lt;b&gt;第三幕&lt;/b&gt;&lt;span&gt;首次推关 / Roadman / 商业街 / 比利 / 加油站&lt;br&gt;8 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;45:30–60:30&lt;/span&gt;&lt;b&gt;第四幕&lt;/b&gt;&lt;span&gt;梅丽尔救援 / 物流中心&lt;br&gt;4 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;60:30–90:00&lt;/span&gt;&lt;b&gt;第五幕&lt;/b&gt;&lt;span&gt;叛徒残党 / 汉克回归 / 晋升会长&lt;br&gt;6 循环&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;1&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;0:00–3:20&lt;/span&gt;&lt;b&gt;序幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;甩警交货与黑手党伏击&lt;/b&gt;&lt;span&gt;玩家骑摩托甩掉警方后与摩托帮交货；黑手党突袭并打坏玩家的摩托，金发 NPC 接应玩家带货上车，双方完成逃亡枪战并把废车拖回改装厂。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;警匪追逐 SUP &#215;1、逃亡枪战 SUP &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;4 循环&lt;/b&gt;&lt;span&gt;SUP 各约 60s / 演出 10–30s&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;无&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-sup-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;0:00–1:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L01 警匪追逐&lt;/div&gt;&lt;span class=&quot;dc-first-badge dc-first-sup-badge&quot;&gt;新玩法解锁 &#183; SUP 首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;警匪追逐 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;无人机航拍公路，警方频道播报正在追击科尔；镜头下拉进入摩托车视角。&lt;/td&gt;&lt;td&gt;带货甩掉警方&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;航拍+警方播报+镜头接管&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;0:20–1:20&lt;/time&gt; 警匪追逐 SUP &#215;1：闪避、择路、甩脱&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;SUP 正式解锁：单局约 60 秒；本关不主动撞击警车&lt;/span&gt;成功甩警，进入交货地点。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;1:20–1:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L02 交货遇袭与金发 NPC 接应&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;剧情接应 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与摩托帮正在交接货物，黑手党突然袭击并打坏玩家的摩托；金发 NPC 驾车接应，让玩家带着货上车。&lt;/td&gt;&lt;td&gt;保住货物并活着离开&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;30s&lt;/strong&gt;&lt;br&gt;交货+突袭+上车&lt;/td&gt;&lt;td&gt;确认货物 / 跑向接应车 / 上车。&lt;/td&gt;&lt;td&gt;认识金发 NPC；直接进入逃亡枪战。&lt;/td&gt;&lt;/tr&gt;

      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;2&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;3:20–14:00&lt;/span&gt;&lt;b&gt;第一幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;维修复车、1v1 竞速、失窃反击与加入帮派&lt;/b&gt;&lt;span&gt;金发 NPC 帮玩家修好摩托并安装氮气，以 1v1 竞速建立关系；返厂发现黑手党袭击并抢走货物，玩家取零件完成首次正式养成后反击。金发 NPC 为保护玩家死亡，玩家处决袭击者并被列入追杀名单，最终接受会长邀请加入摩托帮。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;维修 &#215;1、竞速 SUP &#215;1、废车回收 &#215;2、车辆养成 &#215;1、枪战 SUP &#215;1、手动处决 &#215;1、帮派树 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;8 循环 / 10m40s&lt;/b&gt;&lt;span&gt;SUP 各约 60s&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Prospect&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平加入&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p class=&quot;dc-note&quot;&gt;第一幕只建立帮派身份与职级概念：L12 才首次显示帮派树，玩家以 Prospect 进入初始节点；议会、Full Patch、改装厂接管与城建均顺延到后续重新设计。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;3:20–4:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L05 修复主角摩托与安装氮气&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新玩法 &#183; 改装/维修首次出现&lt;/span&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-A 改装 / 维修 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;金发 NPC 带玩家在改装厂修复序幕中被打坏的摩托，并提供氮气罐安装到机车上。&lt;/td&gt;&lt;td&gt;恢复行动能力&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;检查损伤+交付氮气&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;3:40–4:10&lt;/time&gt; 维修与氮气安装小游戏 &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;4:10–4:20&lt;/time&gt; 点火测试&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;摩托修复并获得氮气能力；不打开车辆养成界面&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;4:20–6:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L06 金发 NPC 1v1 竞速&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新玩法 &#183; 竞速 SUP 首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;1v1 竞速 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;金发 NPC 提议与玩家比一场；玩家驾驶刚修好的摩托，在比赛中首次使用氮气并取胜，随后两人一起返回改装厂。&lt;/td&gt;&lt;td&gt;测试车辆并建立信任&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;30s&lt;/strong&gt;&lt;br&gt;挑战+赛果+返程&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;4:30–5:30&lt;/time&gt; 1v1 竞速 SUP &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;5:30–6:00&lt;/time&gt; 赛果反馈 / 一同返厂&lt;/span&gt;&lt;/td&gt;&lt;td&gt;金发 NPC 认可玩家；接近改装厂时发现异常。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;6:00–6:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L07 改装厂爆炸与货物失窃&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;剧情演出 / 反击任务&lt;/span&gt;&lt;/td&gt;&lt;td&gt;两人接近改装厂时发生爆炸；返回后发现黑手党袭击了改装厂并抢走货物。会长判断事情有蹊跷，邀请玩家共同反击，但要求玩家先强化摩托。&lt;/td&gt;&lt;td&gt;夺回货物并查清内应&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s + 20s&lt;/strong&gt;&lt;br&gt;爆炸 / 会长判断&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;6:40–6:50&lt;/time&gt; 接取反击任务 / 前往废车厂&lt;/span&gt;&lt;/td&gt;&lt;td&gt;废车回收任务开启；目标是取得改装配件。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;6:50–8:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L08 废车回收取件&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新玩法 &#183; 废车回收首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;回收小游戏 &#215;2&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家前往废车回收厂，连续处理两辆废车，取得足够强化摩托的配件。&lt;/td&gt;&lt;td&gt;准备反击所需配件&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;任务说明+结算&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;7:00–7:30&lt;/time&gt; 回收 1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;7:40–8:10&lt;/time&gt; 回收 2&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;8:10–8:20&lt;/time&gt; 配件结算&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：零件&#183;首次获得&lt;/span&gt;返回改装厂进行真实车辆养成。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;8:20–9:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L09 首次车辆养成改装&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 &#183; 车辆养成首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;养成界面教学 &#215;1 / 配件安装 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家返回改装厂，金发 NPC 已完成一轮现场修复；他引导玩家首次打开车辆养成界面，把 L08 取得的配件正式安装到摩托上。&lt;/td&gt;&lt;td&gt;把零件转化为战斗能力&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;改装厂修复进度+界面引导&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;8:40–9:30&lt;/time&gt; 车辆养成界面 / 选择并安装配件&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;9:30–9:50&lt;/time&gt; 属性反馈 / 出发&lt;/span&gt;&lt;/td&gt;&lt;td&gt;真实车辆养成与配件槽开启；进入枪战反击。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;9:50–11:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L10 埋伏黑手党&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与摩托帮按会长计划埋伏袭击黑手党车队，试图夺回被抢货物。&lt;/td&gt;&lt;td&gt;夺回货物&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;埋伏目标建立&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;10:10–11:10&lt;/time&gt; 枪战 SUP &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;11:10–11:20&lt;/time&gt; 夺回货物 / 结束演出切入&lt;/span&gt;&lt;/td&gt;&lt;td&gt;货物夺回；黑手党残余准备最后偷袭。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;11:20–12:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L11 金发 NPC 牺牲与手动处决&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;剧情演出 / 手动处决 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;SUP 结束后，黑手党残余在最终演出中偷袭玩家；金发 NPC 挡下致命攻击并死亡。玩家制服袭击者，对方临死前宣称玩家已进入黑手党老大的名单，将被追杀至死。&lt;/td&gt;&lt;td&gt;为金发 NPC 复仇&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;30s&lt;/strong&gt;&lt;br&gt;偷袭+牺牲+临终威胁&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;12:00–12:20&lt;/time&gt; 玩家手动瞄准并处决袭击者&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;12:20–12:30&lt;/time&gt; 收束 / 返回城镇&lt;/span&gt;&lt;/td&gt;&lt;td&gt;金发 NPC 死亡；黑手党追杀主线成立。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-gang-tree-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;12:30–14:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L12 会长邀请与加入摩托帮&lt;/div&gt;&lt;span class=&quot;dc-system-first-gang-tree&quot;&gt;新系统解锁 &#183; 帮派树首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;加入剧情 &#215;1 / 帮派树教学 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家返回城镇；会长认可玩家夺回货物并承担损失的表现，正式邀请玩家加入摩托帮。界面首次展示帮派树、等级概念和玩家的初始位置。&lt;/td&gt;&lt;td&gt;获得组织保护与反击身份&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;会长邀请&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;12:50–13:30&lt;/time&gt; 帮派树首次展示&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;13:30–14:00&lt;/time&gt; 职级/等级概念与初始节点说明&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-gang-tree-callout&quot;&gt;玩家以 Prospect 出现在帮派树初始位置&lt;/span&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;职位：Prospect&lt;/span&gt;第一幕结束。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;3&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;14:00–27:20&lt;/span&gt;&lt;b&gt;第二幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;转正、改装厂经营、赛车伏击与废车厂复仇&lt;/b&gt;&lt;span&gt;玩家先由议会和平转正，取得并经营改装厂；随后为帮派赛车备战，却在赛后伏击中失去废车场负责人。玩家拆解追杀车辆、获得第二辆车并完成复仇，最终补位晋升 Enforcer，接管废车回收厂。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;议会 &#215;2、接管 &#215;2、城建 &#215;2、派遣 &#215;2、回收 &#215;3、竞速 SUP &#215;1、枪战 SUP &#215;2。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;14 循环 / 13m20s&lt;/b&gt;&lt;span&gt;推关约在 27:20 后引出&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Full Patch&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平直接提升&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Enforcer&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p class=&quot;dc-note&quot;&gt;承接方案 A 的 L12：玩家此时只是刚加入的 Prospect。第二幕沿用方案 B 从“会议转正、改装厂经营”往后的功能骨架，但所有前置都重新接到金发 NPC 牺牲与黑手党追杀主线上。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-meeting-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;14:00–14:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L13 首次议会与和平转正&lt;/div&gt;&lt;span class=&quot;dc-system-first-meeting&quot;&gt;新系统解锁 &#183; 议会首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;会议投票 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;会长召集议会复盘货物夺回与金发 NPC 牺牲。成员认可玩家已为帮派流血，投票将其从 Prospect 和平提升为 Full Patch，并把空置的改装厂管理资格交给玩家。&lt;/td&gt;&lt;td&gt;获得正式成员身份&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;提名、举手表决、授予背章&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;14:20–14:40&lt;/time&gt; 会议选择 / 确认投票结果&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;14:40–14:50&lt;/time&gt; 职级与建筑权限反馈&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-meeting-callout&quot;&gt;议会系统首次出现&lt;/span&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;职位：Full Patch&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁改装厂接管&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;14:50–15:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L14 接管改装厂&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 &#183; 建筑接管首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;点击接管 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家以 Full Patch 身份回到帮派所属改装厂，在入口完成管理权登记；现场成员把钥匙和工位账册交给玩家。&lt;/td&gt;&lt;td&gt;把职位授权落到建筑&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;内部交接&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;15:00–15:10&lt;/time&gt; 点击接管&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;15:10–15:20&lt;/time&gt; 管理状态反馈&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;改装厂&#183;内部接管&lt;/span&gt;进入城建循环。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;15:20–16:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L15 修建改装厂&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 &#183; 城建首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;子建筑升级 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家修复被袭击后的工位，完成一次子建筑升级，让改装厂恢复正式生产条件。&lt;/td&gt;&lt;td&gt;恢复改装厂运转&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;受损工位与升级反馈&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;15:30–16:00&lt;/time&gt; 选择并升级工位&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;16:00–16:10&lt;/time&gt; 产能与派遣位反馈&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;改装厂 Lv.1&lt;/span&gt;开放成员派遣。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;16:10–17:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L16 接管成员并派遣改装厂&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 &#183; 模拟经营首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;帮派树接管 &#215;1 / 派遣 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;帮派大佬说明正式成员可以带见习；玩家在帮派树中接管一名 Prospect，再将其派遣到改装厂工位。&lt;/td&gt;&lt;td&gt;让改装厂自动运行&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;成员安排提示&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;16:20–16:35&lt;/time&gt; 帮派树点击接管&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;16:35–16:50&lt;/time&gt; 派遣至改装厂&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;16:50–17:00&lt;/time&gt; 自动运行反馈&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;小人派遣模拟经营首次出现&lt;/span&gt;改装厂开始自动运行。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;17:00–18:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L17 赛车邀请与赛前备战&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;回收小游戏 &#215;2 / 配件安装 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;帮派邀请玩家参加一场赛车。为提高胜算，玩家先到本帮废车回收厂帮忙处理两辆黑市车辆，取得配件后返回改装厂安装。&lt;/td&gt;&lt;td&gt;为比赛强化当前车辆&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;邀请与备战目标&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;17:20–17:50&lt;/time&gt; 回收 1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;18:00–18:30&lt;/time&gt; 回收 2&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;18:30–18:50&lt;/time&gt; 安装配件&lt;/span&gt;&lt;/td&gt;&lt;td&gt;当前车辆强化完成；前往赛场。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;18:50–20:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L18 帮派赛车&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;竞速 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家代表帮派参加赛车，以此前的改装成果赢得比赛。&lt;/td&gt;&lt;td&gt;为帮派赢得比赛&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;起跑与赛果&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;19:00–20:00&lt;/time&gt; 竞速 SUP &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;20:00–20:10&lt;/time&gt; 领奖 / 离场&lt;/span&gt;&lt;/td&gt;&lt;td&gt;竞速胜利；离场时黑手党伏击突然发生。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;20:10–21:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L19 赛后伏击与逃亡枪战&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;黑手党战车突然扫射玩家。原管理废车回收厂的 Enforcer 驾车接应，却在掩护中死亡；玩家边逃边击毁追杀车辆，并把敌方残骸拖回城市。&lt;/td&gt;&lt;td&gt;活着回城并保住证据&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;伏击、接应者死亡、切入逃亡&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;20:30–21:30&lt;/time&gt; 定制逃亡枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Enforcer 席位与废车厂管理位同时空缺；追杀车辆被拖回。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;21:30–22:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L20 回城谋划与拆解追杀车&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;回收小游戏 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家先返回城市，与成员确认袭击路线并谋划反击；随后把 L19 击毁并拖回的黑手党车辆拆解，寻找敌方弱点和可用配件。&lt;/td&gt;&lt;td&gt;准备针对性反击&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;反击计划&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;21:40–22:10&lt;/time&gt; 拆解追杀车 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;获得复仇车辆所需配件与敌方车辆情报。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;22:10–23:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L21 改装第二辆车&lt;/div&gt;&lt;span class=&quot;dc-reward-vehicle&quot;&gt;剧情投放 &#183; 第 2 辆车&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;载具领取 &#215;1 / 改装小游戏 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;帮派从废车场找出一辆可修复车辆交给玩家；玩家用刚拆出的配件完成一次 30 秒改装，为复仇准备专用车辆。&lt;/td&gt;&lt;td&gt;获得能对抗战车的新载具&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;交付车辆&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;22:30–23:00&lt;/time&gt; 第二辆车改装 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-vehicle&quot;&gt;第 2 辆剧情车正式投放&lt;/span&gt;复仇任务开启。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;23:00–24:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L22 废车场复仇&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家驾驶第二辆车袭击黑手党车队，击溃伏击者并夺回遇害 Enforcer 的随身物与废车厂钥匙。&lt;/td&gt;&lt;td&gt;为接应者复仇&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;复仇目标与战果&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;23:10–24:10&lt;/time&gt; 枪战 SUP &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;24:10–24:20&lt;/time&gt; 取回遗物 / 返城&lt;/span&gt;&lt;/td&gt;&lt;td&gt;完成复仇证明；带回职位与建筑交接凭证。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;24:20–25:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L23 议会补位晋升 Enforcer&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;会议任命 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家在议会交回遇害者遗物并汇报复仇结果。由于原 Enforcer 已在 L19 死亡形成空缺，会长提名玩家补位，会议完成任命。&lt;/td&gt;&lt;td&gt;承担废车场与下属管理职责&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;交回遗物、提名、表决&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;24:40–25:00&lt;/time&gt; 会议确认&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;25:00–25:10&lt;/time&gt; 职级权限反馈&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;职位：Enforcer&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁废车回收厂接管&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;25:10–25:40&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L24 接管废车回收厂&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;点击接管 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家以 Enforcer 身份返回本帮废车回收厂，使用带回的钥匙完成内部管理权接管。&lt;/td&gt;&lt;td&gt;把职位授权落到建筑&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;内部接管反馈&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;25:20–25:30&lt;/time&gt; 点击接管&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;25:30–25:40&lt;/time&gt; 管理状态更新&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;废车回收厂&#183;内部接管&lt;/span&gt;进入建设循环。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;25:40–26:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L25 建设废车回收厂&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;子建筑升级 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家修复遭伏击后停摆的拆解工位，使废车回收厂恢复正式生产条件。&lt;/td&gt;&lt;td&gt;恢复零件生产&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;工位修复反馈&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;25:50–26:20&lt;/time&gt; 升级拆解工位&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;26:20–26:30&lt;/time&gt; 派遣位开放&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;废车回收厂 Lv.1&lt;/span&gt;开放成员派遣。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;26:30–27:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L26 接管成员并派遣废车厂&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;帮派树接管 &#215;1 / 派遣 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家在帮派树中接管一名 Full Patch 成员，再将其派遣到废车回收厂负责拆解工位。&lt;/td&gt;&lt;td&gt;让废车回收厂自动运行&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;成员安排&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;26:40–26:55&lt;/time&gt; 点击接管成员&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;26:55–27:10&lt;/time&gt; 派遣至废车厂&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;27:10–27:20&lt;/time&gt; 自动运行反馈&lt;/span&gt;&lt;/td&gt;&lt;td&gt;废车回收厂模拟经营循环开启；从拖回车辆与账目中引出第三幕内应调查。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;dc-act&quot; data-series=&quot;4&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;27:20–45:30&lt;/span&gt;&lt;b&gt;第三幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;推关调查、Roadman、商业街、比利叛变与加油站&lt;/b&gt;&lt;span&gt;玩家从追杀车辆与废车场账目查出路线泄露，以首次推关追回商业街账册；随后晋升 Roadman 并恢复商业街，揭出比利后追击处决并晋升 Road Captain，再接管加油站。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;推关 &#215;2、SUP &#215;1、接管 &#215;2、城建 &#215;2、议会 &#215;2。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;8 循环&lt;/b&gt;&lt;span&gt;首次推关 27:20–30:30&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Roadman&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Road Captain&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-system-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;27:20–30:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L27 首组推关&lt;/div&gt;&lt;span class=&quot;dc-system-first&quot;&gt;新系统解锁 &#183; 推关首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;推关 &#215;2&lt;/span&gt;&lt;/td&gt;&lt;td&gt;从 L18 拖回的追杀车辆与废车场账目发现路线泄露；玩家调查并清理两个内部藏点，追回商业街账册。&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;推关系统正式解锁&lt;/span&gt;Roadman 晋升议题开启。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;30:30–31:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L28 Roadman 晋升&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家提交追回的商业街账册；现任 Roadman 转任，由会议完成职位交接。&lt;/td&gt;&lt;td&gt;接管更大产业责任&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会议交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Enforcer 阶段完成废车场恢复与内应清理。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Roadman&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁商业街&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;31:30–33:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L29 接管商业街&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家以 Roadman 身份带回账册，本帮前任负责人交出钥匙；梅丽尔首次出场。&lt;/td&gt;&lt;td&gt;恢复钱产业管理&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;已先取得 Roadman 权限。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;商业街&#183;内部接管&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;33:00–34:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L30 建设商业街与支付佣金&lt;/div&gt;&lt;/td&gt;&lt;td&gt;恢复商铺并收钱；警长领取佣金并确认后续帮助义务。&lt;/td&gt;&lt;td&gt;恢复钱产出&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;建设/收取&lt;/span&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;商业街 Lv.1&lt;/span&gt;钱稳定产出开启。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;34:30–36:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L31 庆功与叛徒议会&lt;/div&gt;&lt;/td&gt;&lt;td&gt;成员庆功；议会公布比利泄密并投票处决，比利逃离。&lt;/td&gt;&lt;td&gt;制裁叛徒&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-lethal&quot;&gt;剥夺职位/制裁&lt;/span&gt;&lt;/td&gt;&lt;td&gt;比利失去 Road Captain 席位并形成空缺。&lt;/td&gt;&lt;td&gt;追击任务开启。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;36:30–39:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L32 追击比利与任命&lt;/div&gt;&lt;/td&gt;&lt;td&gt;追击 SUP &#215;1 → 处决/掩护 → 取回背章 → 议会任命。&lt;/td&gt;&lt;td&gt;填补队长空缺&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;追击叛徒&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;议会任命&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家取代比利；原 Roadman 席位由 NPC 补位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Road Captain&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁加油站&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;39:30–42:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L33 接管加油站&lt;/div&gt;&lt;/td&gt;&lt;td&gt;晋升后前往加油站，本帮前任负责人交出路线图与管理钥匙。&lt;/td&gt;&lt;td&gt;取得油产业&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Road Captain 已先解锁加油站。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;加油站&#183;内部接管&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;42:30–45:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L34 建设加油站&lt;/div&gt;&lt;/td&gt;&lt;td&gt;修复泵机、安排补给路线并收取首批油。&lt;/td&gt;&lt;td&gt;恢复油产出&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;建设/收取&lt;/span&gt;&lt;/td&gt;&lt;td&gt;前任经营者继续负责现场。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;加油站 Lv.1&lt;/span&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：油&#183;首次获得&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;5&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;45:30–60:30&lt;/span&gt;&lt;b&gt;第四幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;梅丽尔救援与物流中心&lt;/b&gt;&lt;span&gt;比利同党绑走梅丽尔；玩家带队救援并追回物流账本，再完成 Treasurer 与物流中心循环。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;推关 &#215;3、接管 &#215;1、城建 &#215;1、议会 &#215;1、英雄获得 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;4 循环&lt;/b&gt;&lt;span&gt;晋升 &#215;1 / 建筑循环 &#215;2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Treasurer&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;45:30–49:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L35 解救梅丽尔&lt;/div&gt;&lt;/td&gt;&lt;td&gt;比利同党绑走梅丽尔以销毁账目 → 玩家带队推关 &#215;3 → 救出梅丽尔并追回物流账本。&lt;/td&gt;&lt;td&gt;履行队长职责&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;救援行动&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家实际指挥三名 Roadman。&lt;/td&gt;&lt;td&gt;获得英雄梅丽尔；追回账本并开启 Treasurer 议题。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;49:30–51:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L36 财务官晋升&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家在议会交出账本和救援结果 → 戴尔因失察辞任并交出账册。&lt;/td&gt;&lt;td&gt;取得财务官席位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;辞任/议会交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家取代戴尔的一席；另外两席保留。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Treasurer&#183;三席之一&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁物流中心&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;51:30–56:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L37 接管物流中心&lt;/div&gt;&lt;/td&gt;&lt;td&gt;核对追回账本 → 本帮现场负责人交接仓库、车辆与排班表。&lt;/td&gt;&lt;td&gt;接管物资产线&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;物流中心始终属于本帮，玩家已先取得职位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;物流中心&#183;内部接管&lt;/span&gt;进入建设循环。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;56:30–60:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L38 建设物流中心&lt;/div&gt;&lt;/td&gt;&lt;td&gt;修复仓位、安排首条运输并收取第一批物资。&lt;/td&gt;&lt;td&gt;建立物资产出&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;建设/运输&lt;/span&gt;&lt;/td&gt;&lt;td&gt;原负责人转为现场协作。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：物资&#183;首次获得&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;物流中心 Lv.1&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;物资稳定产出开启&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;6&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;60:30–90:00&lt;/span&gt;&lt;b&gt;第五幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;叛徒残党、汉克回归与连续晋升&lt;/b&gt;&lt;span&gt;只用 SUP、推关、议会、城建处理本帮内部事件，不引入额外玩法系统。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP &#215;4、推关 &#215;6、议会 &#215;4、城建恢复 &#215;2。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;晋升 &#215;4&lt;/b&gt;&lt;span&gt;既有玩法复用&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Sergeant&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Senior&lt;/span&gt;&lt;span class=&quot;rc-tag rc-push&quot;&gt;推关战斗&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Vice President&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;President&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;60:30–64:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L39 武装队长切磋&lt;/div&gt;&lt;/td&gt;&lt;td&gt;议会复盘救援与产业恢复 → 使用钱、油、物资补给 → 友好枪战 SUP &#215;1。&lt;/td&gt;&lt;td&gt;证明战斗指挥能力&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;帮内切磋&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;职位交棒&lt;/span&gt;&lt;/td&gt;&lt;td&gt;现任者转任教官；玩家原 Treasurer 席位由 NPC 补位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Sergeant-at-arms&lt;/span&gt;开始管辖三名 Treasurer；沿用英雄养成。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;64:30–70:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L40 追回本帮物资&lt;/div&gt;&lt;/td&gt;&lt;td&gt;比利残党盗走物流中心物资 → 推关 &#215;3清理内部藏点 → SUP &#215;1护送物资返城 → 修复仓位。&lt;/td&gt;&lt;td&gt;守住本帮资产&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;复合行动&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;议会交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;完成行动后取代一名转任/退休的 Senior Members 席位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Senior Members&#183;三席之一&lt;/span&gt;物资回库；不新增系统。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;70:30–76:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L41 汉克回归&lt;/div&gt;&lt;/td&gt;&lt;td&gt;博邀请玩家迎接汉克出狱 → 车队护送 SUP &#215;1 → 议会确认汉克接受新的职责分工。&lt;/td&gt;&lt;td&gt;调和旧成员关系&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;元老履职&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与另外两名 Senior Members 同级。&lt;/td&gt;&lt;td&gt;获得副会长挑战提名；复用 SUP 与议会。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;76:30–82:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L42 副会长传统挑战&lt;/div&gt;&lt;/td&gt;&lt;td&gt;汉克与元老见证 → 改装/路线选择 → 竞速 SUP &#215;1 → 带队返程。&lt;/td&gt;&lt;td&gt;赢得副会长席位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;传统竞速&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;主动交棒&lt;/span&gt;&lt;/td&gt;&lt;td&gt;韦恩交棒；玩家原 Senior Members 席位由 NPC 补位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Vice President&lt;/span&gt;开始管辖三名 Senior Members；获得 Clubhouse 帮派管理权限。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;82:30–89:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L43 副会长履职&lt;/div&gt;&lt;/td&gt;&lt;td&gt;在 Clubhouse 召开议会 → 钱/油/物资补给 → 推关 &#215;3清理叛徒残余 → SUP &#215;1护送成员返城 → 修复建筑。&lt;/td&gt;&lt;td&gt;完成会长前履职&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;岗位代理&lt;/span&gt;&lt;/td&gt;&lt;td&gt;杰森仍任 President，玩家代理本次内部行动。&lt;/td&gt;&lt;td&gt;触发会长提名；不新增系统。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;89:30–90:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L44 会长和平交接&lt;/div&gt;&lt;/td&gt;&lt;td&gt;杰森提名科尔；全体议会表决。&lt;/td&gt;&lt;td&gt;玩家取代杰森；原 Vice President 席位由 NPC 补位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;退位/提名/选举&lt;/span&gt;&lt;/td&gt;&lt;td&gt;副会长履职证明完整领袖能力。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;President&lt;/span&gt;统辖副会长线；获得 Clubhouse 帮派管理权限；一日版结束。&lt;/td&gt;&lt;/tr&gt;

    &lt;/section&gt;

    &lt;section class=&quot;dc-section&quot;&gt;
      &lt;h2&gt;Part 3 &#183; 一日版本与正式版本分流&lt;/h2&gt;
      &lt;div class=&quot;dc-branch&quot;&gt;
        &lt;div&gt;&lt;h3&gt;正式版：官职链衔接大地图&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;60:30–64:30：枪战 SUP 切磋 → Sergeant-at-Arms。&lt;/li&gt;&lt;li&gt;64:30–70:30：追回本帮物资后进入大地图任务 → Senior Members。&lt;/li&gt;&lt;li&gt;70:30–76:30：迎接汉克回归并由议会选定地图目标。&lt;/li&gt;&lt;li&gt;76:30–82:30：竞速 SUP → Vice President，获得 Clubhouse 帮派管理权限。&lt;/li&gt;&lt;li&gt;82:30–89:30：以副会长身份完成一次大地图任务。&lt;/li&gt;&lt;li&gt;89:30–90:00：通过议会完成 President 交接。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h3&gt;一日版：同一官职链，重复既有玩法&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;60:30–64:30：枪战 SUP 完成武装队长切磋。&lt;/li&gt;&lt;li&gt;64:30–70:30：推关清理叛徒藏点，SUP 护送本帮物资返城。&lt;/li&gt;&lt;li&gt;70:30–76:30：迎接汉克回归，完成一次车队护送 SUP。&lt;/li&gt;&lt;li&gt;76:30–82:30：竞速 SUP 完成副会长挑战。&lt;/li&gt;&lt;li&gt;82:30–89:30：推关清理叛徒残余、SUP 护送返城并恢复建筑。&lt;/li&gt;&lt;li&gt;89:30–90:00：通过议会完成 President 交接。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;dc-warning&quot;&gt;&lt;strong&gt;改编边界：&lt;/strong&gt;七月 Demo 台本后段未确认的玩法不进入本方案；对应剧情功能统一改为“叛徒残党盗运本帮物资 → 推关清理内部藏点 → SUP 护送返城 → 城建修复”。所有城市建筑始终属于我方帮派。&lt;/div&gt;

        &lt;div&gt;&lt;b&gt;晋升 T3&lt;/b&gt;&lt;span&gt;玩家取代 Enforcer 后，才统一管辖三个 T2 席位。&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;

      &lt;h3 id=&quot;dc-source-roster&quot;&gt;飞书席位逐级核对&lt;/h3&gt;
      &lt;p class=&quot;dc-note&quot;&gt;下表逐格对应《DOBE世界观方案 - 摩托帮》“帮派树”工作表 C / F / J 三个位置；“填位人”和空白均按原表保留，不再自行省略或调换人物。&lt;/p&gt;

        &lt;tr&gt;&lt;td&gt;T10 President（会长）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;杰森“拉斯蒂”蒙哥马利&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T9 Vice President（副会长）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;韦恩&#183;“加斯”&#183;科瓦尔斯基&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T8 Senior Members（元老成员）&lt;/td&gt;&lt;td&gt;空白&lt;/td&gt;&lt;td&gt;汉克&#183;麦考密克&lt;/td&gt;&lt;td&gt;空白&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T7 Sergeant-at-arms（武装队长）&lt;/td&gt;&lt;td&gt;博&#183;蒙哥马尼&lt;/td&gt;&lt;td&gt;雷&#183;哈兰&lt;/td&gt;&lt;td&gt;填位人&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T6 Treasurer（财务官）&lt;/td&gt;&lt;td&gt;伊莱&#183;马多克斯&lt;/td&gt;&lt;td&gt;戴尔&#183;万斯&lt;/td&gt;&lt;td&gt;填位人&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T5 Road Captain（路线队长）&lt;/td&gt;&lt;td&gt;填位人&lt;/td&gt;&lt;td&gt;比利&#183;克鲁斯&lt;/td&gt;&lt;td&gt;填位人&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T4 Roadman（路线成员）&lt;/td&gt;&lt;td&gt;斯宾塞&#183;曼森&lt;/td&gt;&lt;td&gt;卡莱布&#183;奥尔森&lt;/td&gt;&lt;td&gt;填位人&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T3 Enforcer（打手）&lt;/td&gt;&lt;td&gt;填位人&lt;/td&gt;&lt;td&gt;科腾&#183;万斯&lt;/td&gt;&lt;td&gt;填位人&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T2 Full Patch（正式成员）&lt;/td&gt;&lt;td&gt;填位人&lt;/td&gt;&lt;td&gt;瓦尔特&#183;维尔&lt;/td&gt;&lt;td&gt;填位人&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T1 Prospect（见习）&lt;/td&gt;&lt;td&gt;雨果&#183;维尔&lt;/td&gt;&lt;td&gt;玩家角色&lt;/td&gt;&lt;td&gt;填位人&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

      &lt;h3&gt;职级对应功能&lt;/h3&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm rank-unlock-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;层级&lt;/th&gt;&lt;th&gt;职级&lt;/th&gt;&lt;th&gt;席位结构&lt;/th&gt;&lt;th&gt;建筑 / 系统解锁&lt;/th&gt;&lt;th&gt;功能解锁&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;T1&lt;/td&gt;&lt;td&gt;Prospect / 见习&lt;/td&gt;&lt;td&gt;每个 T2 下属 3 席；开局为雨果、玩家、1 个空席&lt;/td&gt;&lt;td&gt;改装厂&#183;仅使用权&lt;/td&gt;&lt;td&gt;打工、改车、MG-A；无管理/城建权限&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T2&lt;/td&gt;&lt;td&gt;Full Patch / 正式成员&lt;/td&gt;&lt;td&gt;三席同级层；每席管理 3 名 T1&lt;/td&gt;&lt;td&gt;改装厂&#183;正式接管/城建&lt;/td&gt;&lt;td&gt;管理直属见习、议会、正式成员任务、Enforcer 考核&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T3&lt;/td&gt;&lt;td&gt;Enforcer / 打手&lt;/td&gt;&lt;td&gt;管理 3 名 T2&lt;/td&gt;&lt;td&gt;废车回收厂、零件&lt;/td&gt;&lt;td&gt;复仇任务、推关首次解锁&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T4&lt;/td&gt;&lt;td&gt;Roadman / 路线成员&lt;/td&gt;&lt;td&gt;三席同级层&lt;/td&gt;&lt;td&gt;商业街、钱&lt;/td&gt;&lt;td&gt;商业街内部交接、警长交易&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T5&lt;/td&gt;&lt;td&gt;Road Captain / 路线队长&lt;/td&gt;&lt;td&gt;管理 3 名 T4&lt;/td&gt;&lt;td&gt;加油站、油&lt;/td&gt;&lt;td&gt;路线调度、远程补给、下级英雄&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T6&lt;/td&gt;&lt;td&gt;Treasurer / 财务官&lt;/td&gt;&lt;td&gt;三席同级层&lt;/td&gt;&lt;td&gt;物流中心、物资&lt;/td&gt;&lt;td&gt;管理钱、油、物资的消耗与运输；不新增系统&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T7&lt;/td&gt;&lt;td&gt;Sergeant-at-arms / 武装队长&lt;/td&gt;&lt;td&gt;管理 3 名 T6&lt;/td&gt;&lt;td&gt;获得下级英雄&lt;/td&gt;&lt;td&gt;沿用英雄养成，继续游玩 SUP/推关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T8&lt;/td&gt;&lt;td&gt;Senior Members / 元老成员&lt;/td&gt;&lt;td&gt;三席同级层&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;议会选择任务，继续游玩 SUP/推关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T9&lt;/td&gt;&lt;td&gt;Vice President / 副会长&lt;/td&gt;&lt;td&gt;管理 3 名 T8&lt;/td&gt;&lt;td&gt;枪械/载具投放节点&lt;/td&gt;&lt;td&gt;Clubhouse 帮派管理，继续游玩 SUP/推关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T10&lt;/td&gt;&lt;td&gt;President / 会长&lt;/td&gt;&lt;td&gt;顶层单席&lt;/td&gt;&lt;td&gt;Clubhouse、建筑升级解除限制&lt;/td&gt;&lt;td&gt;统辖副会长线；一日版终点&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;gt-foot&quot;&gt;职级名称参考“帮派树”revision 3872，功能参考“帮派树详细”revision 888；席位与管辖结构按本轮确认规则重画。&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-section succession-part&quot; id=&quot;dc-promotion-scenes&quot; aria-labelledby=&quot;succession-title&quot;&gt;
      &lt;h3 id=&quot;succession-title&quot;&gt;全职位晋升的游戏内表现&lt;/h3&gt;
      &lt;p class=&quot;dc-note&quot;&gt;本 Part 描述玩家在游戏中实际看到和操作的完整场景：任务进入、玩法证明、角色反应、职位交接、界面反馈与新权限首次使用。职位交接只是场景中的一个环节，建筑接管仍放在后续独立循环。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;晋升目标&lt;/th&gt;&lt;th&gt;玩法 TAG&lt;/th&gt;&lt;th&gt;席位与原职位关系&lt;/th&gt;&lt;th&gt;玩法证明&lt;/th&gt;&lt;th&gt;游戏内表现&lt;/th&gt;&lt;th&gt;取代结果与立即解锁&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;T1 Prospect&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平加入&lt;/span&gt;&lt;/td&gt;&lt;td&gt;入门席位&lt;/td&gt;&lt;td&gt;夺回货物、承受金发 NPC 牺牲并处决袭击者&lt;/td&gt;&lt;td&gt;玩家返回城镇后接受会长邀请，获得见习背章；帮派树首次弹出并显示职级等级与 Prospect 初始位置。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会长邀请/佩戴背章&lt;/span&gt;&lt;/td&gt;&lt;td&gt;成为 Prospect；获得改装厂基础使用权，无管理/城建权限&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T2 Full Patch&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平直接提升&lt;/span&gt;&lt;/td&gt;&lt;td&gt;特殊例外：玩家从 T1 进入 T2 空席，不要求原 Full Patch 离职&lt;/td&gt;&lt;td&gt;L13 首次议会确认玩家转正&lt;/td&gt;&lt;td&gt;议会复盘夺货与金发 NPC 牺牲；成员投票后，玩家进入空置的 T2 席位。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;和平直接提升&lt;/span&gt;&lt;/td&gt;&lt;td&gt;进入正式成员层；解锁改装厂现场接管与城建&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T3 Enforcer&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T2；原 Enforcer 在 L19 接应玩家时死亡&lt;/td&gt;&lt;td&gt;从赛后伏击中生还，换新车并完成枪战复仇&lt;/td&gt;&lt;td&gt;玩家带回遇害者遗物与废车厂钥匙；L23 议会确认其复仇与履职能力，并任命玩家补上空缺席位。&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;复仇证明&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会议补位&lt;/span&gt;&lt;/td&gt;&lt;td&gt;补位 T3 席；原 T2 席位补位；管辖三名 T2；解锁废车回收厂&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T4 Roadman&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;三席之一；现任 Roadman 转任&lt;/td&gt;&lt;td&gt;以 Enforcer 身份恢复废车场并通过推关追回商业街账册&lt;/td&gt;&lt;td&gt;玩家提交账册并完成内应清理；第三幕开场会议中现任 Roadman 转任，完成背章与商业街管理权限交接。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会议交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代一名 Roadman；另外两席仍为同级；解锁商业街正式接管&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T5 Road Captain&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T4；比利叛变失去席位&lt;/td&gt;&lt;td&gt;议会制裁 + SUP 追击&lt;/td&gt;&lt;td&gt;庆功后的议会公布比利罪证；玩家追上逃亡的比利，完成处决/掩护并取回背章，返程后被正式任命。&lt;span class=&quot;dc-transfer dc-transfer-lethal&quot;&gt;叛徒制裁&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;议会任命&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代比利；原 T4 席位补位；管辖三名 T4；解锁加油站&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T6 Treasurer&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;三席之一；戴尔持有其中一席&lt;/td&gt;&lt;td&gt;梅丽尔救援 + 追回物流账本&lt;/td&gt;&lt;td&gt;玩家交出救援中追回的账本；戴尔因失察辞任并递交财务账册，物流中心权限点亮。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;失察辞任/账册交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代戴尔的一席；另外两席仍是同级；解锁物流中心&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T7 Sergeant-at-arms&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T6；现任者转任教官&lt;/td&gt;&lt;td&gt;钱/油/物资补给 + 友好枪战 SUP&lt;/td&gt;&lt;td&gt;玩家完成补给和友好枪战；议会复盘时现任者转任教官并交出指挥权。&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;帮内切磋&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;指挥权交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代管理席；原 T6 席位补位；管辖三名 T6；获得下级英雄并沿用英雄养成&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T8 Senior Members&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-push&quot;&gt;推关战斗&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;三席之一；原席位者转任/退休&lt;/td&gt;&lt;td&gt;产业防卫&lt;/td&gt;&lt;td&gt;玩家通过推关和 SUP 完成产业防卫；原元老在议会复盘后让出席位。&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;复合行动&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会议交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代一席；另外两席仍是同级&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T9 Vice President&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T8；韦恩为现任者&lt;/td&gt;&lt;td&gt;传统竞速挑战&lt;/td&gt;&lt;td&gt;玩家选择改装与路线后和韦恩竞速；胜利并带队返程，韦恩当众主动交棒。&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;竞速&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;主动交棒&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代韦恩；原 T8 席位补位；管辖三名 T8；获得 Clubhouse 帮派管理权限&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T10 President&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;顶层单席；杰森为现任者&lt;/td&gt;&lt;td&gt;以副会长身份完成既有玩法循环&lt;/td&gt;&lt;td&gt;全体议会中杰森提名玩家；成员完成表决，杰森交出会长席位与 Clubhouse 权限。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;提名/选举/交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代杰森；原 T9 席位补位；统辖副会长线；一日版结束&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;org-rule-grid&quot;&gt;
        &lt;div&gt;&lt;b&gt;和平交接&lt;/b&gt;&lt;span&gt;晋升、转任、退休或主动让位，仍需明确转移席位和权限。&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;SUP / 切磋&lt;/b&gt;&lt;span&gt;竞速、追击、护送或枪战胜利提供取代资格。&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;推关 / 叛徒&lt;/b&gt;&lt;span&gt;代理带队、救援、组织防卫或清理内部叛徒。&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;会议确认&lt;/b&gt;&lt;span&gt;只承担最终任命与权限转移，纯演出控制在 10–30 秒。&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;div class=&quot;dc-source&quot;&gt;依据《一日渐进线汇总一图流》revision 67 中首个有效“基础信息”画板、《七月 Demo 台本》revision 4963、《DOBE世界观方案－摩托帮》revision 3872 与《帮派树详细》revision 888 调整；文档内标注“草稿，废弃不用”的后续画板未纳入。演出时间仅统计不可操作的纯演出；系统教学、选择、改装、领取、骑行与结算均计入可玩时间。&lt;/div&gt;
  &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#39;dobe-compressed-loops&#39;);
  if (!root) return;
  const sectionIds = {
    &#39;Part 3 &#183; 一日版本与正式版本分流&#39;:&#39;dc-version-branch&#39;,
    &#39;Part 4 &#183; 帮派树关系&#39;:&#39;dc-gang-tree&#39;
  };
  root.querySelectorAll(&#39;.dc-section&#39;).forEach(section =&gt; {
    const heading = section.querySelector(&#39;h2&#39;);
    const id = heading &amp;&amp; sectionIds[heading.textContent.trim()];
    if (!id) return;
    section.id = id;
    heading.id = `${id}-title`;
    section.setAttribute(&#39;aria-labelledby&#39;, heading.id);
  });
  const actIds = [&#39;dc-act-prologue&#39;,&#39;dc-act-1&#39;,&#39;dc-act-2&#39;,&#39;dc-act-3&#39;,&#39;dc-act-4&#39;,&#39;dc-act-5&#39;];
  root.querySelectorAll(&#39;.dc-act&#39;).forEach((act, index) =&gt; {
