  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;dobe-compressed-loops&quot;&gt;
  &lt;style&gt;
    #dobe-compressed-loops {

    &lt;div class=&quot;dc-kicker&quot;&gt;一日版本 &#183; 90 分钟渐进体验&lt;/div&gt;
    &lt;h1&gt;Dobe一日渐进规划&lt;/h1&gt;

    &lt;section class=&quot;dc-section dc-part&quot; id=&quot;dc-part-1&quot; aria-labelledby=&quot;dc-part-1-title&quot;&gt;
      &lt;h2 id=&quot;dc-part-1-title&quot;&gt;Part 1 &#183; 目前已确定的信息&lt;/h2&gt;
      &lt;p class=&quot;dc-note&quot;&gt;以下内容整理自《一日渐进线汇总一图流》的有效“基础信息”框；帮派树结构统一放到 Part 4。&lt;/p&gt;

      &lt;h3 id=&quot;dc-confirmed-docs&quot;&gt;关联文档&lt;/h3&gt;
      &lt;div class=&quot;dc-link-list&quot;&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/wiki/ZjSowGJvPiXaA5k3nokcHjHEnhe&quot;&gt;&lt;strong&gt;Dobe 记忆点梳理&lt;/strong&gt;&lt;span&gt;叙事与记忆点来源&lt;/span&gt;&lt;/a&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/wiki/OMqDwrtSaizj4lkssBHcH4R2nxd?sheet=JmzW2M&quot;&gt;&lt;strong&gt;DOBE世界观方案 - 摩托帮&lt;/strong&gt;&lt;span&gt;帮派世界观与职级命名来源&lt;/span&gt;&lt;/a&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/sheets/XDBMs2LLnhcjB1tTWZ5c570fnbd?sheet=d4nknv&quot;&gt;&lt;strong&gt;帮派树与章节体与会议&lt;/strong&gt;&lt;span&gt;章节节点与会议结构来源&lt;/span&gt;&lt;/a&gt;
        &lt;a target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; href=&quot;https://t6bdpf8yjg.feishu.cn/wiki/Url8w5jzIi7egukzDsHcR4y1nRi?sheet=5b3ec5&amp;amp;table=tblXtHbB5XD5buPw&amp;amp;view=vewnVSvZqi&quot;&gt;&lt;strong&gt;七月 Demo 台本&lt;/strong&gt;&lt;span&gt;商业街开始后的剧情顺序与场景元素来源&lt;/span&gt;&lt;/a&gt;
      &lt;/div&gt;

      &lt;h3 id=&quot;dc-confirmed-framework&quot;&gt;内容与成长框架&lt;/h3&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-confirmed-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;范围&lt;/th&gt;&lt;th&gt;已确定内容&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;叙事&lt;/td&gt;&lt;td&gt;以“记忆点”组织叙事推进&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;车配件养成&lt;/td&gt;&lt;td&gt;等级、品质&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;枪械养成&lt;/td&gt;&lt;td&gt;等级；星级仍待确认&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;英雄养成&lt;/td&gt;&lt;td&gt;等级、技能；星级仍待确认&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;SUP&lt;/td&gt;&lt;td&gt;竞速、枪战关、碰撞型枪战异化关&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;推关&lt;/td&gt;&lt;td&gt;独立战斗循环&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;城建&lt;/td&gt;&lt;td&gt;接管、碎片化升级、升级&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;模拟经营&lt;/td&gt;&lt;td&gt;确定采用小人投放并派遣至建筑工作；L20 首次教学接管一名 Prospect 并派遣至改装厂&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;待确认项&lt;/td&gt;&lt;td&gt;小游戏&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

      &lt;h3 id=&quot;dc-drop-overview&quot;&gt;投放总览&lt;/h3&gt;
      &lt;p class=&quot;dc-note&quot;&gt;“3 + 1 + 1”依次指剧情线、活动签到、首充三个渠道；仅记录当前已确认的投放数量，不补充未确认渠道。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-confirmed-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;投放内容&lt;/th&gt;&lt;th&gt;剧情线&lt;/th&gt;&lt;th&gt;活动签到&lt;/th&gt;&lt;th&gt;首充&lt;/th&gt;&lt;th&gt;当前合计&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;英雄&lt;/td&gt;&lt;td&gt;3 个&lt;/td&gt;&lt;td&gt;1 个&lt;/td&gt;&lt;td&gt;1 个&lt;/td&gt;&lt;td&gt;5 个&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;车&lt;/td&gt;&lt;td&gt;3 辆&lt;/td&gt;&lt;td&gt;1 辆&lt;/td&gt;&lt;td&gt;1 辆&lt;/td&gt;&lt;td&gt;5 辆&lt;/td&gt;&lt;/tr&gt;

    &lt;section class=&quot;dc-section dc-part&quot; id=&quot;dc-part-2&quot; aria-labelledby=&quot;dc-part-2-title&quot;&gt;
      &lt;h2 id=&quot;dc-part-2-title&quot;&gt;Part 2 &#183; 渐进规划&lt;/h2&gt;
      &lt;figure class=&quot;dc-journey-map dc-first30&quot; id=&quot;dc-journey-map&quot; aria-labelledby=&quot;dc-journey-map-title&quot;&gt;
        &lt;figcaption&gt;&lt;div&gt;&lt;b id=&quot;dc-journey-map-title&quot;&gt;方案 A &#183; 开局至首次推关晋升线索墙&lt;/b&gt;&lt;span&gt;展示至首次推关、逼问结束并晋升 Roadman&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;dc-journey-badge&quot;&gt;开局–Roadman&lt;/span&gt;&lt;/figcaption&gt;
        &lt;img class=&quot;dc-journey-image&quot; src=&quot;assets/plan-a-first30-flow.png&quot; alt=&quot;外乡人开局从高密度追逃剧情，经帮派接纳与产业经营，逐渐过渡到常规 SLG 推关的四阶段示意图&quot;&gt;
        &lt;div class=&quot;dc-density-scale&quot; aria-label=&quot;定制化内容密度递减&quot;&gt;&lt;b&gt;定制化内容密度&lt;/b&gt;&lt;span&gt;高 &#183; 专属追逃与角色演出&lt;/span&gt;&lt;i&gt;→&lt;/i&gt;&lt;span&gt;中高 &#183; 专属入帮流程&lt;/span&gt;&lt;i&gt;→&lt;/i&gt;&lt;span&gt;中 &#183; 系统教学承接&lt;/span&gt;&lt;i&gt;→&lt;/i&gt;&lt;span&gt;低 &#183; 常规 SLG 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-first30-grid&quot;&gt;
          &lt;article&gt;&lt;span&gt;0:00–3:20&lt;/span&gt;&lt;h3&gt;带货逃亡&lt;/h3&gt;&lt;p&gt;追警、伏击、回城均为强定制内容。&lt;/p&gt;&lt;b&gt;核心追求：货物资源&lt;/b&gt;&lt;/article&gt;
          &lt;article&gt;&lt;span&gt;3:20–14:00&lt;/span&gt;&lt;h3&gt;修车、竞速与入帮&lt;/h3&gt;&lt;p&gt;角色演出仍密集，但开始由养成与身份系统承接。&lt;/p&gt;&lt;b&gt;核心追求：帮派树等级（Prospect）&lt;/b&gt;&lt;/article&gt;
          &lt;article&gt;&lt;span&gt;14:00–22:00&lt;/span&gt;&lt;h3&gt;转正与改装厂&lt;/h3&gt;&lt;p&gt;定制任务减少，进入可复用的经营教学。&lt;/p&gt;&lt;b&gt;核心追求：城建等级（改装厂 1 级）&lt;/b&gt;&lt;/article&gt;
          &lt;article&gt;&lt;span&gt;22:00–30:00&lt;/span&gt;&lt;h3&gt;废车场与推关准备&lt;/h3&gt;&lt;p&gt;剧情只保留动机，玩法重心转向资源与战力准备。&lt;/p&gt;&lt;b&gt;核心追求：零件资源&lt;/b&gt;&lt;/article&gt;
        &lt;/div&gt;
        &lt;div class=&quot;dc-journey-outcome&quot;&gt;30 分钟后进入推关：核心追求切换为“推关进度”，定制内容降至常规 SLG 事件包装。&lt;/div&gt;
      &lt;/figure&gt;
      &lt;p class=&quot;dc-note&quot;&gt;先看整体因果与六幕承接关系，再逐幕查看分钟级循环。&lt;/p&gt;
      &lt;h3 id=&quot;dc-memory-structure-title&quot;&gt;帮派体验记忆结构&lt;/h3&gt;
      &lt;p class=&quot;dc-note&quot;&gt;&lt;strong&gt;核心幻想是归属感。&lt;/strong&gt;现有剧情结构不变，用四类场景表现增强每个关键节点。&lt;/p&gt;
      &lt;div class=&quot;dc-memory-grid&quot;&gt;
        &lt;div class=&quot;dc-memory-card&quot;&gt;&lt;b&gt;Routine &#183; 常态运作&lt;/b&gt;&lt;span&gt;改装厂 SOP、职能称谓、兄弟一起挣钱与经营。&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-memory-card&quot;&gt;&lt;b&gt;Rituals &#183; 权力仪式&lt;/b&gt;&lt;span&gt;背章、座次、木槌、投票、车队阵型与晋升反馈。&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-memory-card&quot;&gt;&lt;b&gt;Violation &#183; 边界越界&lt;/b&gt;&lt;span&gt;产业遭袭、成员被杀、内部泄密，明确触碰帮派底线。&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-memory-card&quot;&gt;&lt;b&gt;Sanction &#183; 绝对制裁&lt;/b&gt;&lt;span&gt;由会长或议会授权的追击与处置，强调集体秩序。&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;h3 id=&quot;dc-story-causal-title&quot;&gt;整体剧情因果&lt;/h3&gt;
      &lt;div class=&quot;dc-causal&quot;&gt;
        &lt;div&gt;&lt;b&gt;带货甩警&lt;/b&gt;&lt;br&gt;&lt;span&gt;玩家骑摩托摆脱警方&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;交货遇袭&lt;/b&gt;&lt;br&gt;&lt;span&gt;黑手党打坏摩托，金发 NPC 接应&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;修车与 1v1&lt;/b&gt;&lt;br&gt;&lt;span&gt;氮气维修后用竞速建立信任&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;改装厂爆炸&lt;/b&gt;&lt;br&gt;&lt;span&gt;货物被抢，会长要求先强化车辆&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;枪战反击&lt;/b&gt;&lt;br&gt;&lt;span&gt;夺回货物，金发 NPC 为玩家牺牲&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;加入摩托帮&lt;/b&gt;&lt;br&gt;&lt;span&gt;追杀压力转化为 Prospect 身份&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;见习证明与金发复仇&lt;/b&gt;&lt;br&gt;&lt;span&gt;维修打工、改装备战并袭击涉案车队&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;议会转正与经营&lt;/b&gt;&lt;br&gt;&lt;span&gt;转正后接管改装厂，派遣见习实现自动运行&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;赛车伏击与复仇&lt;/b&gt;&lt;br&gt;&lt;span&gt;接应者牺牲，玩家以第二辆车完成复仇并补位晋升&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;精准刺杀与内奸调查&lt;/b&gt;&lt;br&gt;&lt;span&gt;废车厂刚自动运行就遭精准袭击；新英雄救场后陪玩家推关追线并逼问代号&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;h3 id=&quot;dc-act-relations-title&quot;&gt;六幕关系&lt;/h3&gt;
      &lt;div class=&quot;dc-overview&quot; aria-label=&quot;六幕时间分配与承接关系&quot;&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;0–3:20&lt;/span&gt;&lt;b&gt;序幕&lt;/b&gt;&lt;span&gt;甩警 / 交货遇袭 / 枪战逃亡 / 回厂&lt;br&gt;4 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;3:20–14:00&lt;/span&gt;&lt;b&gt;第一幕&lt;/b&gt;&lt;span&gt;维修 / 竞速 / 失窃反击 / 正式加入&lt;br&gt;8 循环&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;14:00–30:50&lt;/span&gt;&lt;b&gt;第二幕&lt;/b&gt;&lt;span&gt;见习任务 / 金发复仇 / 转正 / 双产业&lt;br&gt;18 循环&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;30:50–46:00&lt;/span&gt;&lt;b&gt;第三幕&lt;/b&gt;&lt;span&gt;内奸调查 / 首次推关 / Roadman / 商业街 / 比利 / 加油站&lt;br&gt;8 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;46:00–60:30&lt;/span&gt;&lt;b&gt;第四幕&lt;/b&gt;&lt;span&gt;梅丽尔救援 / 物流中心&lt;br&gt;4 循环&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;dc-act-chip&quot;&gt;&lt;span&gt;60:30–90:00&lt;/span&gt;&lt;b&gt;第五幕&lt;/b&gt;&lt;span&gt;叛徒残党 / 汉克回归 / 晋升会长&lt;br&gt;6 循环&lt;/span&gt;&lt;/div&gt;

    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;1&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;0:00–3:20&lt;/span&gt;&lt;b&gt;序幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;甩警交货与黑手党伏击&lt;/b&gt;&lt;span&gt;玩家骑摩托甩掉警方后与摩托帮交货；黑手党突袭并打坏玩家的摩托，金发 NPC 接应玩家带货上车，双方完成逃亡枪战并把废车拖回改装厂。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;警匪追逐 SUP &#215;1、逃亡枪战 SUP &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;4 循环&lt;/b&gt;&lt;span&gt;SUP 各约 60s / 演出 10–30s&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;无&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-sup-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;0:00–1:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L01 警匪追逐&lt;/div&gt;&lt;span class=&quot;dc-first-badge dc-first-sup-badge&quot;&gt;新玩法解锁 &#183; SUP 首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;警匪追逐 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;无人机航拍公路，警方频道播报正在追击科尔；镜头下拉进入摩托车视角。&lt;/td&gt;&lt;td&gt;带货甩掉警方&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;航拍+警方播报+镜头接管&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;0:20–1:20&lt;/time&gt; 警匪追逐 SUP &#215;1：闪避、择路、甩脱&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;SUP 正式解锁：单局约 60 秒；本关不主动撞击警车&lt;/span&gt;成功甩警，进入交货地点。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;1:20–1:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L02 交货遇袭与金发 NPC 接应&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 兄弟完美接应&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;剧情接应 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与摩托帮正在交接货物，黑手党突然袭击并打坏玩家的摩托；帮派车辆形成阻挡阵型，金发 NPC 驾车贴靠接应，让玩家带货上车。&lt;/td&gt;&lt;td&gt;保住货物并活着离开&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;30s&lt;/strong&gt;&lt;br&gt;交货+突袭+上车&lt;/td&gt;&lt;td&gt;确认货物 / 跑向接应车 / 上车。&lt;/td&gt;&lt;td&gt;第一次感受到帮派撑腰；直接进入逃亡枪战。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;1:50–3:10&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L03 黑手党逃亡枪战&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;表现约束 &#183; 假友军协作&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;逃亡枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;帮派车辆仅在开局、无线电和结尾出现；玩家独立完成 SUP，边逃边反击，击毁追击车辆并脱离包围。&lt;/td&gt;&lt;td&gt;带着货物逃回城市&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;枪战目标+结果&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;2:00–3:00&lt;/time&gt; 逃亡枪战 SUP &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;3:00–3:10&lt;/time&gt; 友军重新汇合&lt;/span&gt;&lt;/td&gt;&lt;td&gt;击败追兵；决定回收玩家被打坏的摩托。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;3:10–3:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L04 拖车回改装厂&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 车队阵型 / 背章&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;收束演出 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家乘金发 NPC 车辆，损毁摩托置于拖车；众人按标准阵型回城，背心与背章首次清晰展示。&lt;/td&gt;&lt;td&gt;保住载具并获得临时落脚点&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;拖车回城蒙太奇&lt;/td&gt;&lt;td&gt;查看损毁摩托 / 抵达改装厂。&lt;/td&gt;&lt;td&gt;序幕结束；第一幕从改装厂内继续。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;2&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;3:20–14:00&lt;/span&gt;&lt;b&gt;第一幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;维修复车、1v1 竞速、失窃反击与加入帮派&lt;/b&gt;&lt;span&gt;金发 NPC 帮玩家修好摩托并安装氮气，以 1v1 竞速建立关系；返厂发现黑手党袭击并抢走货物，玩家取零件完成首次正式养成后反击。金发 NPC 为保护玩家死亡，玩家处决袭击者并被列入追杀名单，最终接受会长邀请加入摩托帮。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;维修 &#215;1、竞速 SUP &#215;1、废车回收 &#215;2、车辆养成 &#215;1、枪战 SUP &#215;1、手动处决 &#215;1、帮派树 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;8 循环 / 10m40s&lt;/b&gt;&lt;span&gt;SUP 各约 60s&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Prospect&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平加入&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p class=&quot;dc-note&quot;&gt;第一幕只建立帮派身份与职级概念：L12 才首次显示帮派树，玩家以 Prospect 进入初始节点；议会、Full Patch、改装厂接管与城建均顺延到后续重新设计。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;3:20–4:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L05 修复主角摩托与安装氮气&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新玩法 &#183; 改装/维修首次出现&lt;/span&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-A 改装 / 维修 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;金发 NPC 带玩家在改装厂修复序幕中被打坏的摩托，并提供氮气罐安装到机车上。&lt;/td&gt;&lt;td&gt;恢复行动能力&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;检查损伤+交付氮气&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;3:40–4:10&lt;/time&gt; 维修与氮气安装小游戏 &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;4:10–4:20&lt;/time&gt; 点火测试&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;摩托修复并获得氮气能力；不打开车辆养成界面&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;4:20–6:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L06 金发 NPC 1v1 竞速&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新玩法 &#183; 竞速 SUP 首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;1v1 竞速 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;金发 NPC 提议与玩家比一场；玩家驾驶刚修好的摩托，在比赛中首次使用氮气并取胜，随后两人一起返回改装厂。&lt;/td&gt;&lt;td&gt;测试车辆并建立信任&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;30s&lt;/strong&gt;&lt;br&gt;挑战+赛果+返程&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;4:30–5:30&lt;/time&gt; 1v1 竞速 SUP &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;5:30–6:00&lt;/time&gt; 赛果反馈 / 一同返厂&lt;/span&gt;&lt;/td&gt;&lt;td&gt;金发 NPC 认可玩家；接近改装厂时发现异常。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;6:00–6:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L07 改装厂爆炸与货物失窃&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 产业越界&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;剧情演出 / 反击任务&lt;/span&gt;&lt;/td&gt;&lt;td&gt;两人接近改装厂时发生爆炸；返回后发现作为帮派安全空间的改装厂遭袭、货物被抢；会长将其定性为对产业与帮派边界的侵犯，授权集体反击，但要求玩家先强化摩托。&lt;/td&gt;&lt;td&gt;夺回货物并查清内应&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s + 20s&lt;/strong&gt;&lt;br&gt;爆炸 / 会长判断&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;6:40–6:50&lt;/time&gt; 接取反击任务 / 前往废车厂&lt;/span&gt;&lt;/td&gt;&lt;td&gt;废车回收任务开启；目标是取得改装配件。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;6:50–8:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L08 废车回收取件&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新玩法 &#183; 废车回收首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;回收小游戏 &#215;2&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家前往废车回收厂，连续处理两辆废车，取得足够强化摩托的配件。&lt;/td&gt;&lt;td&gt;准备反击所需配件&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;任务说明+结算&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;7:00–7:30&lt;/time&gt; 回收 1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;7:40–8:10&lt;/time&gt; 回收 2&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;8:10–8:20&lt;/time&gt; 配件结算&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：零件&#183;首次获得&lt;/span&gt;返回改装厂进行真实车辆养成。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-feature-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;8:20–9:50&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L09 首次车辆养成改装&lt;/div&gt;&lt;span class=&quot;dc-first-badge&quot;&gt;新系统 &#183; 车辆养成首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;养成界面教学 &#215;1 / 配件安装 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家返回改装厂，金发 NPC 已完成一轮现场修复；他引导玩家首次打开车辆养成界面，把 L08 取得的配件正式安装到摩托上。&lt;/td&gt;&lt;td&gt;把零件转化为战斗能力&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;改装厂修复进度+界面引导&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;8:40–9:30&lt;/time&gt; 车辆养成界面 / 选择并安装配件&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;9:30–9:50&lt;/time&gt; 属性反馈 / 出发&lt;/span&gt;&lt;/td&gt;&lt;td&gt;真实车辆养成与配件槽开启；进入枪战反击。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;9:50–11:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L10 埋伏黑手党&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 帮派帮我&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;枪战 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;会长布置集体设伏；成员在开局和无线电中确认分工，玩家独立完成枪战 SUP，试图夺回被抢货物。&lt;/td&gt;&lt;td&gt;夺回货物&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;埋伏目标建立&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;10:10–11:10&lt;/time&gt; 枪战 SUP &#215;1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;11:10–11:20&lt;/time&gt; 夺回货物 / 结束演出切入&lt;/span&gt;&lt;/td&gt;&lt;td&gt;货物夺回；黑手党残余准备最后偷袭。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;11:20–12:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L11 金发 NPC 牺牲与手动处决&lt;/div&gt;&lt;span class=&quot;dc-sub&quot;&gt;剧情演出 / 手动处决 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;SUP 结束后，黑手党残余在最终演出中偷袭玩家；金发 NPC 挡下致命攻击并死亡。玩家制服袭击者，对方临死前宣称玩家已进入黑手党老大的名单，将被追杀至死。&lt;/td&gt;&lt;td&gt;为金发 NPC 复仇&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;30s&lt;/strong&gt;&lt;br&gt;偷袭+牺牲+临终威胁&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;12:00–12:20&lt;/time&gt; 玩家手动瞄准并处决袭击者&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;12:20–12:30&lt;/time&gt; 收束 / 返回城镇&lt;/span&gt;&lt;/td&gt;&lt;td&gt;金发 NPC 死亡；黑手党追杀主线成立。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;dc-first-gang-tree-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;12:30–14:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L12 会长邀请与加入摩托帮&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 庇护转化 / Prospect 背心&lt;/span&gt;&lt;span class=&quot;dc-system-first-gang-tree&quot;&gt;新系统解锁 &#183; 帮派树首次出现&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;加入剧情 &#215;1 / 帮派树教学 &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家返回城镇；会长说明追杀名单让玩家无法继续独行，而帮派已为他接应和还击；玩家接受庇护与邀请、穿上 Prospect 背心。界面首次展示帮派树、等级概念和玩家的初始位置。&lt;/td&gt;&lt;td&gt;获得组织保护、兄弟身份与反击资格&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;20s&lt;/strong&gt;&lt;br&gt;会长邀请&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;12:50–13:30&lt;/time&gt; 帮派树首次展示&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;13:30–14:00&lt;/time&gt; 职级/等级概念与初始节点说明&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-gang-tree-callout&quot;&gt;玩家以 Prospect 出现在帮派树初始位置&lt;/span&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;职位：Prospect&lt;/span&gt;第一幕结束。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;3&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;14:00–30:50&lt;/span&gt;&lt;b&gt;第二幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;见习复仇考核、正式转正与双产业经营&lt;/b&gt;&lt;span&gt;玩家先以 Prospect 身份通过维修打工和袭击涉案黑手党车队证明自己，把金发 NPC 的牺牲转化为第一阶段复仇行动；返程后由议会转正，再依次经营改装厂。随后赛车遭伏击，废车场 Enforcer 牺牲，玩家换车复仇并补位接管废车厂。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;维修 &#215;2、改装 &#215;2、议会 &#215;2、接管 &#215;2、城建 &#215;2、派遣 &#215;2、回收 &#215;3、竞速 SUP &#215;1、枪战 SUP &#215;3。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;18 循环 / 16m50s&lt;/b&gt;&lt;span&gt;首次推关约在 30:50 引出&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Full Patch&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平直接提升&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Enforcer&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p class=&quot;dc-note&quot;&gt;承接 L12：玩家只是刚加入的 Prospect，不能立即接管改装厂。必须先完成见习任务证明劳动、改装与战斗能力；其中枪战考核直接指向金发 NPC 的死亡，让“转正资格”和“为同伴复仇”成为同一条动机链。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;大纲&lt;/th&gt;&lt;th&gt;动机&lt;/th&gt;&lt;th&gt;纯演出&lt;/th&gt;&lt;th&gt;可玩行为 / 次数&lt;/th&gt;&lt;th&gt;奖励与接续&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;14:00–15:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L13 见习维修打工&lt;/div&gt;&lt;span class=&quot;dc-minigame&quot;&gt;MG-A 改装 / 维修 &#215;2&lt;/span&gt;&lt;/td&gt;&lt;td&gt;会长说明加入帮派不等于转正。玩家先在改装厂连续维修两辆帮派摩托，以劳动偿还落脚成本并证明基础技术。&lt;/td&gt;&lt;td&gt;完成第一项转正证明&lt;/td&gt;&lt;td class=&quot;dc-show&quot;&gt;&lt;strong&gt;10s&lt;/strong&gt;&lt;br&gt;两车委托&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;14:10–14:40&lt;/time&gt; 维修摩托 1&lt;/span&gt;&lt;span class=&quot;dc-step&quot;&gt;&lt;time&gt;14:50–15:20&lt;/time&gt; 维修摩托 2&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：钱&#183;首次获得&lt;/span&gt;成员认可玩家的技术，交出与金发 NPC 死亡相关的车队线索。&lt;/td&gt;&lt;/tr&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;4&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;30:50–46:00&lt;/span&gt;&lt;b&gt;第三幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;调查内奸、推关找线索、Roadman、商业街、比利叛变与加油站&lt;/b&gt;&lt;span&gt;承接废车厂派遣后的精准刺杀：会长派来的英雄单位驾肌肉车救场，并判断连续袭击说明内部有人泄露位置。两人通过首次推关击穿五个短节奏据点，再以挡风玻璃逼问 SUP 取得内奸代号；玩家回城受嘉奖晋升 Roadman，随后恢复商业街、揭出比利并完成制裁。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;推关 &#215;5、SUP &#215;2、接管 &#215;2、城建 &#215;2、议会 &#215;2。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;8 循环&lt;/b&gt;&lt;span&gt;首次推关与逼问 SUP 30:50–33:20&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Roadman&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Road Captain&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr class=&quot;dc-first-system-row&quot;&gt;&lt;td class=&quot;dc-time&quot;&gt;30:50–33:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L31 五关追线与挡风玻璃逼问&lt;/div&gt;&lt;span class=&quot;dc-system-first&quot;&gt;新系统解锁 &#183; 推关首次出现&lt;/span&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 挡风玻璃逼问&lt;/span&gt;&lt;span class=&quot;dc-sub&quot;&gt;推关 &#215;5 / 定制逼问 SUP &#215;1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家与新英雄沿黑手党联络链连续推过五个短节奏关卡，最后抓到负责传递位置的接头人。英雄把俘虏固定在肌肉车挡风玻璃上，玩家进入定制 SUP，一边高速驾驶和躲避追兵，一边制造压迫逼问口供。关卡结束时，对方交代了内奸代号，但不知道其真实姓名。&lt;/td&gt;&lt;td&gt;取得内奸可追查的身份线索&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;挡风玻璃逼问&lt;/span&gt;&lt;/td&gt;&lt;td&gt;推关 &#215;5（合计约 75s）→ 俘获转场 15s → 逼问 SUP &#215;1（约 60s）→ 获得内奸代号。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-first-system-callout&quot;&gt;推关系统正式解锁&lt;/span&gt;获得内奸代号，真实姓名仍未知；Roadman 晋升议题开启。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;33:20–34:20&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L32 回城嘉奖与 Roadman 晋升&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家与新英雄返回 Clubhouse，向会长提交内奸代号和五处联络点的战果。虽然尚未确认真实姓名，但玩家已经证明能够追查内部威胁并承担更大产业责任；会长公开嘉奖，会议安排现任 Roadman 转任，并完成职位交接。&lt;/td&gt;&lt;td&gt;取得继续查内奸所需的产业权限&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会议嘉奖 / 和平交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;恢复废车场自动经营、抵御精准刺杀、完成五关追线并取得内奸代号。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Roadman&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁商业街接管&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;34:20–35:40&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L33 接管商业街&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家以 Roadman 身份带回账册，本帮前任负责人交出钥匙；梅丽尔首次出场。&lt;/td&gt;&lt;td&gt;恢复钱产业管理&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;已先取得 Roadman 权限。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;商业街&#183;内部接管&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;35:40–37:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L34 建设商业街与支付佣金&lt;/div&gt;&lt;/td&gt;&lt;td&gt;恢复商铺并收钱；警长领取佣金并确认后续帮助义务。&lt;/td&gt;&lt;td&gt;恢复钱产出&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;建设/收取&lt;/span&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;商业街 Lv.1&lt;/span&gt;钱稳定产出开启。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;37:00–38:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L35 庆功与叛徒议会&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 内部越界 / 木槌表决&lt;/span&gt;&lt;/td&gt;&lt;td&gt;庆功中木槌落下、全场归位；证据摆上议会桌，成员确认比利泄密并投票剥夺背章与职位，比利逃离。&lt;/td&gt;&lt;td&gt;制裁叛徒&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-lethal&quot;&gt;剥夺职位/制裁&lt;/span&gt;&lt;/td&gt;&lt;td&gt;比利失去 Road Captain 席位并形成空缺。&lt;/td&gt;&lt;td&gt;追击任务开启。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;38:30–41:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L36 追击比利与任命&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 绝对制裁 / 席位前移&lt;/span&gt;&lt;/td&gt;&lt;td&gt;追击 SUP &#215;1 → 执行议会制裁 → 取回背章 → 木槌确认任命与车队位置。&lt;/td&gt;&lt;td&gt;填补队长空缺&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;追击叛徒&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;议会任命&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家取代比利；原 Roadman 席位由 NPC 补位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Road Captain&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁加油站&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;41:00–43:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L37 接管加油站&lt;/div&gt;&lt;/td&gt;&lt;td&gt;晋升后前往加油站，本帮前任负责人交出路线图与管理钥匙。&lt;/td&gt;&lt;td&gt;取得油产业&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Road Captain 已先解锁加油站。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;加油站&#183;内部接管&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;43:30–46:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L38 建设加油站&lt;/div&gt;&lt;/td&gt;&lt;td&gt;修复泵机、安排补给路线并收取首批油。&lt;/td&gt;&lt;td&gt;恢复油产出&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;建设/收取&lt;/span&gt;&lt;/td&gt;&lt;td&gt;前任经营者继续负责现场。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;加油站 Lv.1&lt;/span&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：油&#183;首次获得&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;5&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;46:00–60:30&lt;/span&gt;&lt;b&gt;第四幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;梅丽尔救援与物流中心&lt;/b&gt;&lt;span&gt;比利同党绑走梅丽尔；玩家带队救援并追回物流账本，再完成 Treasurer 与物流中心循环。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;推关 &#215;3、接管 &#215;1、城建 &#215;1、议会 &#215;1、英雄获得 &#215;1。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;4 循环&lt;/b&gt;&lt;span&gt;晋升 &#215;1 / 建筑循环 &#215;2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Treasurer&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;46:00–49:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L39 解救梅丽尔&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 兄弟救援&lt;/span&gt;&lt;/td&gt;&lt;td&gt;比利同党绑走梅丽尔以销毁账目 → 玩家带队推关 &#215;3 → 救出梅丽尔并追回物流账本。&lt;/td&gt;&lt;td&gt;履行“兄弟不会被丢下”的队长职责&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;救援行动&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家实际指挥三名 Roadman。&lt;/td&gt;&lt;td&gt;获得英雄梅丽尔；追回账本并开启 Treasurer 议题。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;49:30–51:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L40 财务官晋升&lt;/div&gt;&lt;/td&gt;&lt;td&gt;玩家在议会交出账本和救援结果 → 戴尔因失察辞任并交出账册。&lt;/td&gt;&lt;td&gt;取得财务官席位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;辞任/议会交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;玩家取代戴尔的一席；另外两席保留。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Treasurer&#183;三席之一&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;解锁物流中心&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;51:30–56:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L41 接管物流中心&lt;/div&gt;&lt;/td&gt;&lt;td&gt;核对追回账本 → 本帮现场负责人交接仓库、车辆与排班表。&lt;/td&gt;&lt;td&gt;接管物资产线&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;内部交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;物流中心始终属于本帮，玩家已先取得职位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;物流中心&#183;内部接管&lt;/span&gt;进入建设循环。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;56:00–60:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-building&quot;&gt;L42 建设物流中心&lt;/div&gt;&lt;/td&gt;&lt;td&gt;修复仓位、安排首条运输并收取第一批物资。&lt;/td&gt;&lt;td&gt;建立物资产出&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-tier&quot;&gt;建设/运输&lt;/span&gt;&lt;/td&gt;&lt;td&gt;原负责人转为现场协作。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-resource&quot;&gt;资源：物资&#183;首次获得&lt;/span&gt;&lt;span class=&quot;dc-reward-building&quot;&gt;物流中心 Lv.1&lt;/span&gt;&lt;span class=&quot;dc-reward-note&quot;&gt;物资稳定产出开启&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-act&quot; data-series=&quot;6&quot;&gt;
      &lt;div class=&quot;dc-act-head&quot;&gt;&lt;div&gt;&lt;span&gt;60:30–90:00&lt;/span&gt;&lt;b&gt;第五幕&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;叛徒残党、汉克回归与连续晋升&lt;/b&gt;&lt;span&gt;只用 SUP、推关、议会、城建处理本帮内部事件，不引入额外玩法系统。&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;可玩内容&lt;/b&gt;&lt;span&gt;SUP &#215;4、推关 &#215;6、议会 &#215;4、城建恢复 &#215;2。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-count&quot;&gt;&lt;b&gt;晋升 &#215;4&lt;/b&gt;&lt;span&gt;既有玩法复用&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dc-rank-change&quot;&gt;&lt;strong&gt;职级变动&lt;/strong&gt;&lt;span class=&quot;rc-rank&quot;&gt;Sergeant&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Senior&lt;/span&gt;&lt;span class=&quot;rc-tag rc-push&quot;&gt;推关战斗&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;Vice President&lt;/span&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;span class=&quot;rc-rank&quot;&gt;President&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;循环&lt;/th&gt;&lt;th&gt;玩法与剧情&lt;/th&gt;&lt;th&gt;原职位关系&lt;/th&gt;&lt;th&gt;交接方式&lt;/th&gt;&lt;th&gt;为什么能够晋升&lt;/th&gt;&lt;th&gt;奖励 / 新功能&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;60:30–64:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-sup&quot;&gt;L43 武装队长切磋&lt;/div&gt;&lt;/td&gt;&lt;td&gt;议会复盘救援与产业恢复 → 使用钱、油、物资补给 → 友好枪战 SUP &#215;1。&lt;/td&gt;&lt;td&gt;证明战斗指挥能力&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;帮内切磋&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;职位交棒&lt;/span&gt;&lt;/td&gt;&lt;td&gt;现任者转任教官；玩家原 Treasurer 席位由 NPC 补位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Sergeant-at-arms&lt;/span&gt;开始管辖三名 Treasurer；沿用英雄养成。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;64:30–70:30&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop dc-loop-push&quot;&gt;L44 追回本帮物资&lt;/div&gt;&lt;/td&gt;&lt;td&gt;比利残党盗走物流中心物资 → 推关 &#215;3清理内部藏点 → SUP &#215;1护送物资返城 → 修复仓位。&lt;/td&gt;&lt;td&gt;守住本帮资产&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;复合行动&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;议会交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;完成行动后取代一名转任/退休的 Senior Members 席位。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;Senior Members&#183;三席之一&lt;/span&gt;物资回库；不新增系统。&lt;/td&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td class=&quot;dc-time&quot;&gt;89:30–90:00&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dc-loop&quot;&gt;L48 会长和平交接&lt;/div&gt;&lt;span class=&quot;dc-memory&quot;&gt;记忆点 &#183; 最终座次 / 木槌交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;杰森提名科尔；成员按职级落座并表决，木槌确认后交出会长背章与主持位置。&lt;/td&gt;&lt;td&gt;玩家取代杰森；原 Vice President 席位由 NPC 补位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;退位/提名/选举&lt;/span&gt;&lt;/td&gt;&lt;td&gt;副会长履职证明完整领袖能力。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;dc-reward-role&quot;&gt;President&lt;/span&gt;统辖副会长线；获得 Clubhouse 帮派管理权限；一日版结束。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dc-section&quot;&gt;
      &lt;h2&gt;Part 3 &#183; 一日版本与正式版本分流&lt;/h2&gt;
      &lt;div class=&quot;dc-branch&quot;&gt;
        &lt;div&gt;&lt;h3&gt;正式版：官职链衔接大地图&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;60:30–64:30：枪战 SUP 切磋 → Sergeant-at-Arms。&lt;/li&gt;&lt;li&gt;64:30–70:30：追回本帮物资后进入大地图任务 → Senior Members。&lt;/li&gt;&lt;li&gt;70:30–76:30：迎接汉克回归并由议会选定地图目标。&lt;/li&gt;&lt;li&gt;76:30–82:30：竞速 SUP → Vice President，获得 Clubhouse 帮派管理权限。&lt;/li&gt;&lt;li&gt;82:30–89:30：以副会长身份完成一次大地图任务。&lt;/li&gt;&lt;li&gt;89:30–90:00：通过议会完成 President 交接。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h3&gt;一日版：同一官职链，重复既有玩法&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;60:30–64:30：枪战 SUP 完成武装队长切磋。&lt;/li&gt;&lt;li&gt;64:30–70:30：推关清理叛徒藏点，SUP 护送本帮物资返城。&lt;/li&gt;&lt;li&gt;70:30–76:30：迎接汉克回归，完成一次车队护送 SUP。&lt;/li&gt;&lt;li&gt;76:30–82:30：竞速 SUP 完成副会长挑战。&lt;/li&gt;&lt;li&gt;82:30–89:30：推关清理叛徒残余、SUP 护送返城并恢复建筑。&lt;/li&gt;&lt;li&gt;89:30–90:00：通过议会完成 President 交接。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;dc-warning&quot;&gt;&lt;strong&gt;改编边界：&lt;/strong&gt;七月 Demo 台本后段未确认的玩法不进入本方案；对应剧情功能统一改为“叛徒残党盗运本帮物资 → 推关清理内部藏点 → SUP 护送返城 → 城建修复”。所有城市建筑始终属于我方帮派。&lt;/div&gt;
    &lt;/section&gt;

      &lt;h3&gt;职级对应功能&lt;/h3&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm rank-unlock-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;层级&lt;/th&gt;&lt;th&gt;职级&lt;/th&gt;&lt;th&gt;席位结构&lt;/th&gt;&lt;th&gt;建筑 / 系统解锁&lt;/th&gt;&lt;th&gt;功能解锁&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;T1&lt;/td&gt;&lt;td&gt;Prospect / 见习&lt;/td&gt;&lt;td&gt;每个 T2 下属 3 席；开局为雨果、玩家、1 个空席&lt;/td&gt;&lt;td&gt;改装厂&#183;仅使用权&lt;/td&gt;&lt;td&gt;打工、改车、MG-A；无管理/城建权限&lt;/td&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td&gt;T4&lt;/td&gt;&lt;td&gt;Roadman / 路线成员&lt;/td&gt;&lt;td&gt;三席同级层&lt;/td&gt;&lt;td&gt;商业街、钱&lt;/td&gt;&lt;td&gt;商业街内部交接、警长交易&lt;/td&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td&gt;T8&lt;/td&gt;&lt;td&gt;Senior Members / 元老成员&lt;/td&gt;&lt;td&gt;三席同级层&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;议会选择任务，继续游玩 SUP/推关&lt;/td&gt;&lt;/tr&gt;

        &lt;tr&gt;&lt;td&gt;T10&lt;/td&gt;&lt;td&gt;President / 会长&lt;/td&gt;&lt;td&gt;顶层单席&lt;/td&gt;&lt;td&gt;Clubhouse、建筑升级解除限制&lt;/td&gt;&lt;td&gt;统辖副会长线；一日版终点&lt;/td&gt;&lt;/tr&gt;

    &lt;section class=&quot;dc-section succession-part&quot; id=&quot;dc-promotion-scenes&quot; aria-labelledby=&quot;succession-title&quot;&gt;
      &lt;h3 id=&quot;succession-title&quot;&gt;全职位晋升的游戏内表现&lt;/h3&gt;
      &lt;p class=&quot;dc-note&quot;&gt;本 Part 描述玩家在游戏中实际看到和操作的完整场景：任务进入、玩法证明、角色反应、职位交接、界面反馈与新权限首次使用。职位交接只是场景中的一个环节，建筑接管仍放在后续独立循环。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm dc-promotion-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;晋升目标&lt;/th&gt;&lt;th&gt;玩法 TAG&lt;/th&gt;&lt;th&gt;席位与原职位关系&lt;/th&gt;&lt;th&gt;玩法证明&lt;/th&gt;&lt;th&gt;游戏内表现&lt;/th&gt;&lt;th&gt;取代结果与立即解锁&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;T1 Prospect&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平加入&lt;/span&gt;&lt;/td&gt;&lt;td&gt;入门席位&lt;/td&gt;&lt;td&gt;夺回货物、承受金发 NPC 牺牲并处决袭击者&lt;/td&gt;&lt;td&gt;玩家返回城镇后接受会长邀请，获得见习背章；帮派树首次弹出并显示职级等级与 Prospect 初始位置。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会长邀请/佩戴背章&lt;/span&gt;&lt;/td&gt;&lt;td&gt;成为 Prospect；获得改装厂基础使用权，无管理/城建权限&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T2 Full Patch&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平直接提升&lt;/span&gt;&lt;/td&gt;&lt;td&gt;特殊例外：玩家从 T1 进入 T2 空席，不要求原 Full Patch 离职&lt;/td&gt;&lt;td&gt;L17 首次议会确认玩家完成见习任务并转正&lt;/td&gt;&lt;td&gt;玩家完成维修、改装与涉案车队复仇任务；L17 议会投票后进入空置的 T2 席位。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;和平直接提升&lt;/span&gt;&lt;/td&gt;&lt;td&gt;进入正式成员层；解锁改装厂现场接管与城建&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T3 Enforcer&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T2；原 Enforcer 在 L23 接应玩家时死亡&lt;/td&gt;&lt;td&gt;从赛后伏击中生还，换新车并完成枪战复仇&lt;/td&gt;&lt;td&gt;玩家带回遇害者遗物与废车厂钥匙；L27 议会确认其复仇与履职能力，并任命玩家补上空缺席位。&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;复仇证明&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会议补位&lt;/span&gt;&lt;/td&gt;&lt;td&gt;补位 T3 席；原 T2 席位补位；管辖三名 T2；解锁废车回收厂&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T4 Roadman&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;三席之一；现任 Roadman 转任&lt;/td&gt;&lt;td&gt;以 Enforcer 身份恢复废车场，抵御精准刺杀，并通过五关推关与逼问 SUP 取得内奸代号&lt;/td&gt;&lt;td&gt;玩家与会长派遣的英雄返回提交代号；会议公开嘉奖，现任 Roadman 转任，完成背章与商业街管理权限交接。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会议交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代一名 Roadman；另外两席仍为同级；解锁商业街正式接管&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T5 Road Captain&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T4；比利叛变失去席位&lt;/td&gt;&lt;td&gt;议会制裁 + SUP 追击&lt;/td&gt;&lt;td&gt;庆功后的议会公布比利罪证；玩家追上逃亡的比利，完成处决/掩护并取回背章，返程后被正式任命。&lt;span class=&quot;dc-transfer dc-transfer-lethal&quot;&gt;叛徒制裁&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;议会任命&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代比利；原 T4 席位补位；管辖三名 T4；解锁加油站&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T6 Treasurer&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;三席之一；戴尔持有其中一席&lt;/td&gt;&lt;td&gt;梅丽尔救援 + 追回物流账本&lt;/td&gt;&lt;td&gt;玩家交出救援中追回的账本；戴尔因失察辞任并递交财务账册，物流中心权限点亮。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;失察辞任/账册交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代戴尔的一席；另外两席仍是同级；解锁物流中心&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T7 Sergeant-at-arms&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T6；现任者转任教官&lt;/td&gt;&lt;td&gt;钱/油/物资补给 + 友好枪战 SUP&lt;/td&gt;&lt;td&gt;玩家完成补给和友好枪战；议会复盘时现任者转任教官并交出指挥权。&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;帮内切磋&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;指挥权交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代管理席；原 T6 席位补位；管辖三名 T6；获得下级英雄并沿用英雄养成&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T8 Senior Members&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-push&quot;&gt;推关战斗&lt;/span&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;三席之一；原席位者转任/退休&lt;/td&gt;&lt;td&gt;产业防卫&lt;/td&gt;&lt;td&gt;玩家通过推关和 SUP 完成产业防卫；原元老在议会复盘后让出席位。&lt;span class=&quot;dc-transfer dc-transfer-push&quot;&gt;复合行动&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;会议交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代一席；另外两席仍是同级&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T9 Vice President&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-sup&quot;&gt;SUP&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;管理 3 名 T8；韦恩为现任者&lt;/td&gt;&lt;td&gt;传统竞速挑战&lt;/td&gt;&lt;td&gt;玩家选择改装与路线后和韦恩竞速；胜利并带队返程，韦恩当众主动交棒。&lt;span class=&quot;dc-transfer dc-transfer-sup&quot;&gt;竞速&lt;/span&gt;&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;主动交棒&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代韦恩；原 T8 席位补位；管辖三名 T8；获得 Clubhouse 帮派管理权限&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T10 President&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;rc-tag rc-meeting&quot;&gt;会议&lt;/span&gt;&lt;span class=&quot;rc-tag rc-peace&quot;&gt;和平&lt;/span&gt;&lt;/td&gt;&lt;td&gt;顶层单席；杰森为现任者&lt;/td&gt;&lt;td&gt;以副会长身份完成既有玩法循环&lt;/td&gt;&lt;td&gt;全体议会中杰森提名玩家；成员完成表决，杰森交出会长席位与 Clubhouse 权限。&lt;span class=&quot;dc-transfer dc-transfer-peace&quot;&gt;提名/选举/交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;取代杰森；原 T9 席位补位；统辖副会长线；一日版结束&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;org-rule-grid&quot;&gt;
        &lt;div&gt;&lt;b&gt;和平交接&lt;/b&gt;&lt;span&gt;晋升、转任、退休或主动让位，仍需明确转移席位和权限。&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;SUP / 切磋&lt;/b&gt;&lt;span&gt;竞速、追击、护送或枪战胜利提供取代资格。&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;推关 / 叛徒&lt;/b&gt;&lt;span&gt;代理带队、救援、组织防卫或清理内部叛徒。&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;会议确认&lt;/b&gt;&lt;span&gt;只承担最终任命与权限转移，纯演出控制在 10–30 秒。&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;dc-source&quot;&gt;依据《一日渐进线汇总一图流》revision 67 中首个有效“基础信息”画板、《七月 Demo 台本》revision 4963、《DOBE世界观方案－摩托帮》revision 3872 与《帮派树详细》revision 888 调整；文档内标注“草稿，废弃不用”的后续画板未纳入。演出时间仅统计不可操作的纯演出；系统教学、选择、改装、领取、骑行与结算均计入可玩时间。&lt;/div&gt;

&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#39;dobe-compressed-loops&#39;);
  if (!root) return;
  const sectionIds = {
    &#39;Part 3 &#183; 一日版本与正式版本分流&#39;:&#39;dc-version-branch&#39;,
    &#39;Part 4 &#183; 帮派树关系&#39;:&#39;dc-gang-tree&#39;
  };
  root.querySelectorAll(&#39;.dc-section&#39;).forEach(section =&gt; {
    const heading = section.querySelector(&#39;h2&#39;);
    const id = heading &amp;&amp; sectionIds[heading.textContent.trim()];
    if (!id) return;
    section.id = id;
    heading.id = `${id}-title`;
    section.setAttribute(&#39;aria-labelledby&#39;, heading.id);
  });
  const actIds = [&#39;dc-act-prologue&#39;,&#39;dc-act-1&#39;,&#39;dc-act-2&#39;,&#39;dc-act-3&#39;,&#39;dc-act-4&#39;,&#39;dc-act-5&#39;];
  root.querySelectorAll(&#39;.dc-act&#39;).forEach((act, index) =&gt; {
    if (actIds[index]) act.id = actIds[index];
  });
  const versionHeadings = root.querySelectorAll(&#39;#dc-version-branch h3&#39;);
  if (versionHeadings[0]) versionHeadings[0].id = &#39;dc-version-formal&#39;;
  if (versionHeadings[1]) versionHeadings[1].id = &#39;dc-version-one-day&#39;;
  const rankFunctionHeading = [...root.querySelectorAll(&#39;#dc-gang-tree h3&#39;)].find(node =&gt; node.textContent.trim() === &#39;职级对应功能&#39;);
  if (rankFunctionHeading) rankFunctionHeading.id = &#39;dc-rank-functions&#39;;

  const partSelector = &#39;#dc-part-1, #dc-part-2, #dc-version-branch, #dc-gang-tree&#39;;
  root.querySelectorAll(partSelector).forEach(section =&gt; {
    section.classList.add(&#39;dc-part&#39;);
    const heading = [...section.children].find(node =&gt; node.tagName === &#39;H2&#39;);
    if (!heading) return;
    const body = document.createElement(&#39;div&#39;);
    body.className = &#39;dc-part-body&#39;;
    while (heading.nextSibling) body.appendChild(heading.nextSibling);
    section.appendChild(body);
    const toggle = document.createElement(&#39;button&#39;);
    toggle.type = &#39;button&#39;;
    toggle.className = &#39;dc-part-toggle&#39;;
    const setOpen = open =&gt; {
      toggle.setAttribute(&#39;aria-expanded&#39;, String(open));
      toggle.textContent = open ? &#39;收起&#39; : &#39;展开&#39;;
      body.hidden = !open;
      section.classList.toggle(&#39;is-collapsed&#39;, !open);
    };
    toggle._setPartOpen = setOpen;
    toggle.addEventListener(&#39;click&#39;, () =&gt; setOpen(toggle.getAttribute(&#39;aria-expanded&#39;) !== &#39;true&#39;));
    heading.appendChild(toggle);
    setOpen(section.id !== &#39;dc-part-1&#39;);
  });
  const expandContainingPart = target =&gt; {
    const section = target.matches(partSelector) ? target : target.closest(partSelector);
    const toggle = section &amp;&amp; section.querySelector(&#39;.dc-part-toggle&#39;);
    if (toggle &amp;&amp; toggle._setPartOpen) toggle._setPartOpen(true);
  };

  const tocItems = [
    { id:&#39;dc-overview&#39;, label:&#39;Dobe一日渐进规划&#39;, level:2 },
    { id:&#39;dc-part-1&#39;, label:&#39;Part 1 &#183; 已确定信息&#39;, level:2 },
    { id:&#39;dc-confirmed-docs&#39;, label:&#39;关联文档&#39;, level:3 },
    { id:&#39;dc-confirmed-framework&#39;, label:&#39;内容与成长框架&#39;, level:3 },
    { id:&#39;dc-drop-overview&#39;, label:&#39;投放总览&#39;, level:3 },
    { id:&#39;dc-confirmed-buildings&#39;, label:&#39;确定建筑与功能&#39;, level:3 },
    { id:&#39;dc-confirmed-anchors&#39;, label:&#39;版本锚点&#39;, level:3 },
    { id:&#39;dc-part-2&#39;, label:&#39;Part 2 &#183; 渐进规划&#39;, level:2 },
    { id:&#39;dc-journey-map&#39;, label:&#39;方案 A &#183; 开局至 Roadman 线索墙&#39;, level:3 },
    { id:&#39;dc-memory-structure-title&#39;, label:&#39;帮派体验记忆结构&#39;, level:3 },
    { id:&#39;dc-story-causal-title&#39;, label:&#39;整体剧情因果&#39;, level:3 },
    { id:&#39;dc-act-relations-title&#39;, label:&#39;六幕关系&#39;, level:3 },
    { id:&#39;dc-act-prologue&#39;, label:&#39;序幕 &#183; 被卷入&#39;, level:3 },
    { id:&#39;dc-act-1&#39;, label:&#39;第一幕 &#183; 见习与转正&#39;, level:3 },
    { id:&#39;dc-act-2&#39;, label:&#39;第二幕 &#183; 追杀与废车场&#39;, level:3 },
    { id:&#39;dc-act-3&#39;, label:&#39;第三幕 &#183; 商业街与叛徒&#39;, level:3 },
    { id:&#39;dc-act-4&#39;, label:&#39;第四幕 &#183; 救援与物流&#39;, level:3 },
    { id:&#39;dc-act-5&#39;, label:&#39;第五幕 &#183; 高阶晋升&#39;, level:3 },
    { id:&#39;dc-version-branch&#39;, label:&#39;Part 3 &#183; 版本分流&#39;, level:2 },
    { id:&#39;dc-version-formal&#39;, label:&#39;正式版大地图&#39;, level:3 },
    { id:&#39;dc-version-one-day&#39;, label:&#39;一日版重复游玩&#39;, level:3 },
    { id:&#39;dc-gang-tree&#39;, label:&#39;Part 4 &#183; 帮派树关系&#39;, level:2 },
    { id:&#39;dc-source-roster&#39;, label:&#39;飞书席位逐级核对&#39;, level:3 },
    { id:&#39;dc-rank-functions&#39;, label:&#39;职级对应功能&#39;, level:3 },
    { id:&#39;dc-promotion-scenes&#39;, label:&#39;全职位游戏内表现&#39;, level:3 }
  ].filter(item =&gt; document.getElementById(item.id));
  const tocNav = root.querySelector(&#39;#dobe-toc-nav&#39;);
  const tocList = document.createElement(&#39;ul&#39;);
  tocList.className = &#39;dc-toc-list&#39;;
  const links = new Map();
  const setActive = id =&gt; {
    links.forEach((link, key) =&gt; link.classList.toggle(&#39;is-active&#39;, key === id));
    const active = links.get(id);
    if (active) active.setAttribute(&#39;aria-current&#39;, &#39;location&#39;);
    links.forEach((link, key) =&gt; { if (key !== id) link.removeAttribute(&#39;aria-current&#39;); });
  };
  tocItems.forEach(item =&gt; {
    const listItem = document.createElement(&#39;li&#39;);
    listItem.className = &#39;dc-toc-item&#39;;
    const link = document.createElement(&#39;a&#39;);
    link.className = &#39;dc-toc-link&#39;;
    link.href = `#${item.id}`;
    link.dataset.level = String(item.level);
    link.textContent = item.label;
    link.addEventListener(&#39;click&#39;, event =&gt; {
      event.preventDefault();
      const target = document.getElementById(item.id);
      if (!target) return;
      expandContainingPart(target);
      const behavior = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;).matches ? &#39;auto&#39; : &#39;smooth&#39;;
      target.scrollIntoView({ behavior, block:&#39;start&#39; });
      setActive(item.id);
    });
    listItem.appendChild(link);
    tocList.appendChild(listItem);
    links.set(item.id, link);
  });
  tocNav.appendChild(tocList);
  setActive(&#39;dc-overview&#39;);
  if (&#39;IntersectionObserver&#39; in window) {
    const observer = new IntersectionObserver(entries =&gt; {
      const visible = entries.filter(entry =&gt; entry.isIntersecting).sort((a, b) =&gt; a.boundingClientRect.top - b.boundingClientRect.top);
      if (visible[0]) setActive(visible[0].target.id);
    }, { rootMargin:&#39;-8% 0px -76% 0px&#39;, threshold:[0, 1] });
    tocItems.forEach(item =&gt; observer.observe(document.getElementById(item.id)));
  }

  const headers = [&#39;时间&#39;,&#39;循环&#39;,&#39;动机&#39;,&#39;玩法与剧情 / 次数&#39;,&#39;游戏内表现&#39;,&#39;奖励与接续&#39;];
  const promotionIds = new Set([&#39;L12&#39;,&#39;L17&#39;,&#39;L27&#39;,&#39;L32&#39;,&#39;L36&#39;,&#39;L40&#39;,&#39;L43&#39;,&#39;L44&#39;,&#39;L46&#39;,&#39;L48&#39;]);
  const inGameScenes = {
    L01:&#39;无人机航拍公路并叠加警方追捕播报；镜头下拉进入摩托车视角，玩家完成警匪追逐 SUP，以闪避、择路和甩脱为主。&#39;,
    L02:&#39;交货时黑手党突然袭击并打坏玩家摩托；帮派车辆立刻形成阻挡阵型，金发 NPC 驾车贴靠接应玩家带货上车。&#39;,
    L03:&#39;帮派车辆只在开局、无线电和结尾演出中出现；玩家独立完成逃亡枪战 SUP，击毁追击车辆并脱离包围。&#39;,
    L04:&#39;玩家乘金发 NPC 车辆，损毁摩托置于拖车；众人按标准车队阵型回城，背心与背章首次清晰展示。&#39;,
    L05:&#39;金发 NPC 带玩家修复序幕中被打坏的摩托，并提供氮气罐；玩家完成一次约 30 秒的维修与安装小游戏，但不打开车辆养成界面。&#39;,
    L06:&#39;金发 NPC 邀请玩家进行 1v1 竞速 SUP；玩家驾驶刚修好的摩托使用氮气获胜，两人随后一同返回改装厂。&#39;,
    L07:&#39;作为帮派安全空间的改装厂遭袭、货物被抢；会长将其定性为对产业和帮派边界的侵犯，授权集体反击。&#39;,
    L08:&#39;玩家前往废车回收厂连续完成两次回收小游戏，取得足够配件并首次获得零件资源。&#39;,
    L09:&#39;金发 NPC 已完成一轮改装厂修复；玩家首次打开真实车辆养成界面，把回收所得配件正式安装到摩托上。&#39;,
    L10:&#39;会长布置集体设伏；成员在开局与无线电中确认分工，玩家独立完成枪战 SUP 并夺回货物。&#39;,
    L11:&#39;枪战结束后残余敌人偷袭玩家；金发 NPC 为保护玩家死亡。袭击者临死前宣称玩家已进入黑手党老大的追杀名单，随后由玩家手动处决。&#39;,
    L12:&#39;会长指出黑手党追杀让玩家无法继续独行，而帮派已经为他接应和还击；玩家接受庇护、穿上 Prospect 背心并进入帮派树初始节点。&#39;,
    L13:&#39;玩家以 Prospect 身份在改装厂连续维修两辆帮派摩托，第一次用劳动与技术证明自己并获得钱。&#39;,
    L14:&#39;成员提供与金发 NPC 死亡有关的车队线索；会长把复仇行动设为转正战斗任务，玩家改车并领取枪支。&#39;,
    L15:&#39;玩家完成枪战 SUP 袭击涉案黑手党车队，取回金发 NPC 的背章与物证，完成第一阶段复仇。&#39;,
    L16:&#39;车队按标准阵型护送金发 NPC 的背章与遗物返城；成员确认玩家完成见习证明并提交议会转正提名。&#39;,
    L17:&#39;金发 NPC 背心置于纪念位，成员致敬；众人按职级落座，会长以木槌主持投票并授予玩家 Full Patch 背章与改装厂资格。&#39;,
    L18:&#39;玩家以 Full Patch 身份返回本帮改装厂，现场成员交出钥匙与工位账册；玩家点击接管。&#39;,
    L19:&#39;玩家修复受损工位并完成首次子建筑升级，使改装厂恢复生产并开放派遣位。&#39;,
    L20:&#39;玩家在帮派树接管一名 Prospect，并派遣到改装厂实现自动运行。&#39;,
    L21:&#39;玩家接受赛车邀请，先在本帮废车场完成两次回收，再回改装厂安装配件。&#39;,
    L22:&#39;玩家穿 Full Patch 背心、从车队指定位置出列，代表帮派参加竞速 SUP 并赢得比赛。&#39;,
    L23:&#39;原 Enforcer 驾车贴靠接应、替玩家承受致命火力；玩家独立完成逃亡枪战 SUP 并把追杀车拖回城市。&#39;,
    L24:&#39;玩家回城汇报后，会长将袭击定性为越界并授权制裁；玩家与成员谋划反击，再拆解拖回的敌车。&#39;,
    L25:&#39;帮派交付一辆可修复车辆；玩家完成 30 秒改装，剧情线第 2 辆车正式投放。&#39;,
    L26:&#39;玩家执行会长授权的制裁，驾驶第二辆车摧毁涉案车队，取回遇害 Enforcer 的遗物与废车厂钥匙。&#39;,
    L27:&#39;遇害者遗物进入纪念位；会长以木槌确认补位投票，玩家更换 Enforcer 背章并移动到对应座席。&#39;,
    L28:&#39;玩家以 Enforcer 身份使用带回的钥匙，在本帮废车回收厂入口点击接管。&#39;,
    L29:&#39;玩家修复拆解工位并完成子建筑升级，使废车回收厂恢复生产并开放派遣位。&#39;,
    L30:&#39;玩家派遣 Full Patch 令废车场自动运行；黑手党摩托随即精准刺杀，会长派来的英雄驾驶肌肉车撞飞敌人，并指出帮派内部有人持续泄露玩家位置。&#39;,    L31:&#39;玩家与新英雄连续推过五个短节奏关卡锁定接头人，再把俘虏固定在肌肉车挡风玻璃上完成定制逼问 SUP，取得内奸代号但仍不知道真实姓名。&#39;,
    L32:&#39;玩家与新英雄带着代号返回；会长公开嘉奖，会议让现任 Roadman 转任并授予玩家背章与商业街接管权限。&#39;,
    L33:&#39;玩家以 Roadman 身份接管商业街，梅丽尔首次出场。&#39;,
    L34:&#39;玩家恢复商铺并收钱，警长领取佣金并确认帮助义务。&#39;,
    L35:&#39;庆功中木槌落下，证据被摆上议会桌；成员确认比利泄密并投票剥夺其背章与职位，比利逃走。&#39;,
    L36:&#39;玩家用 SUP 执行议会制裁并取回背章；返程后木槌确认其为 Road Captain，车队位置随之变化。&#39;,
    L37:&#39;玩家以 Road Captain 身份接管加油站。&#39;,
    L38:&#39;玩家修复泵机和补给路线，首批油进入库存。&#39;,
    L39:&#39;比利同党绑走梅丽尔；玩家以“兄弟不会被丢下”为职责带队连续推关救出她，并取回物流账本。&#39;,
    L40:&#39;玩家在议会交出救援结果和账本；戴尔因失察辞任并递交财务账册，物流中心权限点亮。&#39;,

    const body = document.body;

    #dc-journey-map .dc-clue-wire{position:absolute;z-index:1;inset:0;pointer-events:none;overflow:visible}.dc-clue-wire line{stroke:#b93c35;stroke-width:3.2;stroke-linecap:round;filter:drop-shadow(0 1px 1px #000);opacity:.82}.dc-clue-wire line.play{stroke:#36a9bf;stroke-dasharray:8 5}.dc-clue-wire line.gain{stroke:#d5a43a}
    #dc-journey-map .dc-clue-card.is-system{outline:2px solid rgba(129,84,164,.46)}.dc-clue-card.is-gain{box-shadow:0 9px 17px rgba(0,0,0,.48),0 0 0 2px rgba(213,164,58,.36)}
    #dc-journey-map .dc-phase-bar{grid-column:1/-1;position:relative;z-index:3;display:flex;align-items:center;gap:14px;min-height:54px;padding:9px 16px;border-top:2px solid #be443c;border-bottom:1px solid rgba(255,255,255,.18);background:linear-gradient(90deg,rgba(140,37,31,.5),rgba(23,23,20,.92) 55%,rgba(23,23,20,.55));box-shadow:0 8px 18px rgba(0,0,0,.35);color:#f4e6cc;transform:none}.dc-phase-bar b{font-size:17px;letter-spacing:.04em}.dc-phase-bar span{font-size:12px;color:#cbbda4}#dc-journey-map .dc-phase-bar.after{margin-top:4px;border-top-color:#d6a53d;background:linear-gradient(90deg,rgba(142,99,20,.52),rgba(23,23,20,.92) 55%,rgba(23,23,20,.55))}.dc-phase-bar::after{content:'◆';margin-left:auto;color:#d8ad58;font-size:18px}
    @media(max-width:900px){#dc-journey-map .dc-clue-wall{padding:12px}.dc-clue-head,.dc-clue-grid{min-width:980px!important}.dc-clue-grid{grid-template-columns:repeat(5,180px)!important}}
  `;
  const text = el => (el?.textContent || '').replace(/\s+/g,' ').trim();
  const parseStart = value => {
    const m = value.match(/(\d+):(\d+)/);
    return m ? Number(m[1]) + Number(m[2]) / 60 : 999;
  };
  const build = () => {
    const doc = frame?.contentDocument;
    if (!doc || doc.getElementById('dc-clue-wall-style')) return;
    const image = doc.querySelector('#dc-journey-map .dc-journey-image');
    if (!image) return;
    const style = doc.createElement('style');
    style.id = 'dc-clue-wall-style';
    style.textContent = css;
    doc.head.appendChild(style);
    const maxClueId = 32;
    const rows = [...doc.querySelectorAll('tr')].filter(row => { const id = text(row.querySelector('.dc-loop')).match(/L(\d+)/); return id && Number(id[1]) <= maxClueId; });
    if (!rows.length) { style.remove(); setTimeout(build, 120); return; }
    const phaseBreak = 17;
    const makePhase = (kind,title,caption) => { const bar = doc.createElement('div'); bar.className = 'dc-phase-bar ' + kind; bar.innerHTML = '<b>' + title + '</b><span>' + caption + '</span>'; return bar; };
    const wall = doc.createElement('div');
    wall.className = 'dc-clue-wall';
    wall.setAttribute('aria-label','开局至首次推关结束与 Roadman 晋升的剧情、玩法、系统与结果关系线索墙');
    wall.innerHTML = '<div class="dc-clue-head"><div><b>案件板 · 开局至首次推关晋升</b><br><small>完整展示剧情事件、玩法承接、系统解锁与 Roadman 晋升结果</small></div><div class="dc-clue-legend"><span><i class="plot"></i>剧情因果</span><span><i class="play"></i>玩法承接</span><span><i class="gain"></i>身份/建筑/资源结果</span></div></div><svg class="dc-clue-wire" aria-hidden="true"></svg><div class="dc-clue-grid"></div>';
    const grid = wall.querySelector('.dc-clue-grid');
    grid.appendChild(makePhase('before','前传 · L01–L17','外乡人被卷入冲突、获得庇护，并完成见习证明与议会转正'));
    rows.forEach((row,index) => {
      if (index === phaseBreak) grid.appendChild(makePhase('after','正式成员篇 · L18起','Full Patch 身份落地，开始接管建筑、城建与成员派遣'));
      const cells = row.cells;
      const loop = row.querySelector('.dc-loop');
      const title = text(loop);
      const time = text(cells[0]);
      const summary = text(cells[4]);
      const collect = selector => [...new Set([...row.querySelectorAll(selector)].map(text).filter(Boolean))].join(' · ');
      const play = collect('.dc-sub,.dc-minigame');
      const first = collect('.dc-first-badge,.dc-system-first-gang-tree,.dc-system-first-meeting,.dc-first-system-callout');
      const gain = collect('.dc-reward-role,.dc-reward-building,.dc-reward-resource,.dc-reward-vehicle,.dc-reward-hero');
      const card = doc.createElement('article');
      const isSystem = Boolean(first);
      const isGain = Boolean(gain);
      card.className = 'dc-clue-card' + (isSystem ? ' is-system' : '') + (isGain ? ' is-gain' : '');
      card.dataset.phase = index < phaseBreak ? 'before' : 'after';
      card.dataset.edge = isGain ? 'gain' : (isSystem || /SUP|小游戏|推关|骑行/.test(play) ? 'play' : 'plot');
      const shot = /警匪/.test(title)?0:/接应|交货/.test(title)?1:/牺牲|死亡|处决/.test(title)?8:/爆炸/.test(title)?5:/竞速|赛车/.test(title)?4:/废车|回收|拆/.test(title)?6:/维修|修建|改装|养成/.test(title)?3:/议会|加入|转正|帮派树|会长|接管成员|派遣/.test(title)?9:/枪战|袭击|伏击|反击|复仇/.test(title)?2:index%10;
      const px = [4,27,50,74,97][shot % 5];
      const py = shot < 5 ? 25 : 73;
      card.style.setProperty('--sprite', `url("${spriteUrl}")`);
      card.style.setProperty('--px', px + '%');
      card.style.setProperty('--py', py + '%');
      const chips = [];
      if (play) chips.push('<span class="dc-clue-chip play">' + play + '</span>');
      if (first) chips.push('<em>→</em><span class="dc-clue-chip system">' + first + '</span>');
      if (gain) chips.push('<em>→</em><span class="dc-clue-chip gain">' + gain + '</span>');
      card.innerHTML = '<i class="dc-clue-pin"></i><div class="dc-clue-photo" role="img" aria-label="' + title + '剧情照片"></div><div class="dc-clue-meta"><span>' + time + '</span><span>A-' + String(index + 1).padStart(2,'0') + '</span></div><h3>' + title + '</h3><p class="dc-clue-summary">' + summary + '</p><div class="dc-clue-flow">' + chips.join('') + '</div>';
      grid.appendChild(card);
    });
    image.replaceWith(wall);
    const svg = wall.querySelector('.dc-clue-wire');
    const draw = () => {
      const cards = [...grid.querySelectorAll('.dc-clue-card')];
      svg.replaceChildren();
      const wr = wall.getBoundingClientRect();
      svg.setAttribute('width', wall.scrollWidth);
      svg.setAttribute('height', wall.scrollHeight);
      svg.setAttribute('viewBox', '0 0 ' + wall.scrollWidth + ' ' + wall.scrollHeight);
      cards.slice(0,-1).forEach((card,index) => {
        const next = cards[index + 1];
        if (card.dataset.phase !== next.dataset.phase) return;
        const a = card.getBoundingClientRect();
        const b = next.getBoundingClientRect();
        const line = doc.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1', a.left - wr.left + wall.scrollLeft + a.width / 2);
        line.setAttribute('y1', a.top - wr.top + a.height / 2);
        line.setAttribute('x2', b.left - wr.left + wall.scrollLeft + b.width / 2);
        line.setAttribute('y2', b.top - wr.top + b.height / 2);
        line.setAttribute('class', next.dataset.edge || 'plot');
        svg.appendChild(line);
      });
    };
    requestAnimationFrame(draw);
    new ResizeObserver(draw).observe(grid);
  };
  frame?.addEventListener('load', () => setTimeout(build,0));
  setTimeout(build,0);
  let retries = 0;
  const retryTimer = setInterval(() => {
    if (frame?.contentDocument?.querySelector('.dc-clue-wall') || retries++ > 120) { clearInterval(retryTimer); return; }
    build();
  }, 500);
})();
</script>
</body>
</html>
